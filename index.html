<script>

var dark=t==="dark"||(t==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.style.colorScheme=dark?"dark":"light";}catch(e){}})();
</script>
<style>
/* Theme tokens: light is the default on :root.
   Dark applies only via html[data-theme="dark"] or system+OS dark.
   Never put prefers-color-scheme on bare :root — that broke Light when the phone was in dark mode. */
:root, html[data-theme="light"]{
  color-scheme: light;
  --bg:#f4f5f7;
  --bg-2:#eef0f3;
  --card:#ffffff;
  --elev:#ffffff;
  --ink:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#2563eb;
  --accent-soft:rgba(37,99,235,.10);
  --accent-ink:#ffffff;
  --in:#047857;
  --out:#b91c1c;
  --warn:#b45309;
  --nav:#ffffff;
  --overlay:rgba(15,23,42,.45);
  --input:#ffffff;
  --radius:14px;
  --shadow:0 1px 2px rgba(17,24,39,.04), 0 4px 14px rgba(17,24,39,.05);
  --ease:cubic-bezier(.22,1,.36,1);
  --hero-from:#2563eb;
  --hero-to:#1e40af;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121212;
  --bg-2:#1a1a1a;
  --card:#1c1c1e;
  --elev:#2c2c2e;
  --ink:#f3f4f6;
  --muted:#9ca3af;
  --line:#2e2e32;
  --accent:#60a5fa;
  --accent-soft:rgba(96,165,250,.14);
  --accent-ink:#0b1220;
  --in:#34d399;
  --out:#f87171;
  --warn:#fbbf24;
  --nav:#1c1c1e;
  --overlay:rgba(0,0,0,.55);
  --input:#2c2c2e;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --hero-from:#1d4ed8;
  --hero-to:#1e3a8a;
}
@media (prefers-color-scheme: dark){
  html[data-theme="system"], html:not([data-theme]){
    color-scheme: dark;
    --bg:#121212;
    --bg-2:#1a1a1a;
    --card:#1c1c1e;
    --elev:#2c2c2e;
    --ink:#f3f4f6;
    --muted:#9ca3af;
    --line:#2e2e32;
    --accent:#60a5fa;
    --accent-soft:rgba(96,165,250,.14);
    --accent-ink:#0b1220;
    --in:#34d399;
    --out:#f87171;
    --warn:#fbbf24;
    --nav:#1c1c1e;
    --overlay:rgba(0,0,0,.55);
    --input:#2c2c2e;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --hero-from:#1d4ed8;
    --hero-to:#1e3a8a;
  }
}
@media (prefers-color-scheme: light){
  html[data-theme="system"], html:not([data-theme]){
    color-scheme: light;
    --bg:#f4f5f7;
    --bg-2:#eef0f3;
    --card:#ffffff;
    --elev:#ffffff;
    --ink:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#2563eb;
    --accent-soft:rgba(37,99,235,.10);
    --accent-ink:#ffffff;
    --in:#047857;
    --out:#b91c1c;
    --warn:#b45309;
    --nav:#ffffff;
    --overlay:rgba(15,23,42,.45);
    --input:#ffffff;
    --shadow:0 1px 2px rgba(17,24,39,.04), 0 4px 14px rgba(17,24,39,.05);
    --hero-from:#2563eb;
    --hero-to:#1e40af;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:14px 16px 20px}
h1{font-size:13px;font-weight:600;color:var(--muted);margin:4px 0 2px;letter-spacing:.02em}
h2{font-size:15px;font-weight:650;margin:20px 0 8px;letter-spacing:-.01em}
.big{font-size:36px;font-weight:720;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px;margin:8px 0;box-shadow:var(--shadow)}
.card.tap{cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.card.tap:active{transform:scale(.985)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row > div{min-width:0;flex:1}
.row > b,.row > .num{flex-shrink:0;text-align:right}
.row+.row{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.muted{color:var(--muted);font-size:13px}
.in{color:var(--in)} .out{color:var(--out)} .warn{color:var(--warn)}
.seg{display:flex;gap:4px;background:var(--bg-2);border-radius:12px;padding:4px;border:1px solid var(--line)}
.seg button{flex:1 1 0;min-width:0;border:0;background:transparent;color:var(--muted);padding:8px 6px;border-radius:9px;font-family:inherit;font-size:12px;font-weight:650;line-height:1.2;white-space:nowrap;transition:background .15s var(--ease),color .15s var(--ease)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
body.locked #nav,body.locked nav{display:none!important;pointer-events:none!important;height:0!important;overflow:hidden!important;border:0!important;padding:0!important}
body.locked #app{padding-bottom:24px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;z-index:5;
  padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:10px 0;border-radius:10px;transition:color .15s var(--ease)}
nav button.on{color:var(--accent)}
nav .add{flex:0 0 56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  font-size:30px;line-height:1;margin-top:-28px;box-shadow:0 6px 18px rgba(47,79,216,.35);font-weight:400;
  transition:transform .15s var(--ease)}
nav .add:active{transform:scale(.94)}
.sheet-bg{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  animation:fadeIn .18s var(--ease)}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:92vh;overflow:auto;
  animation:sheetUp .28s var(--ease);
  box-shadow:0 -8px 40px rgba(0,0,0,.18)}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:99px;background:var(--line);margin:2px auto 12px}
@keyframes sheetUp{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .sheet,.sheet-bg,.card.tap,nav .add,.seg button,.btn,.chip{animation:none!important;transition:none!important}
}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px;letter-spacing:.01em}
input,select,textarea{background:var(--input);color:var(--ink);width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px 13px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
input[type="checkbox"],input[type="radio"]{width:18px;height:18px;min-height:18px;min-width:18px;padding:0;margin:0;flex:0 0 auto;accent-color:var(--accent);box-shadow:none}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.amt{font-size:40px;font-weight:720;text-align:center;padding:16px 12px;letter-spacing:-.02em;border-radius:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:active{transform:scale(.97)}
.amt-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 4px}
.amt-chips .chip{padding:7px 12px;font-size:12px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);margin-top:14px;
  transition:transform .12s var(--ease),opacity .12s var(--ease);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn:active{transform:scale(.985);opacity:.92}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line);margin-top:10px;box-shadow:none}
.btn.danger{background:var(--bg);color:var(--out);border:1px solid var(--line);box-shadow:none}
.btn.small{font-size:13px;padding:8px 12px;width:auto;margin:0;border-radius:10px;box-shadow:none}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .empty-title{font-size:17px;font-weight:650;color:var(--ink);margin-bottom:6px}
.empty p{margin:0 0 14px;font-size:14px;line-height:1.5}
.toast{background:var(--elev);color:var(--ink);border:1px solid var(--line);position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:30;display:flex;gap:14px;align-items:center;
  box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fadeIn .2s var(--ease);max-width:min(92vw,420px)}
.toast button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;filter:brightness(1.35)}
.void{opacity:.5;text-decoration:line-through}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s var(--ease)}
.bar.warn i{background:var(--warn)}
.bar.out i{background:var(--out)}
.bar.in i{background:var(--in)}
.hero{padding:6px 2px 4px}
.hero .big{margin:4px 0}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow)}
.metric span{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.metric b{font-size:17px;font-weight:700}
.quick-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 4px}
.quick-grid button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 8px;font:inherit;font-size:13px;font-weight:650;box-shadow:var(--shadow)}
.quick-grid button:active{transform:scale(.97)}
.chart{width:100%;height:auto;display:block}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.home-filter{margin:4px 0 10px}
.home-filter select{padding:10px 12px}
.security-note{font-size:12px;color:var(--muted);line-height:1.5}
.due-pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.due-pill.over{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.limit-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}

.hero-nw{background:linear-gradient(145deg,var(--hero-from),var(--hero-to));color:#fff;border-radius:18px;padding:18px 16px;margin:12px 0;box-shadow:var(--shadow)}
.hero-nw .label{opacity:.9;font-size:13px}
.hero-nw .value{font-size:clamp(26px,8vw,34px);font-weight:720;margin:6px 0 12px;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.hero-nw .split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero-nw .split div{background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;min-width:0}
.hero-nw .split span{display:block;font-size:11px;opacity:.85}
.hero-nw .split b{display:block;overflow-wrap:anywhere;font-size:15px}
.wealth-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.wealth-pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.wealth-pill span{display:block;font-size:11px;color:var(--muted)}
.wealth-pill b{display:block;margin-top:2px;font-size:15px;font-weight:700;overflow-wrap:anywhere}
#app{max-width:560px;margin:0 auto}
nav{width:min(560px,100%);left:50%;right:auto;transform:translateX(-50%);border-radius:18px 18px 0 0}
nav button.add{width:52px;height:52px;margin-top:-12px;border-radius:16px;font-size:28px}
.btn,button.btn{min-height:44px}input:not([type="checkbox"]):not([type="radio"]):not([hidden]),select{min-height:44px;font-size:16px}
.month-sep{font-size:12px;font-weight:650;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.03em}


.home-toolbar{display:flex;align-items:flex-end;gap:10px;margin-bottom:8px}
.home-toolbar .home-filter{flex:1;margin:0}
.privacy-chip{flex-shrink:0;min-height:40px}
.method-card{cursor:pointer}
.members-only .metric span{font-weight:600}
textarea{width:100%;min-height:88px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;resize:vertical}

.expiry-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 2px}
.expiry-row input,.expiry-row select{min-width:0;width:100%}

.form-section{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px;background:var(--card)}
.form-section-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.lend-form label{margin-top:8px}
.lend-form .form-section label:first-of-type{margin-top:0}

.lend-hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:8px 0 14px;box-shadow:var(--shadow)}
.lend-hero .outstanding{font-size:28px;font-weight:720;letter-spacing:-.03em;line-height:1.15;margin:4px 0 2px}
.lend-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.lend-metric{background:var(--bg);border-radius:12px;padding:10px 12px}
.lend-metric span{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.lend-metric b{font-size:15px;font-variant-numeric:tabular-nums}
.lend-card{padding:14px 15px;overflow:hidden}
.lend-card .name{font-size:16px;font-weight:650;margin:0;line-height:1.25;word-break:break-word}
.lend-card .meta{font-size:12px;color:var(--muted);margin:4px 0 10px;line-height:1.35}

.lend-stat .lbl{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}

.lend-progress{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 0}
.lend-progress > i{display:block;height:100%;background:var(--accent);border-radius:99px;min-width:0;max-width:100%}
.lend-progress.prin > i{background:var(--accent)}

.lend-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:10px}
.status-pill{display:inline-block;font-size:11px;font-weight:650;padding:4px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted);max-width:100%;line-height:1.3}

.lend-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

const store = {
  get(){
    try{
      const v = localStorage.getItem(KEY);
      if(v != null) return v;
    }catch(e){}
    return Object.prototype.hasOwnProperty.call(mem, KEY) ? mem[KEY] : null;
  },
  // Throws unless the envelope is readable back from localStorage.
  // A memory copy is kept so the open session is not discarded, but that is not success.
  set(v){
    let cause = null;
    try{
      localStorage.setItem(KEY, v);
      const back = localStorage.getItem(KEY);
      if(back === v){
        delete mem[KEY];
        return {ok:true, persistent:true};
      }
      cause = new Error("Storage did not return the saved vault");
    }catch(e){
      cause = e;
    }
    mem[KEY] = v;
    const quota = cause && (cause.name === "QuotaExceededError" || /quota/i.test(String(cause.message || "")));
    const err = new Error(quota ? "Phone storage is full" : "Vault was not written to phone storage");
    err.name = quota ? "QuotaExceededError" : "StoragePersistError";
    err.cause = cause;
    throw err;
  }
};

/* Optional encrypted-backup destination. The vault data remains in existing encrypted storage. */
const BACKUP_DB="myfinance.backup-destination", BACKUP_STORE="handles", BACKUP_HANDLE_KEY="directory";
function backupDb(){return new Promise((resolve,reject)=>{if(!("indexedDB" in window))return reject(new Error("IndexedDB unavailable"));const req=indexedDB.open(BACKUP_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(BACKUP_STORE))req.result.createObjectStore(BACKUP_STORE);};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error("Backup settings storage unavailable"));});}
async function backupHandleGet(){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readonly"),req=tx.objectStore(BACKUP_STORE).get(BACKUP_HANDLE_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();});}
async function backupHandleSet(handle){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readwrite");tx.objectStore(BACKUP_STORE).put(handle,BACKUP_HANDLE_KEY);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};tx.onabort=()=>{db.close();reject(tx.error);};});}
async function backupHandleForget(){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readwrite");tx.objectStore(BACKUP_STORE).delete(BACKUP_HANDLE_KEY);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};});}
async function backupPermission(handle,request=false){if(!handle)return "missing";try{if(!handle.queryPermission)return "unsupported";let p=await handle.queryPermission({mode:"readwrite"});if(p!=="granted"&&request&&handle.requestPermission)p=await handle.requestPermission({mode:"readwrite"});return p;}catch(e){return "denied";}}

const blank=()=>({v:2,rate:104.16,display:"INR",accounts:[],holdings:[],sips:[],salaries:[],policies:[],purchases:[],snaps:[],history:[],lending:[],bankContacts:[],contacts:[],people:["Me","Father","Mother"],txns:[],audit:[],lastAcct:null,autoSip:true,autoSalary:true,hideBalances:false,onboardingDone:false});

const isSecureContext = window.isSecureContext === true;
function b64(u){
  const bytes=u instanceof Uint8Array?u:new Uint8Array(u);
  let t="";
  const CHUNK=0x8000;
  for(let i=0;i<bytes.length;i+=CHUNK){
    t+=String.fromCharCode.apply(null, bytes.subarray(i, i+CHUNK));
  }
  return btoa(t);
}
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function deriveKey(p, salt, iterations=KDF_ITER, extractable=false){
  const m = await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations, hash:"SHA-256"}, m, {name:"AES-GCM", length:256}, extractable, ["encrypt","decrypt"]);
}
async function seal(o, key, salt, iter, bio){
  key=key||CK; salt=salt||SALT; iter=iter||KDF_ITER;
  if(bio===undefined) bio=BIO;
  if(!key) throw new Error("No encryption key");
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(o)));
  return JSON.stringify({enc:2, salt:b64(salt), iterations:iter, iv:b64(iv), data:b64(ct), bio:bio||null});
}
async function unseal(env, key){
  const ct = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(env.iv)}, key, unb64(env.data));
  return JSON.parse(new TextDecoder().decode(ct));
}
function save(){
  if(!CK || !S) return Promise.resolve(false);
  const snap=S, key=CK, salt=SALT, iter=KDF_ITER, bio=BIO;
  const job = chain.then(async ()=>{
    store.set(await seal(snap, key, salt, iter, bio));
    clearPersistProblem();
    return true;
  }).catch(err=>{
    console.warn("save failed", err);
    const full = err && (err.name==="QuotaExceededError" || /quota|full/i.test(String(err.message||"")));
    const msg = full
      ? "Not saved — storage on this phone is full. Export a backup. This change is only in the current session."
      : "Not saved on this phone. This change is only in the current session until storage works.";
    showPersistProblem(msg);
    return false;
  });
  chain = job.then(v => v === true, () => false);
  return job;
}
function toastSaved(msg, undo){

}

function policyScheduleDates(p){
  // Instalments: commencement + i*freq months, i = 0 .. n-1, n = PPT years in periods.
  // Avoid month-end drift by always anchoring day-of-month via addM (clamps to month length).
  // Do not include dates after PPT end.
  const out=[];
  if(!p||!p.start||!(Number(p.premium)>0)) return out;
  const freq=Math.max(1, Number(p.freq)||1);
  const ppt=Number(p.ppt)||0;
  const end=policyPptEnd(p);
  let n;
  if(ppt>0) n=Math.max(1, Math.round(ppt*12/freq));
  else n=800; // open-ended until end/guard
  for(let i=0;i<n;i++){
    const d=i===0?p.start:addM(p.start, i*freq);
    if(end && d>end) break;
    out.push(d);
  }
  return out;
}
function policyPremiumsPaidToDate(p){
  const premium=Number(p.premium)||0;
  const pack=coverPremiumSlots(p);
  const covered=pack.covered;
  let total=0, histCount=0, recCount=0;
  for(const v of covered.values()){
    total+=Number(v.amount)||0;
    if(v.source==="historical") histCount++;
    else recCount++;
  }
  const paidCount=covered.size;
  const expectedCount=pack.schedule.length;
  return {
    total: Math.round(total*100)/100,
    count: paidCount,
    source: histCount && recCount ? "mixed" : histCount ? "historical" : recCount ? "recorded" : "none",
    histCount, histAmount: Math.round(histCount*premium*100)/100,
    recordedCount: (p.payments||[]).filter(x=>x&&x.date).length,
    recordedSum: Math.round(pack.recordedSum*100)/100,
    unmatched: pack.unmatched.length,
    expected: expectedCount*premium,
    expectedCount,
    remaining: Math.max(0, expectedCount-paidCount)*premium,
    remainingCount: Math.max(0, expectedCount-paidCount),
    paidThrough: (p.paidThrough||"").trim()
  };
}
function coverPremiumSlots(p){
  const schedule=policyScheduleDates(p);
  const covered=new Map();
  const premium=Number(p&&p.premium)||0;
  const paidThrough=(p&&p.paidThrough||"").trim();
  if(paidThrough){
    for(const d of schedule) if(d<=paidThrough) covered.set(d,{source:"historical", amount:premium});
  }
  const recorded=(p&&p.payments||[]).filter(x=>x&&x.date).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.id||"").localeCompare(String(b.id||"")));
  let recordedSum=0;
  const unmatched=[];
  for(const pay of recorded){
    const amt=Number(pay.amount);
    const amount=isFinite(amt)?amt:premium;
    recordedSum+=amount;
    if(paidThrough && pay.date<=paidThrough){
      let slot=null;
      for(const d of schedule){
        if(d<=pay.date && covered.get(d)?.source==="historical") slot=d;
      }
      const cur=slot&&covered.get(slot);
      if(cur && !cur.pay) covered.set(slot, {source:"historical", amount, pay});
      else unmatched.push(pay);
      continue;
    }
    let matched=null;
    for(const d of schedule){
      if(covered.has(d)) continue;
      if(d<=pay.date){ matched=d; break; }

    if(!matched){

    const n=(p.next||"").trim();
    const end=policyPptEnd(p);

function inspectAmt(v){
  if(v==null) return {ok:true, empty:true, value:0, decimals:0};
  let s=String(v).trim().replace(/\u00a0/g," ");
  if(!s) return {ok:true, empty:true, value:0, decimals:0};
  let neg=false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1).trim(); }
  s=s.replace(/[₹€$\s]/g,"");
  if(s.startsWith("-")){ neg=true; s=s.slice(1); }
  if(s.startsWith("+")) s=s.slice(1);
  if(!s) return {ok:false, error:"Enter a number."};
  if(/[^0-9.,]/.test(s)) return {ok:false, error:"Use digits with commas or one decimal separator."};
  if((s.match(/\./g)||[]).length>1) return {ok:false, error:"Too many decimal points."};
  const lastComma=s.lastIndexOf(","), lastDot=s.lastIndexOf(".");
  let decSep=null, grpSep=null;
  if(lastComma>=0 && lastDot>=0){
    if(lastComma>lastDot){ decSep=","; grpSep="."; }
    else { decSep="."; grpSep=","; }
  }else if(lastComma>=0){
    const parts=s.split(",");
    const tail=parts[parts.length-1];
    if(parts.length===2 && tail.length>=1 && tail.length<=2 && !/^0+$/.test(tail)) decSep=",";
    else grpSep=",";
  }else if(lastDot>=0) decSep=".";
  let intPart=s, frac="";
  if(decSep){
    const i=s.lastIndexOf(decSep);
    intPart=s.slice(0,i);
    frac=s.slice(i+1);
    if(!frac || /[^0-9]/.test(frac)) return {ok:false, error:"Incomplete decimal."};
    if(grpSep){
      const groups=intPart.split(grpSep);
      if(groups.some(g=>!g)) return {ok:false, error:"Misplaced separator."};
      if(groups.length>1){
        const last=groups[groups.length-1], first=groups[0], middles=groups.slice(1,-1);
        const western=last.length===3 && middles.every(p=>p.length===3) && first.length>=1 && first.length<=3;
        const indian=last.length===3 && middles.every(p=>p.length===2) && first.length>=1 && first.length<=2;
        if(!(western || indian)) return {ok:false, error:"Number separators are not a valid amount."};
      }
      intPart=groups.join("");
    }else intPart=intPart.replace(/[.,]/g,"");
  }else if(grpSep){
    const parts=s.split(grpSep);
    if(parts.some(p=>!p)) return {ok:false, error:"Misplaced separator."};
    if(parts.length>1){
      const last=parts[parts.length-1], first=parts[0], middles=parts.slice(1,-1);
      const western=last.length===3 && middles.every(p=>p.length===3) && first.length>=1 && first.length<=3;
      const indian=last.length===3 && middles.every(p=>p.length===2) && first.length>=1 && first.length<=2;
      const legacyHundreds=parts.length===2 && last==="00";
      if(!(western || indian || legacyHundreds)) return {ok:false, error:"Number separators are not a valid amount."};
    }
    intPart=parts.join("");
  }
  if(intPart!=="" && !/^\d+$/.test(intPart)) return {ok:false, error:"Not a valid amount."};
  if(frac && !/^\d+$/.test(frac)) return {ok:false, error:"Not a valid amount."};
  if(frac.length>6) return {ok:false, error:"Too many decimal places."};
  const n=Number((intPart||"0")+"."+(frac||"0"));
  if(!isFinite(n)) return {ok:false, error:"Not a valid amount."};
  return {ok:true, empty:false, value:neg?-Math.abs(n):n, decimals:frac.length};
}
function parseAmt(v){
  const r=inspectAmt(v);
  if(!r.ok) return null;
  return r.value;
}
function readAmt(v, opts){
  opts=opts||{};

  if(!r.ok) return r;

  if(r.decimals>max) return {ok:false, error:"Use at most "+max+" decimal places."};
  if(!opts.allowNegative && r.value<0) return {ok:false, error:"Enter a positive amount."};
  if(opts.required && (r.empty || (opts.positive && !(r.value>0)))) return {ok:false, error:r.empty?"Enter an amount.":"Enter an amount greater than zero."};
  return {ok:true, value:r.value, empty:!!r.empty};
}
function rejectAmt(raw, opts){

}

function balance(a){

function holdPos(h){
  let u=0,c=0;
  for(const t of S.txns){
    if(t.status!=="posted"||t.hold!==h.id) continue;
    if(t.type==="buy"||t.type==="open"||t.type==="adjust"){
      u+=Number(t.units)||0;
      c+=Number(t.cost)||0;
    }else if(t.type==="sell"){
      const units=Math.max(0, Number(t.units)||0);
      const f=u>0?Math.min(1, units/u):0;
      c-=c*f;
      u-=units;
    }
  }
  if(u<1e-9){ u=0; c=Math.max(0,c); }
  if(c<0) c=0;
  return {u:Math.round(u*1e6)/1e6, c:Math.round(c*100)/100, v:Math.round(u*(h.price||0)*100)/100};
}
function personPos(owner){
  // Informal IOUs from transfers only. Lending module uses loansReceivable/lendingPosition —
  // never mix loanId/lendingId/principalReduction/interestSettlement or lend/borrow types here
  // (that created phantom liabilities when repayments set negative pd).
  const m={};
  for(const t of S.txns){
    if(t.status!=="posted"||!t.person||!t.pd||!t.postings?.[0]) continue;
    if(t.loanId||t.lendingId||t.principalReduction||t.interestSettlement) continue;

    // No owner: count only in the family total, not on every member card.
    if(owner && (t.owner||"")!==owner) continue;
    // Legacy records may lack loanId but use loan-related notes
    const note=(t.note||"").toLowerCase();
    if(/\b(loan|lending|interest on loan|principal repay|borrowed from|lent to)\b/.test(note) && (t.person)){
      // Only skip if this person also appears in S.lending — avoid excluding ordinary transfers
      if((S.lending||[]).some(L=>(L.person||"").toLowerCase()===(t.person||"").toLowerCase())) continue;

}

function processDueAutomations(){
  if(!S) return {sips:0, salaries:0, skipped:0, sipBacklog:0, salaryBacklog:0};
  let sips=0, salaries=0, skipped=0;
  const MAX_EACH=36;
  const runs=x=>(x.status||"active")==="active";
  if(S.autoSip!==false){
    for(const x of S.sips){
      if(!runs(x)) continue;
      let guard=0;
      while(x.next && daysTo(x.next)<=0 && guard++<MAX_EACH){
        const a=acct(x.acct);
        const h=S.holdings.find(v=>v.id===x.hold)||{};
        const price=h.price>0?h.price:0;
        if(!(price>0)){
          skipped++;
          x.needsPrice=true;
          break;
        }
        x.needsPrice=false;
        if(!a||a.archived){
          skipped++;
          x.history=x.history||[];
          x.history.push({date:x.next,status:"missed",units:0,amount:x.amt,auto:true,note:"Account unavailable"});
          x.next=addM(x.next,x.freq||1);
          continue;
        }
        const units=Math.round((x.amt/price)*1e6)/1e6;
        const payDate=x.next;
        const n=S.txns.length;
        addTxn({type:"buy",date:payDate,note:"SIP (auto)",hold:x.hold,units,cost:x.amt,sip:x.id,postings:[{acct:x.acct,amt:-x.amt,cur:x.cur}]},{skipSave:true});
        if(S.txns.length===n){ x.next=addM(x.next,x.freq||1); continue; }
        x.history=x.history||[]; x.history.push({date:payDate,status:"paid",units,amount:x.amt,auto:true});
        x.next=addM(x.next,x.freq||1); sips++;
      }
    }
  }
  if(S.autoSalary!==false){
    for(const x of (S.salaries||[])){
      if(!runs(x)) continue;
      let guard=0;
      while(x.next && daysTo(x.next)<=0 && guard++<MAX_EACH){
        const payDate=x.next;
        const terms=salaryTermsAt(x, payDate);
        const a=acct(terms.acct);
        if(!a||a.archived){
          skipped++;
          x.history=x.history||[];
          x.history.push({date:payDate,status:"missed",amount:terms.amt,auto:true,note:"Account unavailable"});
          x.next=advanceSalaryNext(x, payDate);
          continue;
        }
        const n=S.txns.length;
        addTxn({type:"income",date:payDate,note:x.label||"Salary (auto)",cat:"Salary",person:x.person||"",owner:x.person||a.owner||"Me",salaryId:x.id,postings:[{acct:a.id,amt:terms.amt,cur:x.cur||a.cur}]},{skipSave:true});
        if(S.txns.length===n){ x.next=advanceSalaryNext(x, payDate); continue; }
        x.history=x.history||[]; x.history.push({date:payDate,status:"received",amount:terms.amt,auto:true});
        x.next=advanceSalaryNext(x, payDate); salaries++;
      }
    }
  }
  const still=(list)=> (list||[]).filter(x=>runs(x) && x.next && daysTo(x.next)<=0).length;
  const sipBacklog=still(S.sips), salaryBacklog=still(S.salaries);
  if(sips||salaries||skipped) save();
  return {sips, salaries, skipped, sipBacklog, salaryBacklog};
}

function applySectionSort(arr, section, accessors){
  // accessors: { name:fn, balance:fn, ... }
  const pref=getSortPref(section);
  if(pref.key==="manual" || !accessors[pref.key]) return sortedList(arr);
  const dir=pref.dir==="desc"?-1:1;
  return arr.slice().sort((a,b)=>{
    const va=accessors[pref.key](a), vb=accessors[pref.key](b);
    if(va==null&&vb==null) return 0;
    if(va==null) return 1;
    if(vb==null) return -1;
    if(typeof va==="number" && typeof vb==="number") return (va-vb)*dir;
    return String(va).localeCompare(String(vb), undefined, {sensitivity:"base", numeric:true})*dir;
  });
}

function sortedList(arr, key){
  // Manual Order = original array order. Never mutates arr.
  if(!arr||!arr.length) return arr||[];
  return arr.slice();
}

function applySortOrder(arr, orderedIds){
  if(!arr||!orderedIds) return;
  orderedIds.forEach((id,i)=>{ const x=arr.find(y=>y.id===id); if(x) x.sortOrder=i; });
}
function getNwPrefs(){
  const d=defaultNwPrefs();
  const p=(S&&S.nwPrefs)||{};
  return {
    insuranceCoverage:!!(p.insuranceCoverage!=null?p.insuranceCoverage:d.insuranceCoverage),
    insuranceCash:!!(p.insuranceCash!=null?p.insuranceCash:d.insuranceCash),
    loansReceivable:!!(p.loansReceivable!=null?p.loansReceivable:d.loansReceivable),
    accruedInterest:!!(p.accruedInterest!=null?p.accruedInterest:d.accruedInterest)
  };
}
function loansReceivable(owner){
  let receivable=0, payable=0, principalRecv=0, interestRecv=0;
  const prefs=getNwPrefs();
  for(const l of (S.lending||[])){
    const a=acct(l.account);
    if(owner && a && a.owner && a.owner!==owner) continue;
    if(owner && !a && owner!=="Me") continue;
    const p=lendingPosition(l);
    const prin=toDisplay(p.principalLeft, l.cur);
    const intL=toDisplay(p.interestLeft, l.cur);
    if(l.direction==="lent"){
      // Principal and interest prefs are independent
      if(prefs.loansReceivable){ receivable+=prin; principalRecv+=prin; }
      if(prefs.accruedInterest){ receivable+=intL; interestRecv+=intL; }
    } else {
      // Borrowed amounts are always liabilities (not controlled by receivable prefs)
      payable+=prin;
      payable+=intL; // interest owed on money we borrowed
    }
  }
  return {receivable, payable, principalRecv, interestRecv};
}

function insuranceValues(owner){
  const prefs=getNwPrefs();
  let coverage=0, cashValue=0;
  for(const p of (S.policies||[])){
    if(owner && (p.owner||"Me")!==owner) continue;
    const cur=p.cur||S.display||"INR";
    coverage+=toDisplay(Number(p.sum)||0, cur);
    const fv=Number(p.fundValue!=null?p.fundValue:(p.surrenderValue!=null?p.surrenderValue:0))||0;
    if(fv>0 && prefs.insuranceCash) cashValue+=toDisplay(fv, cur);
  }
  return {coverage, cashValue, coverageForAdjusted: prefs.insuranceCoverage?coverage:0};
}

function wealthBreakdown(owner){
  let cash=0, bank=0, dematCash=0, cardLiab=0, cardAsset=0, overdraft=0, holdings=0;
  for(const a of S.accounts){
    if(a.archived||(owner&&a.owner!==owner)) continue;
    const b=toDisplay(balance(a),a.cur);
    if(a.type==="cash"){ if(b>=0) cash+=b; else overdraft+=-b; }
    else if(a.type==="bank"){ if(b>=0) bank+=b; else overdraft+=-b; }
    else if(a.type==="demat"){ if(b>=0) dematCash+=b; else overdraft+=-b; }
    else if(a.type==="card"){ if(b<0) cardLiab+=-b; else cardAsset+=b; }
    else { if(b>=0) bank+=b; else overdraft+=-b; }
  }
  for(const h of S.holdings){ if(!(owner&&h.owner!==owner)) holdings+=toDisplay(holdPos(h).v,h.cur); }
  let iouIn=0, iouOut=0;
  for(const v of Object.values(personPos(owner))){ if(v>=0) iouIn+=v; else iouOut+=-v; }
  const loans=loansReceivable(owner);
  const ins=insuranceValues(owner);
  const liquid=cash+bank+dematCash+cardAsset;
  const invested=holdings+ins.cashValue;
  const owedToYou=loans.receivable+iouIn;
  const youOwe=cardLiab+overdraft+loans.payable+iouOut;
  const assets=liquid+invested+owedToYou;
  const liabilities=youOwe;
  return {
    cash, bank, demat:dematCash, holdings, invested, liquid,
    cardLiab, cardAsset, overdraft,
    loansReceivable:loans.receivable, loansPayable:loans.payable,
    loanPrincipal:loans.principalRecv, loanInterest:loans.interestRecv,
    iouIn, iouOut, owedToYou, youOwe,
    insuranceCoverage:ins.coverage, insuranceCash:ins.cashValue,
    assets, liabilities, total:assets-liabilities
  };
}
function valuationNotes(owner){
  let missing=0, undated=0, old=0;
  const cutoff=addDays(today(), -45);
  for(const h of (S.holdings||[])){
    if(owner && (h.owner||"Me")!==owner) continue;
    const pos=holdPos(h);
    if(!(pos.u>0)) continue;
    if(!(Number(h.price)>0)) missing++;
    else if(!h.priceAsOf) undated++;
    else if(h.priceAsOf<cutoff) old++;
  }
  return {missing, undated, old};
}
function valuationNoteHtml(owner){
  const n=valuationNotes(owner);
  if(!n.missing && !n.undated && !n.old) return "";
  const bits=[];
  if(n.missing) bits.push(n.missing+" holding"+(n.missing===1?"":"s")+" with no price (counted as zero)");
  if(n.old) bits.push(n.old+" price"+(n.old===1?"":"s")+" older than 45 days");
  if(n.undated) bits.push(n.undated+" price"+(n.undated===1?"":"s")+" with no recorded date");
  return `<p class="muted" style="margin-top:4px;font-size:12px;line-height:1.4">Valuation check: ${bits.join(" · ")}. Insurance cover is not part of actual net worth.</p>`;
}

function netWorthBreakdown(owner){
  const w=wealthBreakdown(owner);
  return {
    accounts:w.liquid, accountLiab:w.cardLiab+w.overdraft, holdings:w.holdings,
    personAssets:w.iouIn, personLiab:w.iouOut,
    loansRecv:w.loansReceivable, loansPay:w.loansPayable, insCash:w.insuranceCash,
    assets:w.assets, liabilities:w.liabilities, total:w.total
  };
}
function netWorth(owner){
  const w=wealthBreakdown(owner);
  const ins=insuranceValues(owner);
  const actual=w.total;
  const adjusted=actual+(ins.coverageForAdjusted||0);
  return {
    assets:w.assets, owed:w.liabilities, total:actual, actual,
    adjusted, adjustedNetWorth:adjusted,
    loansReceivable:w.loansReceivable, loansPayable:w.loansPayable,
    insuranceCoverage:w.insuranceCoverage, insuranceCash:w.insuranceCash,

}

}
function allocationHtml(owner){
  const w=wealthBreakdown(owner);
  const parts=[];
  if(w.liquid>0) parts.push(["Cash & bank", w.liquid]);
  if(w.holdings>0) parts.push(["Investments", w.holdings]);
  if(w.insuranceCash>0) parts.push(["Insurance value", w.insuranceCash]);
  if(w.owedToYou>0) parts.push(["Owed to you", w.owedToYou]);
  const total=parts.reduce((a,x)=>a+x[1],0); if(!total) return "";
  const colors=["var(--accent)","var(--in)","var(--warn)","#7c3aed"];
  const seg=parts.map(([n,v],i)=>{const pct=v/total*100; return {n,v,pct,el:`<span style="display:block;height:12px;width:${pct}%;background:${colors[i%colors.length]}"></span>`};});
  return `<h2>Asset mix</h2><div class="card"><div style="display:flex;overflow:hidden;border-radius:8px;gap:2px">${seg.map(x=>x.el).join("")}</div>${seg.map((x,i)=>`<div class="row"><span><i class="dot" style="background:${colors[i%colors.length]}"></i>${x.n}</span><b class="num">${fmtHide(x.v,S.display)} · ${Math.round(x.pct)}%</b></div>`).join("")}</div>`;
}

function txnRow(t){

  else { title=t.type in LBL?LBL[t.type]+esc(t.person||(S.holdings.find(h=>h.id===t.hold)||{}).name||t.cat||""):esc(t.cat||t.type); amt=(p.amt<0?"−":"+")+fmtHide(Math.abs(p.amt),p.cur); cls=p.amt<0?"out":"in"; }

}

<li>After the final PPT premium, next due moves past the PPT end so <b>overdue clears</b>.</li>
<li>Edit any field on the policy sheet if dates look wrong, then save.</li>
</ul></div>

<div class="card"><b>4. Contacts</b>
<p class="muted">Money → <b>Contacts</b> — one person, many bank accounts or UPI IDs.</p>
<ul class="muted" style="margin:6px 0 0;padding-left:18px;line-height:1.5">

<div class="card"><b>5. Family view</b>

</ul></div>

<div class="card"><b>6. Money, Activity, Plan</b>
<ul class="muted" style="margin:6px 0 0;padding-left:18px;line-height:1.5">

<li><b>Activity</b> — all transactions (via Home or More).</li>

<div class="card"><b>7. More & navigation</b>

function formatExpiryInput(raw){
  const digits=String(raw||"").replace(/\D/g,"").slice(0,4);
  if(digits.length<=2) return digits;
  return digits.slice(0,2)+"/"+digits.slice(2);
}
function parseExpiryParts(s){
  const n=formatExpiryInput(s);
  const m=/^(0[1-9]|1[0-2])\/(\d{2})$/.exec(n);
  return m?{mm:m[1],yy:m[2]}:null;
}
function isExpiryValid(s,opts){
  opts=opts||{};
  const p=parseExpiryParts(s); if(!p) return false;
  if(opts.allowPast) return true;
  const now=new Date(), cy=now.getFullYear()%100, cm=now.getMonth()+1;
  const y=+p.yy, mo=+p.mm;
  if(y>cy) return true; if(y<cy) return false; return mo>=cm;
}
function expiryPickerHtml(idPrefix, initial){
  const p=parseExpiryParts(initial||"")||{};
  const mm=p.mm||"";
  let yy=p.yy||"";
  // Prefer YY for storage display
  if(yy.length===4) yy=yy.slice(-2);
  return '<label>Card expiry</label>'+
    '<input type="hidden" id="'+idPrefix+'" value="'+esc(mm&&yy?(mm+"/"+yy):"")+'">'+
    '<div class="expiry-row">'+
    '<div><label class="sub">Month (MM)</label>'+
    '<input id="'+idPrefix+'_mm" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="MM" value="'+esc(mm)+'" autocomplete="cc-exp-month" aria-label="Expiry month"></div>'+
    '<div><label class="sub">Year (YY)</label>'+
    '<input id="'+idPrefix+'_yy" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="YY" value="'+esc(yy)+'" autocomplete="cc-exp-year" aria-label="Expiry year"></div>'+
    '</div>'+
    '<div class="muted">Example: 08 and 29 for August 2029. Stored as MM/YY.</div>';
}
function wireExpiryField(idPrefix){
  const hidden=document.getElementById(idPrefix);
  const mm=document.getElementById(idPrefix+"_mm");
  const yy=document.getElementById(idPrefix+"_yy");
  if(!hidden||!mm||!yy) return;
  const apply=function(){
    let m=(mm.value||"").replace(/\D/g,"").slice(0,2);
    let y=(yy.value||"").replace(/\D/g,"").slice(0,4);
    if(m.length===1) m="0"+m;
    if(y.length===4) y=y.slice(-2);
    if(mm.value!==m && m) mm.value=m;
    if(y.length===2 && yy.value!==y && (yy.value||"").replace(/\D/g,"").length>=2) yy.value=y;
    if(m.length===2 && y.length===2) hidden.value=m+"/"+y;
    else if(m||y) hidden.value="";
    else hidden.value="";
  };
  mm.addEventListener("input", function(){
    mm.value=(mm.value||"").replace(/\D/g,"").slice(0,2);
    apply();
  });
  yy.addEventListener("input", function(){
    yy.value=(yy.value||"").replace(/\D/g,"").slice(0,4);
    apply();
  });
  mm.addEventListener("blur", apply);
  yy.addEventListener("blur", apply);
  apply();
}
function readExpiryField(idPrefix, opts){
  opts=opts||{};
  const hidden=document.getElementById(idPrefix);
  const mmEl=document.getElementById(idPrefix+"_mm");
  const yyEl=document.getElementById(idPrefix+"_yy");
  let m=(mmEl&&mmEl.value||"").replace(/\D/g,"").slice(0,2);
  let y=(yyEl&&yyEl.value||"").replace(/\D/g,"").slice(0,4);
  if(m.length===1) m="0"+m;
  if(y.length===4) y=y.slice(-2);
  let v="";
  if(m||y) v=(m.length===2&&y.length===2)?(m+"/"+y):"";
  if(!v && hidden) v=formatExpiryInput(hidden.value||"");
  if(!m && !y && !v) return opts.required?{ok:false,error:"Enter the card expiry month and year."}:{ok:true,value:""};
  if(m && (m.length!==2 || +m<1 || +m>12)) return {ok:false,error:"Expiry month must be 01–12."};
  if(y && y.length!==2) return {ok:false,error:"Expiry year must be 2 digits (YY) or 4 digits (YYYY)."};
  if(!m || !y) return {ok:false,error:"Enter both expiry month and year."};
  v=m+"/"+y;
  const p=parseExpiryParts(v);
  if(!p) return {ok:false,error:"Enter a valid expiry month and year."};
  if(!isExpiryValid(v,{allowPast:!!opts.allowPast})) return {ok:false,error:"This expiry is in the past."};
  if(hidden) hidden.value=v;
  return {ok:true,value:v};
}

}

function backupTooLarge(text){ return String(text||"").length>6000000; }
function vaultHasUnsafeId(v, depth){
  if((depth||0)>14 || v==null) return false;
  if(Array.isArray(v)){
    if(v.length>80000) return true;
    return v.some(x=>vaultHasUnsafeId(x, (depth||0)+1));
  }
  if(typeof v==="object"){
    if(typeof v.id==="string" && /[<>"'&]/.test(v.id)) return true;
    return Object.values(v).some(x=>vaultHasUnsafeId(x, (depth||0)+1));
  }
  return false;
}
function refreshAmtPreview(){
  const prev=$("#amtPreview"), input=$("#amt");
  if(!prev||!input) return;
  const raw=String(input.value||"").trim();
  if(!raw){ prev.textContent=""; return; }
  const r=readAmt(raw,{required:true,maxDecimals:2,positive:true});
  if(!r.ok){ prev.textContent=r.error; return; }
  const a=acct($("#from")&&$("#from").value);
  const cur=(a&&a.cur)||S.display;
  prev.textContent="Will record "+fmt(r.value, cur);
}
function toast(msg, undo){
  const el=document.createElement("div"); el.className="toast"; el.innerHTML=`<span>${esc(msg)}</span>${undo?`<button>Undo</button>`:""}`;
  document.body.appendChild(el);
  const t=setTimeout(()=>el.remove(),5000);
  if(undo) el.querySelector("button").onclick=()=>{ clearTimeout(t); el.remove(); undo(); };
}

function matchHoldingCandidates(holdings, it, owner){
  // Production matcher used by CSV import. Returns 0, 1, or many candidates.
  const iEx=(it.exch||"").toUpperCase();
  const iIsin=(it.isin||"").trim();
  const iSym=(it.sym||"").toUpperCase();
  return (holdings||[]).filter(h=>{
    if((h.owner||"Me")!==(owner||"Me")) return false;
    const hEx=(h.exchange||"").toUpperCase();
    const hIsin=(h.isin||"").trim();
    if(iIsin && hIsin){
      if(iIsin!==hIsin) return false;
      return hEx===iEx;
    }
    // Symbol fallback only when ISIN missing on at least one side
    const hSym=(h.symbol||h.name||"").toUpperCase();
    if(hSym && iSym && hSym===iSym) return hEx===iEx;
    return false;
  });
}
function buildHoldPlanRow(holdings, it, owner){
  const candidates=matchHoldingCandidates(holdings, it, owner);
  if(candidates.length>1) return {H:null, it, kind:"ambiguous", note:"Multiple matches — skipped"};
  if(candidates.length===1){
    const H=candidates[0];
    // qty compare deferred to holdParse with holdPos
    return {H, it, kind:"matched"};
  }
  return {H:null, it, kind:"new"};
}
function applyHoldPlanMutations(plan, opts){
  // Pure-ish apply: opts={holdings, people, addTxn, uid, date}
  // Skips ambiguous BEFORE any create. Returns stats + new holdings list.
  const holdings=(opts.holdings||[]).slice();
  const people=(opts.people||[]).slice();
  const date=opts.date||"2020-01-01";
  const txns=[];
  let added=0, changed=0, price=0, skippedAmbiguous=0;
  for(const p of plan){
    if(p.kind==="ambiguous"){ skippedAmbiguous++; continue; }
    let H=p.H;
    if(!H){
      H={id:(opts.uid?opts.uid():("h"+added)), name:p.it.sym, type:"stock", cur:"INR", isin:p.it.isin, sector:p.it.sec, price:p.it.prev, owner:(opts.owner||"Me"), symbol:p.it.sym, exchange:p.it.exch||""};
      holdings.push(H);
      if(!people.includes(H.owner)) people.push(H.owner);
      added++;
      p.H=H;
      if(p.kind==="new" || !p.kind) txns.push({type:"open", hold:H.id});
    } else if(p.kind==="changed"){
      changed++;
      txns.push({type:"adjust", hold:H.id});
    } else price++;
  }
  const snapItems=plan.filter(p=>p.kind!=="ambiguous").map(p=>p.it);
  return {holdings, people, txns, added, changed, price, skippedAmbiguous, snapItems};
}

function parseCsvRows(text){
  // RFC-style CSV: quoted fields may contain commas and newlines
  const rows=[]; let row=[]; let cur=""; let q=false;
  const s=String(text||"").replace(/^\uFEFF/,"");
  for(let i=0;i<s.length;i++){
    const ch=s[i], next=s[i+1];
    if(q){
      if(ch==='"' && next==='"'){ cur+='"'; i++; }
      else if(ch==='"'){ q=false; }
      else cur+=ch;
    } else {
      if(ch==='"') q=true;
      else if(ch===',' || ch==='\t'){ row.push(cur.trim()); cur=""; }
      else if(ch==='\n' || (ch==='\r' && next==='\n')){
        if(ch==='\r') i++;
        row.push(cur.trim()); cur="";
        if(row.some(c=>c!=="")) rows.push(row);
        row=[];
      } else if(ch==='\r'){
        row.push(cur.trim()); cur="";
        if(row.some(c=>c!=="")) rows.push(row);
        row=[];
      } else cur+=ch;
    }
  }
  row.push(cur.trim());
  if(row.some(c=>c!=="")) rows.push(row);
  return rows;
}
function holdParse(text){
  if(!text||!String(text).trim()){ alert("Paste CSV data or choose a file first."); return; }
  const owner=($("#howner")&&$("#howner").value)||"Me";
  const rows=parseCsvRows(text);
  if(rows.length<2){ alert("Need a header row and at least one data row."); return; }
  const headers=rows[0].map(h=>String(h).toLowerCase().replace(/[^a-z0-9]/g,""));
  const col=(names)=>{ for(const n of names){ const i=headers.indexOf(n); if(i>=0) return i; } return -1; };
  const iSym=col(["symbol","sym","ticker","tradingsymbol","scrip","name","security","instrument"]);
  const iQty=col(["qty","quantity","qty","units","holding","availableqty","freefloat"]);
  const iAvg=col(["avg","average","avgprice","averageprice","buyavg","cost","buyprice","avgcost"]);
  const iPrice=col(["price","ltp","last","lastprice","close","prevclose","nav","marketprice","cmp"]);
  const iIsin=col(["isin"]);
  const iSec=col(["sector","industry"]);
  const iExch=col(["exchange","exch"]);
  if(iSym<0||iQty<0){ alert("Could not find Symbol and Quantity columns. Include headers like Symbol, Qty, Avg, LTP."); return; }
  const items=[]; const seenInFile=new Set();
  let failed=0, fileDup=0;
  for(let r=1;r<rows.length;r++){
    const cells=rows[r]; if(!cells||!cells.length) continue;
    const sym=(cells[iSym]||"").trim(); if(!sym){ failed++; continue; }
    const qtyRaw=String(cells[iQty]||"").replace(/,/g,"").trim();
    const qty=parseFloat(qtyRaw);
    if(!(qty>0) || !isFinite(qty)){ failed++; continue; } // reject zero/invalid — do not silently treat as 0 position
    const avg=iAvg>=0?parseFloat(String(cells[iAvg]||"0").replace(/,/g,""))||0:0;
    const prev=iPrice>=0?parseFloat(String(cells[iPrice]||"0").replace(/,/g,""))||0:(avg||0);
    const isin=iIsin>=0?(cells[iIsin]||"").trim():"";
    const sec=iSec>=0?(cells[iSec]||"").trim():"";
    const exch=iExch>=0?(cells[iExch]||"").trim():"";
    const fileKey=isin?( (owner||"Me")+"|"+isin.toUpperCase()+"|"+(exch||"").toUpperCase() ):( (owner||"Me")+"|"+sym.toUpperCase()+"|"+(exch||"").toUpperCase() );
    if(seenInFile.has(fileKey)){ fileDup++; continue; }
    seenInFile.add(fileKey);
    items.push({sym, qty, avg, prev:prev||avg, isin, sec, exch});
  }
  if(!items.length){ alert("No valid rows found ("+failed+" failed, "+fileDup+" duplicate in file)."); return; }
  const plan=[]; let existingMatch=0;
  for(const it of items){
    const row=buildHoldPlanRow(S.holdings, it, owner);
    if(row.kind==="ambiguous"){ plan.push(row); continue; }
    let H=row.H;

    if(H){
      existingMatch++;
      const pos=holdPos(H);
      const du=Math.round((it.qty-pos.u)*1e6)/1e6;
      const newCost=Math.round(it.qty*it.avg*100)/100;
      const dc=Math.round((newCost-pos.c)*100)/100;
      if(Math.abs(du)<1e-9) plan.push({H,it,kind:"price"});
      else plan.push({H,it,kind:"changed",du,dc});
    } else {
      plan.push({H:null,it,kind:"new"});
    }
  }
  pendH={owner, plan, items:items.length, failed, fileDup, existingMatch};
  openSheet(`<h2 style="margin-top:0">Review import</h2>
  <div class="muted">${items.length} valid · ${plan.filter(p=>p.kind==="new").length} new · ${plan.filter(p=>p.kind==="changed").length} qty changes · ${plan.filter(p=>p.kind==="price").length} price-only · ${plan.filter(p=>p.kind==="ambiguous").length} ambiguous · ${fileDup} file dups · ${failed} failed</div>
  <label>As-of date</label><input type="date" id="hdate" value="${today()}">
  <p class="muted">Import sets positions only — no bank debit. Holdings not in the file are left unchanged (nothing is marked sold).</p>
  <div class="card" style="max-height:40vh;overflow:auto;margin:10px 0">${plan.slice(0,50).map(p=>`<div class="row"><span>${esc(p.it.sym)}${p.it.isin?" · "+esc(p.it.isin):""} · ${p.it.qty} @ ${p.it.avg}</span><b>${p.kind}</b></div>`).join("")}${plan.length>50?"<div class='muted'>…and more</div>":""}</div>
  <button class="btn" data-doholds>Apply import</button>
  <button class="btn alt" data-close>Cancel</button>`);
}
function doHolds(){
  const P=pendH; if(!P) return;
  const date=($("#hdate")||{}).value||today();
  let added=0, changed=0, price=0, sold=0, skippedAmbiguous=0;
  // Process only non-ambiguous plan rows; never create holdings for ambiguous
  for(const p of P.plan){
    if(p.kind==="ambiguous"){ skippedAmbiguous++; continue; }
    let H=p.H;
    if(!H){
      H={id:uid(),name:p.it.sym,type:"stock",cur:"INR",isin:p.it.isin,sector:p.it.sec,price:p.it.prev,owner:(P.owner||"Me"),symbol:p.it.sym,exchange:p.it.exch||"",demat:"",broker:"",amc:"",folio:"",notes:""};
      S.holdings.push(H);
      if(!S.people.includes(H.owner)) S.people.push(H.owner);
      added++;
    } else {
      H.price=p.it.prev;
      H.priceAsOf=date;
      if(!H.isin && p.it.isin) H.isin=p.it.isin;
      if(p.it.sec) H.sector=p.it.sec;
      if(p.it.exch && !H.exchange) H.exchange=p.it.exch;
    }
    if(p.kind==="new") addTxn({type:"open",date,note:"Imported opening position",hold:H.id,units:p.it.qty,cost:Math.round(p.it.qty*p.it.avg*100)/100,postings:[]},{skipSave:true});
    else if(p.kind==="changed"){ addTxn({type:"adjust",date,note:"Portfolio file sync",hold:H.id,units:p.du,cost:p.dc,postings:[]},{skipSave:true}); changed++; }
    else price++;
  }
  // Snapshot from non-ambiguous items only
  const snapItems=(P.plan||[]).filter(p=>p.kind!=="ambiguous").map(p=>p.it);
  S.snaps=S.snaps||[];
  if(snapItems.length){
    S.snaps.push({
      date,
      inv:Math.round(snapItems.reduce((a,x)=>a+(Number(x.qty)||0)*(Number(x.avg)||0),0)),
      val:Math.round(snapItems.reduce((a,x)=>a+(Number(x.qty)||0)*(Number(x.prev)||0),0))
    });
  }
  pendH=null;
  save();
  closeSheet();
  render();
  toastSaved(added+" new, "+changed+" changed, "+price+" prices"+(skippedAmbiguous?", "+skippedAmbiguous+" ambiguous skipped":""));
}

function addM(t,n){const[y,m,d]=t.split("-").map(Number);const x=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,0)).getUTCDate();const day=Math.min(d,last);const z=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth(),day));return z.getUTCFullYear()+"-"+String(z.getUTCMonth()+1).padStart(2,"0")+"-"+String(z.getUTCDate()).padStart(2,"0");}
function addDays(t,n){const[y,m,d]=t.split("-").map(Number);const x=new Date(Date.UTC(y,m-1,d+n));return x.getUTCFullYear()+"-"+String(x.getUTCMonth()+1).padStart(2,"0")+"-"+String(x.getUTCDate()).padStart(2,"0");}
function calendarDays(a,b){
  if(!a||!b) return 0;
  const p=s=>{ const [y,m,d]=String(s).slice(0,10).split("-").map(Number); return Date.UTC(y,(m||1)-1,d||1); };
  return Math.round((p(b)-p(a))/864e5);
}
function salaryTermsAt(x, payDate){
  const revs=(x.revisions||[]).filter(r=>r&&r.prev).slice().sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
  let state=revs.length
    ? {amt:revs[0].prev.amt, freq:revs[0].prev.freq, freqUnit:revs[0].prev.freqUnit, acct:revs[0].prev.acct}
    : {amt:x.amt, freq:x.freq, freqUnit:x.freqUnit, acct:x.acct};
  for(let i=0;i<revs.length;i++){
    if(String(payDate) < String(revs[i].date||"")) break;
    if(i+1<revs.length){
      const p=revs[i+1].prev;
      state={amt:p.amt, freq:p.freq, freqUnit:p.freqUnit, acct:p.acct};
    }else state={amt:x.amt, freq:x.freq, freqUnit:x.freqUnit, acct:x.acct};
  }
  return {
    amt:Number(state.amt)||0,
    freq:Math.max(1, Number(state.freq)||1),
    freqUnit:state.freqUnit||"month",
    acct:state.acct||x.acct
  };
}
function advanceSalaryNext(x, fromDate){
  const base=(fromDate||x.next||today());
  const t=salaryTermsAt(x, base);
  if(t.freqUnit==="week") return addDays(base, 7*t.freq);
  if(t.freqUnit==="day") return addDays(base, t.freq);
  return addM(base, t.freq);
}
function salaryStatusLabel(x){
  const st=x.status||"active";
  if(st==="stopped") return "Paused";
  if(st==="ended") return "Ended";
  const d=daysTo(x.next);
  if(d<0) return "Overdue";
  if(d===0) return "Due today";
  return "Active";
}

function lendingPosition(l){
  const principalOrig=Math.max(0, Number(l.principal)||0);
  const rate=Number(l.rate)||0;
  const start=l.start||today();
  // Principal repayments chronological
  const prinTxns=S.txns.filter(t=>t.status==="posted"&&t.loanId===l.id&&t.principalReduction)
    .map(t=>({date:t.date||start, amt:Number(t.principalReduction)||0, created:t.created||""}))
    .sort((a,b)=>a.date.localeCompare(b.date)||String(a.created).localeCompare(String(b.created)));
  for(const t of prinTxns){ if(t.date<start) t.date=start; }
  let principalLeft=principalOrig;
  let principalRepaid=0;
  let cursor=start;
  let accrued=0;
  let interestFromOverpay=0;
  for(const ev of prinTxns){
    if(principalLeft>0.0000001 && rate>0){
      const d=Math.max(0, calendarDays(cursor, ev.date));
      accrued+=principalLeft*rate/100*d/365.25;
    }
    const raw=Math.max(0, ev.amt);
    const pay=Math.min(principalLeft, raw);
    interestFromOverpay+=Math.max(0, raw-pay);
    principalLeft-=pay;
    principalRepaid+=pay;
    cursor=ev.date>cursor?ev.date:cursor;
  }
  if(principalLeft>0.0000001 && rate>0){
    const d=Math.max(0, calendarDays(cursor, today()));
    accrued+=principalLeft*rate/100*d/365.25;
  }
  // If principal fully repaid, cursor is last repayment date — no further accrual (above branch skipped)
  principalLeft=Math.max(0, principalLeft);
  principalRepaid=Math.min(principalOrig, Math.max(0, principalRepaid));
  const interestPaid=S.txns.filter(t=>t.status==="posted"&&t.loanId===l.id&&t.interestSettlement)
    .reduce((v,t)=>v+Math.abs(t.postings?.[0]?.amt||0),0);
  // Manual adjustments: positive = more interest owed; negative = waiver/round-down
  const adjustments=l.interestAdjustments||[];
  const interestAdj=adjustments.reduce((v,a)=>v+(Number(a.amount)||0),0);
  const interestLeft=Math.max(0, accrued+interestAdj-interestPaid-interestFromOverpay);
  const totalOutstanding=principalLeft+interestLeft;
  const totalPayable=principalOrig+Math.max(0, accrued+interestAdj);
  const totalPaid=principalRepaid+interestPaid+interestFromOverpay;
  const pctPrincipal=principalOrig>0?Math.min(100, Math.round(principalRepaid/principalOrig*100)):100;
  const pctTotal=totalPayable>0?Math.min(100, Math.round(totalPaid/totalPayable*100)):(totalOutstanding<=0?100:0);
  let status="Unpaid";
  if(totalOutstanding<=0.0001) status="Fully Settled";
  else if(principalLeft<=0.0001 && interestLeft>0.0001) status="Principal Repaid · Interest Pending";
  else if(principalRepaid>0.0001 || interestPaid>0.0001 || interestAdj) status="Partially Repaid";
  else status="Unpaid";
  const days=Math.max(0, calendarDays(start, today()));
  return {
    principal: principalLeft,
    principalOrig, principalLeft, principalRepaid,
    interest: interestLeft,
    interestLeft, accrued, interestPaid, interestAdj, interestAccrued: accrued,
    total: totalOutstanding, totalOutstanding, totalPayable, totalPaid,
    pctPrincipal, pctTotal, status, days, rate, adjustments
  };
}

function dueHtml(){
  const r=[];
  for(const x of S.sips){
    if(x.status==="stopped") continue;
    const d=daysTo(x.next);
    if(d<=14){
      const h=S.holdings.find(v=>v.id===x.hold)||{};
      const label=d<0?"Overdue SIP":d===0?"SIP due today":"SIP";
      const priceNote=!(h.price>0)?" · set fund price":"";
      r.push([d, label+" · "+esc(h.name||"Fund")+(h.folio?" · Folio "+esc(h.folio):"")+priceNote, fmtHide(x.amt,x.cur), `data-sip="${esc(x.id)}"`, d<0?"warn":""]);
    }
  }
  for(const x of S.salaries){
    if(x.status==="stopped") continue;
    const d=daysTo(x.next);
    if(d<=14){
      const label=d<0?"Overdue salary":d===0?"Salary today":"Salary";
      r.push([d, label+" · "+esc(x.person||"Me"), fmtHide(x.amt,x.cur), `data-salary="${esc(x.id)}"`, d<0?"warn":""]);
    }
  }
  for(const p of S.policies){
    if(!policyDueForReminder(p)) continue;
    const due=policyPayableDate(p);
    if(!due) continue;
    const d=daysTo(due);
    if(d<=30) r.push([d, "Premium · "+esc(p.name), fmtHide(p.premium,p.cur), `data-pol="${esc(p.id)}"`, d<0?"warn":""]);
  }
  for(const a of S.accounts){
    if(a.type!=="card"||a.archived||!a.dueDay) continue;
    const b=balance(a);
    if(b>=0) continue;
    const d=daysTo(nextDue(a.dueDay));
    if(d<=14) r.push([d, "Card due · "+esc(a.name), fmtHide(-b,a.cur), `data-acct="${esc(a.id)}"`, d<=3?"warn":""]);
  }
  for(const p of S.purchases){
    if(!p.expiry) continue;
    const d=daysTo(p.expiry);
    if(d>=0&&d<=30) r.push([d, "Warranty · "+esc(p.item), "", "", ""]);
  }

    const [mm,yy]=exp.split("/");
    const end="20"+yy+"-"+mm+"-01";
    // treat as due in the expiry month (1st); show within 60 days before
    const d=daysTo(end);
    if(d>=-31 && d<=60){
      const kind=a.type==="card"?"Credit card":"Debit card";
      const last=(a.cardMeta||{}).last4?(" ••••"+a.cardMeta.last4):"";
      r.push([Math.max(0,d), kind+" expires · "+esc(a.name)+last, exp, `data-acct="${esc(a.id)}"`, d<=30?"warn":""]);
    }
  }
  if(!r.length) return "";
  r.sort((a,b)=>a[0]-b[0]);
  return `<h2>Due soon</h2><div class="card">${r.map(x=>{
    const when=x[0]<0?((-x[0])+"d overdue"):x[0]===0?"today":("in "+x[0]+"d");
    const pill=x[0]<0?`<span class="due-pill over">overdue</span>`:x[0]===0?`<span class="due-pill">today</span>`:"";
    return `<div class="row" ${x[3]||""} style="cursor:pointer"><div><b class="${x[4]||""}">${x[1]}</b> ${pill}<div class="muted">${when}</div></div><b class="num ${x[4]||""}">${x[2]}</b></div>`;
  }).join("")}</div>`;
}

/* ---------- integrity check ---------- */
function runCheck(){
  const issues=[]; const ids=new Set();
  // Reconstruct balances from openings + postings and compare to balance()
  for(const x of (S.sips||[])){ if(x.hold&&!S.holdings.find(h=>h.id===x.hold)) issues.push("Orphan SIP → missing holding "+x.hold); if(x.acct&&!acct(x.acct)) issues.push("Orphan SIP → missing account"); }
  for(const a of S.accounts){
    if(a.archived) continue;
    let recon=Number(a.opening)||0;
    for(const t of S.txns){
      if(t.status!=="posted"||!t.postings) continue;
      for(const p of t.postings){ if(p.acct===a.id) recon+=Number(p.amt)||0; }
    }
    const live=balance(a);
    if(Math.abs(recon-live)>0.02) issues.push("Balance mismatch "+(a.name||a.id)+": live="+live+" recon="+recon);
  }

  for(const t of S.txns){
    if(ids.has(t.id)) issues.push("Duplicate ID "+t.id); ids.add(t.id);
    if(!Array.isArray(t.postings)) issues.push("Transaction has no postings");
    for(const p of (t.postings||[])) if(!acct(p.acct)) issues.push("A transaction points at a missing account");
    if(t.fxRate!=null&&!(Number(t.fxRate)>0)) issues.push("Invalid historical FX rate on "+t.id);
    if(t.type==="transfer" && t.postings.length!==2) issues.push("Transfer without two sides");
    if(t.type!=="transfer" && t.type!=="open" && t.type!=="adjust" && t.type!=="adjustment" && t.postings.length!==1) issues.push("Unexpected postings on "+t.type);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(t.date)) issues.push("Bad date on a transaction");
  }
  openSheet(`<h2 style="margin-top:0">${issues.length?"Problems found":"All good"}</h2>
  <p class="muted">${S.txns.length} transactions, ${S.accounts.length} accounts and ${S.lending.length} lending records checked.</p>
  ${issues.length?`<ul>${[...new Set(issues)].map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:""}
  <button class="btn alt" data-close>Close</button>`);
}

/* ---------- export / import ---------- */
function download(name, text, type){
  const blob=new Blob([text],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},1000);
}
async function exportJSON(){
  const filename=`finance-backup-${today()}.enc`, encrypted=await seal(S);
  try{
    const h=await backupHandleGet();
    if(h){
      // Directory handles expose getFileHandle; createWritable is only on file handles.
      const permission=await backupPermission(h,true);
      if(permission==="granted" && typeof h.getFileHandle==="function"){
        const file=await h.getFileHandle(filename,{create:true});
        const writable=await file.createWritable();
        try{
          await writable.write(new Blob([encrypted],{type:"application/octet-stream"}));
          await writable.close();
        }catch(err){
          try{await writable.abort();}catch(_){}
          throw err;
        }
        toast("Encrypted backup saved to "+(h.name||"selected folder"));
        await backupDestinationStatus();
        return;
      }
      await backupDestinationStatus();
      if(permission!=="granted"){
        toast("Folder permission not granted. Re-choose the folder, then try again. Downloading instead.");
      }else{
        toast("This browser cannot write into the selected folder. Downloading instead.");
      }
    }
  }catch(err){
    console.warn("Folder backup failed; fallback download",err);
    toast("Folder save failed ("+(err&&err.message?err.message:"error")+"). Downloading instead.");
  }
  download(filename,encrypted,"application/octet-stream");
}
function exportCSV(){
  const rows=[["id","date","type","status","category","note","account","account_owner","amount","currency","fx_rate","person","reference"]];
  for(const t of S.txns) for(const p of t.postings) rows.push([t.id,t.date,t.type,t.status,t.cat||"",t.note||"",(acct(p.acct)||{}).name||"",(acct(p.acct)||{}).owner||"Me",p.amt,p.cur,t.fxRate||S.rate,t.person||"",t.id]);
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  download(`transactions-${today()}.csv`, csv, "text/csv");
}

async function openBackupPayload(raw, password){
  if(backupTooLarge(raw)) return {ok:false, error:"That backup is too large."};
  let parsed;
  try{ parsed=JSON.parse(raw); }
  catch(e){ return {ok:false, error:"That file is not a My Finance backup."}; }
  if(parsed && parsed.enc){
    if(!password) return {ok:false, needsPassword:true, error:"Enter the backup passphrase."};
    try{
      const salt=unb64(parsed.salt);
      const iter=parsed.iterations||250000;
      const key=await deriveKey(password, salt, iter, false);
      const data=await unseal(parsed, key);
      return {ok:true, data, key, salt, iter, bio:parsed.bio||null, password, encrypted:true};
    }catch(e){
      return {ok:false, error:"Wrong passphrase, or the backup is damaged."};
    }
  }
  return {ok:true, data:parsed, encrypted:false};
}
function vaultShapeOk(d){
  return !!(d && [1,2].includes(d.v) && Array.isArray(d.accounts) && Array.isArray(d.txns) && !vaultHasUnsafeId(d));
}
async function commitRestore(decoded){
  const prev={S, CK, SALT, KDF_ITER, BIO, notice:unlockNotice};
  try{
    S=decoded.data;
    if(decoded.encrypted && decoded.key){
      CK=decoded.key; SALT=decoded.salt; KDF_ITER=decoded.iter; BIO=decoded.bio||null;
      if(KDF_ITER<600000){
        const hadBio=!!decoded.bio;
        SALT=crypto.getRandomValues(new Uint8Array(16));
        KDF_ITER=600000;
        CK=await deriveKey(decoded.password, SALT, KDF_ITER, false);
        BIO=null;
        unlockNotice=hadBio
          ? "Backup restored and re-encrypted. Fingerprint unlock was turned off — enable it again under More."
          : "Backup restored and re-encrypted with a stronger key.";
      }
    }
    migrate();
    const ok=await save();
    if(!ok) throw new Error("The restored vault could not be stored on this phone.");
    return {ok:true};
  }catch(err){
    S=prev.S; CK=prev.CK; SALT=prev.SALT; KDF_ITER=prev.KDF_ITER; BIO=prev.BIO;
    unlockNotice=prev.notice||"";
    return {ok:false, error:(err&&err.message)||"Restore failed."};
  }
}
document.addEventListener("change", e=>{
  if(e.target.id==="fa"){ filterAcct=e.target.value; actLimit=40; render(); }
  if(e.target.id==="ft"){ filterType=e.target.value; actLimit=40; render(); }
  if(e.target.id==="homeOwner"){homeOwner=e.target.value;render();}
  if(e.target.id==="hf"){ const fl=e.target.files[0]; if(!fl) return; const rd=new FileReader(); rd.onload=()=>holdParse(rd.result); rd.readAsText(fl); return; }
  if(e.target.id==="csvf"){ const fl=e.target.files[0]; if(!fl) return; const rd=new FileReader(); rd.onload=()=>importCSV(String(rd.result)); rd.readAsText(fl); e.target.value=""; return; }
  if(e.target.id==="themePref"){ applyTheme(e.target.value); return; }
  if(e.target.id==="rate"){ const r=readAmt(e.target.value,{required:true,positive:true,maxDecimals:6}); if(!r.ok){ alert(r.error); return; } S.rate=r.value; save(); toastSaved("Rate saved"); }
  if(e.target.id==="from"||e.target.id==="to") updateRecv();
  if(e.target.id==="file"){
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=async()=>{ try{
        const raw=String(rd.result||"");
        let probe=null;
        try{ probe=JSON.parse(raw); }catch(e){ throw new Error("bad"); }
        let password="";
        if(probe&&probe.enc){
          password=await askPassphrase("Backup passphrase","Enter the passphrase that encrypted this file. A wrong passphrase does not change your vault.");
          if(!password) return;
        }else{
          const pw=await askPassphrase("Confirm restore","This file is not an encrypted backup. Enter your current passphrase to replace the data on this phone.");
          if(!pw) return;
          await unseal(JSON.parse(store.get()), await deriveKey(pw, SALT, KDF_ITER, false));
        }
        const decoded=await openBackupPayload(raw, password);
        if(!decoded.ok){ alert(decoded.error||"Could not open that file."); return; }
        if(!vaultShapeOk(decoded.data)){ alert("That file is not a usable My Finance vault. Nothing was changed."); return; }
        if(!confirm(`Replace current data with this backup (${decoded.data.accounts.length} accounts, ${decoded.data.txns.length} transactions)?`)) return;
        const result=await commitRestore(decoded);
        if(!result.ok){ alert("Restore was not applied. Your existing vault is unchanged. "+result.error); render(); return; }
        render();
        toastSaved(unlockNotice||"Backup restored");
        unlockNotice="";
      }catch(err){ alert("Could not open that file. Check the passphrase, and that it is a My Finance backup under 6 MB. Nothing was changed."); } };
    rd.readAsText(f); e.target.value="";
  }
});
