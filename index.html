<style>
/* Theme tokens: light is the default on :root.
   Dark applies only via html[data-theme="dark"] or system+OS dark.
   Never put prefers-color-scheme on bare :root — that broke Light when the phone was in dark mode. */
:root, html[data-theme="light"]{
  color-scheme: light;
  --bg:#f4f5f7;
  --bg-2:#eef0f3;
  --card:#ffffff;
  --elev:#ffffff;
  --ink:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#2563eb;
  --accent-soft:rgba(37,99,235,.10);
  --accent-ink:#ffffff;
  --in:#047857;
  --out:#b91c1c;
  --warn:#b45309;
  --nav:#ffffff;
  --overlay:rgba(15,23,42,.45);
  --input:#ffffff;
  --radius:14px;
  --shadow:0 1px 2px rgba(17,24,39,.04), 0 4px 14px rgba(17,24,39,.05);
  --ease:cubic-bezier(.22,1,.36,1);
  --hero-from:#2563eb;
  --hero-to:#1e40af;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121212;
  --bg-2:#1a1a1a;
  --card:#1c1c1e;
  --elev:#2c2c2e;
  --ink:#f3f4f6;
  --muted:#9ca3af;
  --line:#2e2e32;
  --accent:#60a5fa;
  --accent-soft:rgba(96,165,250,.14);
  --accent-ink:#0b1220;
  --in:#34d399;
  --out:#f87171;
  --warn:#fbbf24;
  --nav:#1c1c1e;
  --overlay:rgba(0,0,0,.55);
  --input:#2c2c2e;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --hero-from:#1d4ed8;
  --hero-to:#1e3a8a;
}
@media (prefers-color-scheme: dark){
  html[data-theme="system"], html:not([data-theme]){
    color-scheme: dark;
    --bg:#121212;
    --bg-2:#1a1a1a;
    --card:#1c1c1e;
    --elev:#2c2c2e;
    --ink:#f3f4f6;
    --muted:#9ca3af;
    --line:#2e2e32;
    --accent:#60a5fa;
    --accent-soft:rgba(96,165,250,.14);
    --accent-ink:#0b1220;
    --in:#34d399;
    --out:#f87171;
    --warn:#fbbf24;
    --nav:#1c1c1e;
    --overlay:rgba(0,0,0,.55);
    --input:#2c2c2e;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --hero-from:#1d4ed8;
    --hero-to:#1e3a8a;
  }
}
@media (prefers-color-scheme: light){
  html[data-theme="system"], html:not([data-theme]){
    color-scheme: light;
    --bg:#f4f5f7;
    --bg-2:#eef0f3;
    --card:#ffffff;
    --elev:#ffffff;
    --ink:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#2563eb;
    --accent-soft:rgba(37,99,235,.10);
    --accent-ink:#ffffff;
    --in:#047857;
    --out:#b91c1c;
    --warn:#b45309;
    --nav:#ffffff;
    --overlay:rgba(15,23,42,.45);
    --input:#ffffff;
    --shadow:0 1px 2px rgba(17,24,39,.04), 0 4px 14px rgba(17,24,39,.05);
    --hero-from:#2563eb;
    --hero-to:#1e40af;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:14px 16px 20px}
h1{font-size:13px;font-weight:600;color:var(--muted);margin:4px 0 2px;letter-spacing:.02em}
h2{font-size:15px;font-weight:650;margin:20px 0 8px;letter-spacing:-.01em}
.big{font-size:36px;font-weight:720;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px;margin:8px 0;box-shadow:var(--shadow)}
.card.tap{cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.card.tap:active{transform:scale(.985)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row > div{min-width:0;flex:1}
.row > b,.row > .num{flex-shrink:0;text-align:right}
.row+.row{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.muted{color:var(--muted);font-size:13px}
.in{color:var(--in)} .out{color:var(--out)} .warn{color:var(--warn)}
.seg{display:flex;gap:4px;background:var(--bg-2);border-radius:12px;padding:4px;border:1px solid var(--line)}
.seg button{flex:1 1 0;min-width:0;border:0;background:transparent;color:var(--muted);padding:8px 6px;border-radius:9px;font-family:inherit;font-size:12px;font-weight:650;line-height:1.2;white-space:nowrap;transition:background .15s var(--ease),color .15s var(--ease)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
body.locked #nav,body.locked nav{display:none!important;pointer-events:none!important;height:0!important;overflow:hidden!important;border:0!important;padding:0!important}
body.locked #app{padding-bottom:24px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;z-index:5;
  padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:10px 0;border-radius:10px;transition:color .15s var(--ease)}
nav button.on{color:var(--accent)}
nav .add{flex:0 0 56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  font-size:30px;line-height:1;margin-top:-28px;box-shadow:0 6px 18px rgba(47,79,216,.35);font-weight:400;
  transition:transform .15s var(--ease)}
nav .add:active{transform:scale(.94)}
.sheet-bg{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  animation:fadeIn .18s var(--ease)}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:92vh;overflow:auto;
  animation:sheetUp .28s var(--ease);
  box-shadow:0 -8px 40px rgba(0,0,0,.18)}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:99px;background:var(--line);margin:2px auto 12px}
@keyframes sheetUp{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .sheet,.sheet-bg,.card.tap,nav .add,.seg button,.btn,.chip{animation:none!important;transition:none!important}
}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px;letter-spacing:.01em}
input,select,textarea{background:var(--input);color:var(--ink);width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px 13px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
input[type="checkbox"],input[type="radio"]{width:18px;height:18px;min-height:18px;min-width:18px;padding:0;margin:0;flex:0 0 auto;accent-color:var(--accent);box-shadow:none}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.amt{font-size:40px;font-weight:720;text-align:center;padding:16px 12px;letter-spacing:-.02em;border-radius:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:active{transform:scale(.97)}
.amt-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 4px}
.amt-chips .chip{padding:7px 12px;font-size:12px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);margin-top:14px;
  transition:transform .12s var(--ease),opacity .12s var(--ease);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn:active{transform:scale(.985);opacity:.92}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line);margin-top:10px;box-shadow:none}
.btn.danger{background:var(--bg);color:var(--out);border:1px solid var(--line);box-shadow:none}
.btn.small{font-size:13px;padding:8px 12px;width:auto;margin:0;border-radius:10px;box-shadow:none}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .empty-title{font-size:17px;font-weight:650;color:var(--ink);margin-bottom:6px}
.empty p{margin:0 0 14px;font-size:14px;line-height:1.5}
.toast{background:var(--elev);color:var(--ink);border:1px solid var(--line);position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:30;display:flex;gap:14px;align-items:center;
  box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fadeIn .2s var(--ease);max-width:min(92vw,420px)}
.toast button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;filter:brightness(1.35)}
.void{opacity:.5;text-decoration:line-through}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s var(--ease)}
.bar.warn i{background:var(--warn)}
.bar.out i{background:var(--out)}
.bar.in i{background:var(--in)}
.hero{padding:6px 2px 4px}
.hero .big{margin:4px 0}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow)}
.metric span{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.metric b{font-size:17px;font-weight:700}
.quick-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 4px}
.quick-grid button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 8px;font:inherit;font-size:13px;font-weight:650;box-shadow:var(--shadow)}
.quick-grid button:active{transform:scale(.97)}
.chart{width:100%;height:auto;display:block}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.mix-bar{display:flex;gap:3px;overflow:hidden;border-radius:999px;margin:2px 0 16px}
.mix-legend{display:flex;flex-direction:column;gap:2px}
.mix-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.mix-row:first-child{border-top:0}
.mix-name{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.mix-name .dot{width:10px;height:10px;margin:0;flex-shrink:0}
.mix-val{display:flex;align-items:baseline;gap:8px;flex-shrink:0}
.mix-pct{min-width:38px;text-align:right;font-size:12px;font-weight:650;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.home-filter{margin:4px 0 10px}
.home-filter select{padding:10px 12px}
.security-note{font-size:12px;color:var(--muted);line-height:1.5}
.due-pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.due-pill.over{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.limit-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}

.hero-nw{background:linear-gradient(145deg,var(--hero-from),var(--hero-to));color:#fff;border-radius:18px;padding:16px;margin:8px 0 10px;box-shadow:var(--shadow)}
.hero-nw .label{opacity:.9;font-size:13px}
.hero-nw .value{font-size:clamp(26px,8vw,34px);font-weight:720;margin:6px 0 12px;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.hero-nw .split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero-nw .split div{background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;min-width:0}
.hero-nw .split span{display:block;font-size:11px;opacity:.85}
.hero-nw .split b{display:block;overflow-wrap:anywhere;font-size:15px}
.wealth-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.wealth-pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.wealth-pill span{display:block;font-size:11px;color:var(--muted)}
.wealth-pill b{display:block;margin-top:2px;font-size:15px;font-weight:700;overflow-wrap:anywhere}
#app{max-width:560px;margin:0 auto}
nav{width:min(560px,100%);left:50%;right:auto;transform:translateX(-50%);border-radius:18px 18px 0 0}
nav button.add{width:52px;height:52px;margin-top:-12px;border-radius:16px;font-size:28px}
.btn,button.btn{min-height:44px}input:not([type="checkbox"]):not([type="radio"]):not([hidden]),select{min-height:44px;font-size:16px}
.month-sep{font-size:12px;font-weight:650;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.03em}


.home-toolbar{display:flex;align-items:flex-end;gap:10px;margin:0}
.home-head{display:flex;flex-direction:column;gap:4px;margin:0 0 8px}
.home-kicker{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:16px}
.home-kicker label{margin:0;font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.01em}
.ver-link{margin:0;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:650;line-height:1.2;padding:2px 0;opacity:.9}
.home-controls{display:flex;align-items:center;gap:8px}
.home-controls select{flex:1;min-width:0;min-height:40px;padding:8px 10px}
.home-toolbar .home-filter{flex:1;margin:0}
.privacy-chip{flex-shrink:0;min-height:40px;padding:8px 12px}
.pay-picker input[type="hidden"]{display:none!important;min-height:0!important;padding:0!important;border:0!important;width:0!important}
.pay-picker{position:relative}
.pay-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--input);color:var(--ink);font:inherit;padding:8px 12px;min-height:52px;cursor:pointer}
.pay-trigger:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pay-picker.open .pay-trigger{border-color:var(--accent)}
.pay-trigger-main{min-width:0;flex:1;display:flex;align-items:center;gap:10px;justify-content:space-between}
.pay-trigger .pay-opt-main{flex:1;min-width:0}
.pay-trigger .pay-opt-name,.pay-trigger .pay-opt-meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pay-caret{flex-shrink:0;width:18px;height:18px;color:var(--muted);transition:transform .15s var(--ease)}
.pay-picker.open .pay-caret{transform:rotate(180deg)}
.pay-picker.open::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29;animation:fadeIn .15s var(--ease)}
.pay-panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,440px);z-index:30;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column;max-height:min(72vh,560px)}
.pay-panel[hidden]{display:none}
.pay-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 8px 12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.pay-panel-close{border:0;background:transparent;color:var(--muted);font:inherit;font-size:22px;line-height:1;width:44px;height:44px;border-radius:12px;cursor:pointer}
.pay-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pay-group-label{position:sticky;top:0;z-index:1;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--bg-2);padding:6px 12px;border-bottom:1px solid var(--line)}
.pay-opt{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:9px 12px;min-height:48px;border-radius:0}
.pay-group .pay-opt:last-child{border-bottom:0}
.pay-opt.on{background:color-mix(in srgb,var(--accent) 16%,var(--card));box-shadow:inset 3px 0 0 var(--accent)}
.pay-opt-main{min-width:0;display:flex;flex-direction:column;gap:1px}
.pay-opt-name{font-weight:650;font-size:14px;line-height:1.25}
.pay-opt-meta{font-size:11px;color:var(--muted);line-height:1.3}
.pay-opt.on .pay-opt-meta{color:var(--ink);opacity:.75}
.pay-opt-bal{font-size:13px;font-weight:700;flex-shrink:0}
.val-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.val-row div{min-width:0}
.val-row span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.fx-row{display:grid;grid-template-columns:minmax(88px,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:center;margin:8px 0}
.fx-row select,.fx-row input{min-width:0;min-height:44px}

.fx-wallet + .fx-wallet{border-top:1px solid var(--line)}
.fx-wallet span{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.section-label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}

}
.method-card{cursor:pointer}
.members-only .metric span{font-weight:600}
textarea{width:100%;min-height:88px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;resize:vertical}

.expiry-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 2px}

.form-section{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px;background:var(--card)}

const store = {
  // True only after a write was read back from localStorage.
  persistent: true,
  get(){

    // A successful write, or an abandoned failed restore, reads the phone copy.
    if(this.persistent===false && Object.prototype.hasOwnProperty.call(mem, KEY)) return mem[KEY];
    try{
      const v = localStorage.getItem(KEY);
      if(v != null) return v;
    }catch(e){
      if(Object.prototype.hasOwnProperty.call(mem, KEY)) return mem[KEY];
      return null;
    }
    return Object.prototype.hasOwnProperty.call(mem, KEY) ? mem[KEY] : null;
  },
  // Throws unless the envelope is readable back from localStorage.
  // The memory copy is only a session fallback. Callers must not treat a throw as success.
  set(v){
    let cause = null;
    try{
      localStorage.setItem(KEY, v);
      const back = localStorage.getItem(KEY);
      if(back === v){
        mem[KEY] = v;
        lastPersistent = v;
        this.persistent = true;
        return {ok:true, persistent:true};
      }
      cause = new Error("Storage did not return the saved vault");
    }catch(e){
      cause = e;
    }
    mem[KEY] = v;
    this.persistent = false;
    const quota = cause && (cause.name === "QuotaExceededError" || /quota/i.test(String(cause.message || "")));
    const err = new Error(quota ? "Phone storage is full" : "Vault was not written to phone storage");
    err.name = quota ? "QuotaExceededError" : "StoragePersistError";
    err.cause = cause;
    throw err;
  },
  // Drop a ciphertext that was never confirmed, and return to the last confirmed envelope.
  abandonUnpersisted(){
    if(lastPersistent!=null){
      mem[KEY] = lastPersistent;
      this.persistent = true;
      return;
    }
    try{
      const v = localStorage.getItem(KEY);
      if(v!=null){ mem[KEY]=v; lastPersistent=v; this.persistent=true; return; }
    }catch(e){}
    delete mem[KEY];
    this.persistent = true;
  }
};

function backupDb(){return new Promise((resolve,reject)=>{if(!("indexedDB" in window))return reject(new Error("IndexedDB unavailable"));const req=indexedDB.open(BACKUP_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(BACKUP_STORE))req.result.createObjectStore(BACKUP_STORE);};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error("Backup settings storage unavailable"));});}
async function backupHandleGet(){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readonly"),req=tx.objectStore(BACKUP_STORE).get(BACKUP_HANDLE_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();});}
async function backupHandleSet(handle){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readwrite");tx.objectStore(BACKUP_STORE).put(handle,BACKUP_HANDLE_KEY);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};tx.onabort=()=>{db.close();reject(tx.error);};});}
async function backupHandleForget(){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readwrite");tx.objectStore(BACKUP_STORE).delete(BACKUP_HANDLE_KEY);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};});}
async function backupPermission(handle,request=false){if(!handle)return "missing";try{if(!handle.queryPermission)return "unsupported";let p=await handle.queryPermission({mode:"readwrite"});if(p!=="granted"&&request&&handle.requestPermission)p=await handle.requestPermission({mode:"readwrite"});return p;}catch(e){return "denied";}}
async function backupDestinationStatus(){
  const node=$("#backupFolderStatus"); if(!node) return;
  if(!("showDirectoryPicker" in window)){
    node.textContent="Folder picker not available on this browser/device. Save backup file uses Downloads.";
    return;
  }
  try{
    const h=await backupHandleGet();
    if(!h){ node.textContent="No folder selected yet. Choose a folder, then Save backup file writes the .enc there."; return; }
    const p=await backupPermission(h,false);
    const name=h.name||"Device folder";
    if(p==="granted") node.textContent="Selected: "+name+" · Ready (Save backup file writes here)";
    else if(p==="prompt") node.textContent="Selected: "+name+" · Will ask permission on next save";
    else node.textContent="Selected: "+name+" · Permission lost — choose the folder again";
  }catch(e){
    node.textContent="Could not read folder preference. Download backup still works.";
  }
}
async function forgetBackupFolder(){
  try{
    await backupHandleForget();
    await backupDestinationStatus();
    toast("Backup folder forgotten. Downloads will be used instead.");
  }catch(e){
    alert("Could not forget that folder: "+(e&&e.message?e.message:e));
  }
}
async function chooseBackupFolder(){
  if(!("showDirectoryPicker" in window)){
    toast("Folder picker not supported in this browser. Use Save backup file (Downloads).");
    return;
  }
  try{
    const h=await window.showDirectoryPicker({mode:"readwrite",id:"myfinance-backup"});
    // Verify we can create a file handle API on this handle
    if(typeof h.getFileHandle!=="function"){
      alert("This browser selected a folder but cannot write files into it. Backups will use download.");
      return;
    }
    const perm=await backupPermission(h,true);
    if(perm!=="granted"){
      alert("Write permission was not granted for that folder. Try again and allow access when prompted.");
      return;
    }
    await backupHandleSet(h);
    await backupDestinationStatus();
    toast("Backup folder ready: "+(h.name||"folder"));
  }catch(e){
    if(e&&e.name==="AbortError")return;
    alert("Could not select backup folder: "+(e&&e.message?e.message:e));
  }
}

const blank=()=>({v:2,rate:104.16,display:"INR",accounts:[],holdings:[],sips:[],salaries:[],policies:[],purchases:[],snaps:[],history:[],lending:[],bankContacts:[],contacts:[],people:["Me","Father","Mother"],txns:[],audit:[],lastAcct:null,autoSip:true,autoSalary:true,hideBalances:false,onboardingDone:false});
const LBL={adjust:"Portfolio sync · ",open:"Opening position · ",refund:"Refund · ",buy:"Bought ",sell:"Sold ",lend:"Lent to ",lendback:"Repaid by ",borrow:"Borrowed from ",repay:"Repaid to ",givetake:"Give & Take · "};
const isSecureContext = window.isSecureContext === true;
function b64(u){
  const bytes=u instanceof Uint8Array?u:new Uint8Array(u);
  let t="";
  const CHUNK=0x8000;
  for(let i=0;i<bytes.length;i+=CHUNK){
    t+=String.fromCharCode.apply(null, bytes.subarray(i, i+CHUNK));
  }
  return btoa(t);
}
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
function inspectEncryptedEnvelope(env){
  // Encrypted envelopes are untrusted input (local storage and imported backups).
  // Keep the legacy 250k default for older backups, but bound work and validate
  // binary fields before invoking WebCrypto.
  if(!env || typeof env!=="object" || env.enc!==2) return {ok:false,error:"Unsupported or invalid encrypted backup format."};
  const iterations=env.iterations==null?250000:Number(env.iterations);
  if(!Number.isSafeInteger(iterations) || iterations<1000 || iterations>2000000) return {ok:false,error:"The backup has an unsafe PBKDF2 iteration count."};
  const decode=(value,min,max)=>{
    if(typeof value!=="string" || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(value)) return null;
    try{ const bytes=unb64(value); return bytes.length>=min&&bytes.length<=max?bytes:null; }catch(e){ return null; }
  };
  const salt=decode(env.salt,16,64), iv=decode(env.iv,12,12), data=decode(env.data,16,4500000);
  if(!salt || !iv || !data) return {ok:false,error:"The backup encryption metadata is malformed or incomplete."};
  return {ok:true,iterations,salt,iv,data};
}
async function deriveKey(p, salt, iterations=KDF_ITER, extractable=false){
  if(!Number.isSafeInteger(Number(iterations)) || Number(iterations)<1 || Number(iterations)>2000000) throw new Error("Invalid PBKDF2 iteration count.");
  if(!(salt instanceof Uint8Array) || salt.length<16 || salt.length>64) throw new Error("Invalid encryption salt.");
  const m = await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:Number(iterations), hash:"SHA-256"}, m, {name:"AES-GCM", length:256}, extractable, ["encrypt","decrypt"]);
}
async function seal(o, key, salt, iter, bio){
  key=key||CK; salt=salt||SALT; iter=iter||KDF_ITER;
  if(bio===undefined) bio=BIO;
  if(!key) throw new Error("No encryption key");
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(o)));
  return JSON.stringify({enc:2, salt:b64(salt), iterations:iter, iv:b64(iv), data:b64(ct), bio:bio||null});
}
async function unseal(env, key){
  const ct = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(env.iv)}, key, unb64(env.data));
  return JSON.parse(new TextDecoder().decode(ct));
}
function save(){
  if(!CK || !S){
    const job = chain.then(()=>false);
    chain = job;
    showPersistProblem("Not saved — the vault is locked, so this change is only on screen.");
    return job;
  }
  const snap=S, key=CK, salt=SALT, iter=KDF_ITER, bio=BIO;
  const job = chain.then(async ()=>{
    store.set(await seal(snap, key, salt, iter, bio));
    clearPersistProblem();
    return true;
  }).catch(err=>{
    console.warn("save failed", err);
    const full = err && (err.name==="QuotaExceededError" || /quota|full/i.test(String(err.message||"")));
    const msg = full
      ? "Not saved — storage on this phone is full. Export a backup. This change is only in the current session."
      : "Not saved on this phone. This change is only in the current session until storage works.";
    showPersistProblem(msg);
    return false;
  });
  chain = job.then(v => v === true, () => false);
  return job;
}
function toastSaved(msg, undo){
  const pending = chain;
  return pending.then(ok=>{
    if(ok === true && msg) toast(msg, undo);
    else if(msg) toast(persistProblem || "Not saved on this phone.");
    return ok === true;
  });
}
function migrate(){
  for(const k of ["accounts","holdings","sips","salaries","policies","purchases","snaps","history","lending","bankContacts","contacts","people","txns","audit"]) S[k]=S[k]||[];
  if(S.audit.length>500) S.audit=S.audit.slice(-500);
  const migratedTxnById=new Map((S.txns||[]).filter(t=>t&&t.id).map(t=>[t.id,t]));
  for(const purchase of (S.purchases||[])){
    if(!purchase.txnId) continue;
    const linked=migratedTxnById.get(purchase.txnId);
    if(linked&&linked.type==="expense") purchase.txnVoided=linked.status!=="posted";
  }
  S.v=2;
  if(S.rate==null) S.rate=104.16;
  if(!S.display) S.display="INR";
  for(const a of S.accounts){
    a.owner=a.owner||"Me"; a.bank=a.bank||""; a.ifsc=a.ifsc||""; a.branchCode=a.branchCode||""; a.branch=a.branch||"";
    a.accountNumber=a.accountNumber||""; a.accountMasked=a.accountMasked||"";
  }
  if(!Array.isArray(S.people)||!S.people.length) S.people=["Me","Father","Mother"];
  for(const h of S.holdings){
    h.owner=h.owner||"Me"; h.folio=h.folio||""; h.isin=h.isin||""; h.symbol=h.symbol||"";
    h.exchange=h.exchange||""; h.demat=h.demat||""; h.broker=h.broker||""; h.amc=h.amc||""; h.notes=h.notes||"";
  }
  for(const a of S.accounts){
    if(a.type!=="demat") continue;
    a.invested=Number(a.invested)||0;
    if(a.valuationMode!=="holdings" && a.valuationMode!=="manual"){
      const linked=(S.holdings||[]).some(h=>holdingLinkedTo(h,a));
      a.valuationMode=linked?"holdings":"manual";
    }
    // Old forms stored a current value as the ledger opening. Keep it once as the manual value
    // when it is not the same number as invested. Never rewrite invested, holdings, or transactions.
    if(a.valuationMode==="manual" && (a.manualValue==null || a.manualValue==="") && !a.manualCleared){
      const b=balance(a);
      if(Math.abs(b-a.invested)>0.009) a.manualValue=Math.round(b*100)/100;
    }
  }
  if(!S.fx || typeof S.fx!=="object" || Array.isArray(S.fx)) S.fx={};
  for(const code of Object.keys(FX_DEFAULT_INR)){
    if(!(Number(S.fx[code])>0)) S.fx[code]=FX_DEFAULT_INR[code];
  }
  for(const a of S.accounts){
    if(a.type!=="forex") continue;
    if(a.wallets!=null&&!Array.isArray(a.wallets)) throw new Error("Forex wallet data is not a list for "+(a.name||a.id)+"; original data was preserved.");
    const rawRows=Array.isArray(a.wallets)?a.wallets:[];
    const rows=[];
    const seenCur=new Set(), seenIds=new Set(), problems=[];
    const rawWalletIds=new Set(rawRows.filter(Boolean).map(w=>String(w.id||"")));
    for(const txn of (S.txns||[])){
      const postsToCard=(txn.postings||[]).some(p=>p.acct===a.id);
      if(txn.forexAcct===a.id){
        if(!txn.walletId||!rawWalletIds.has(String(txn.walletId))) problems.push("transaction "+(txn.id||"(unknown)")+" has no matching Forex wallet");
        else{
          const linkedWallet=rawRows.find(w=>w&&String(w.id)===String(txn.walletId));
          const postingCur=String(txn.walletCur||txn.postings?.[0]?.cur||"").toUpperCase();
          if(linkedWallet&&postingCur&&String(linkedWallet.cur||"").toUpperCase()!==postingCur) problems.push("transaction "+(txn.id||"(unknown)")+" currency does not match its wallet");
        }
      }else if(postsToCard&&["expense","refund"].includes(txn.type)){
        const refundParent=txn.type==="refund"?(S.txns||[]).find(t=>t.id===txn.refundOf):null;
        const canLinkLegacyRefund=!!(refundParent&&refundParent.forexAcct===a.id&&refundParent.walletId&&rawWalletIds.has(String(refundParent.walletId)));
        if(!canLinkLegacyRefund) problems.push("transaction "+(txn.id||"(unknown)")+" posts to the Forex card without wallet metadata");
      }
    }
    for(const refund of (S.txns||[])){
      if(refund.type!=="refund"||!refund.refundOf||refund.forexAcct) continue;
      const parent=(S.txns||[]).find(t=>t.id===refund.refundOf);
      if(!parent||parent.forexAcct!==a.id) continue;
      const walletId=parent.walletId;
      if(!walletId||!rawWalletIds.has(String(walletId))||refund.postings?.[0]?.acct!==a.id){
        problems.push("refund "+refund.id+" has no matching Forex wallet");
        continue;
      }
      if(refund.status==="posted"&&parent.status!=="posted"){
        problems.push("posted refund "+refund.id+" belongs to a voided Forex expense");
        continue;
      }
      const parentWallet=rawRows.find(w=>w&&String(w.id)===String(walletId));
      refund.forexAcct=a.id;
      refund.walletId=walletId;
      refund.walletCur=String(parentWallet.cur||"").toUpperCase();
      refund.amount=Math.abs(Number(refund.postings?.[0]?.amt)||0);
      if(!(refund.amount>0)){problems.push("refund "+refund.id+" has an invalid amount");continue;}
      refund.fxRate=refund.fxRate||parent.fxRate||S.rate||1;
      refund.forexMovementApplied=false;
    }
    for(const w of rawRows){
      if(!w){ problems.push("empty wallet row"); continue; }
      const cur=String(w.cur||"").trim().toUpperCase();
      const id=String(w.id||"").trim()||uid();
      const bal=Number(w.balance);
      if(!cur || !fxKnown(cur)) problems.push("unsupported currency "+cur);
      else if(seenCur.has(cur)) problems.push("duplicate currency "+cur);
      else if(!isFinite(bal)) problems.push("invalid balance for "+cur);
      else if(seenIds.has(id)) problems.push("duplicate wallet id "+id);
      else {
        seenCur.add(cur); seenIds.add(id);
        let net=0;
        for(const t of (S.txns||[])){
          if(t.status!=="posted" || t.forexAcct!==a.id || t.walletId!==id || t.forexMovementApplied===false) continue;
          const amount=Math.abs(Number(t.amount||t.postings?.[0]?.amt)||0);
          if(t.type==="expense") net-=amount;
          else if(t.type==="refund") net+=amount;
        }
        const opening=w.openingBalance!=null && Number.isFinite(Number(w.openingBalance))
          ? Number(w.openingBalance) : Number(bal)-net;
        rows.push({id,cur,balance:Math.round(bal*100)/100,openingBalance:Math.round(opening*100)/100,asOf:w.asOf||""});
      }
    }
    if(problems.length){
      throw new Error("Forex wallet data could not be migrated safely for "+(a.name||a.id)+": "+problems.join(", "));
    }
    a.wallets=rows;
    a.opening=0;
    a.cur=a.wallets.length===1?a.wallets[0].cur:(a.wallets.length?"MULTI":"INR");
    a.cardMeta=Object.assign({}, a.cardMeta||{}, {cardType:"Forex"});
    const digits=String(a.accountNumber||"").replace(/\D/g,"");
    if(digits.length>4) a.accountNumber="";
    if(!a.cardMeta.last4){
      const masked=String(a.accountMasked||"").replace(/\D/g,"");
      if(masked.length>=4) a.cardMeta.last4=masked.slice(-4);
    }
    a.accountMasked=a.cardMeta.last4?("•••• "+a.cardMeta.last4):"";
  }
  for(const x of S.sips){ x.status=x.status||"active"; x.history=x.history||[]; x.revisions=x.revisions||[]; if(x.freq==null)x.freq=1; }
  for(const x of (S.lending||[])){ x.interestAdjustments=x.interestAdjustments||[]; }
  for(const x of S.salaries){ x.status=x.status||"active"; x.history=x.history||[]; x.revisions=x.revisions||[]; x.freqUnit=x.freqUnit||"month"; if(x.freq==null)x.freq=1; }
  for(const p of S.policies){
    p.payments=p.payments||[];
    // Freeze the premium that historical paid-through assumed, so a later premium edit does not rewrite it.
    if((p.paidThrough||"").trim() && !(Number(p.paidThroughPremium)>0)) p.paidThroughPremium=Number(p.premium)||0;
  }
  try{ migrateContactsFromBank(); }catch(e){ console.warn("contact migrate", e); }
  if(S.autoSip==null) S.autoSip=true;
  if(S.autoSalary==null) S.autoSalary=true;
  if(S.hideBalances==null) S.hideBalances=false;
  if(S.nwPrefs==null) S.nwPrefs=defaultNwPrefs();
  else { const d=defaultNwPrefs(); S.nwPrefs=Object.assign({}, d, S.nwPrefs); }
  if(S.onboardingDone==null) S.onboardingDone=!!(S.accounts&&S.accounts.length);
  if(!Array.isArray(S.expenseCats)||!S.expenseCats.length) S.expenseCats=EXPENSE_CATS.slice();
  if(S.expenseCats && !S.expenseCats.includes("Sent externally")) S.expenseCats.push("Sent externally");
  if(!Array.isArray(S.incomeCats)||!S.incomeCats.length) S.incomeCats=INCOME_CATS.slice();
  for(const t of S.txns){
    if(t.fxRate==null) t.fxRate=S.rate||104.16;
    if(!t.owner&&t.postings?.[0]) t.owner=(S.accounts.find(a=>a.id===t.postings[0].acct)||{}).owner||"Me";
  }
}

function policyStopDate(p){
  // Premiums are not due on or after the earliest of: PPT anniversary, policy-term anniversary, maturity.
  const caps=[];
  const ppt=policyPptEnd(p);
  if(ppt) caps.push(ppt);
  if(p&&p.start&&Number(p.term)>0) caps.push(addM(p.start, Math.round(Number(p.term)*12)));
  const mat=String(p&&p.maturity||"").trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(mat)) caps.push(mat);
  if(!caps.length) return "";
  return caps.slice().sort()[0];
}
function historicalPremiumAmount(p){
  const snap=Number(p&&p.paidThroughPremium);
  if(p&&String(p.paidThrough||"").trim() && snap>0) return snap;
  return Number(p&&p.premium)||0;
}
function policyScheduleDates(p){
  // Instalments: commencement + i*freq months, i = 0 .. n-1, n = PPT years in periods.
  // The stop date itself is not an instalment (PPT anniversary, term anniversary, or maturity).
  const out=[];
  if(!p||!p.start||!(Number(p.premium)>0)) return out;
  const freq=Math.max(1, Number(p.freq)||1);
  const ppt=Number(p.ppt)||0;
  const end=policyStopDate(p);
  let n;
  if(ppt>0) n=Math.max(1, Math.round(ppt*12/freq));
  else n=800;
  for(let i=0;i<n;i++){
    const d=i===0?p.start:addM(p.start, i*freq);
    if(end && d>=end) break;
    out.push(d);
  }
  return out;
}
function policyPremiumsPaidToDate(p){
  const premium=Number(p.premium)||0;
  const pack=coverPremiumSlots(p);
  const covered=pack.covered;
  let total=0, histCount=0, recCount=0;
  for(const v of covered.values()){
    total+=Number(v.amount)||0;
    if(v.source==="historical") histCount++;
    else recCount++;
  }
  const paidCount=covered.size;
  const expectedCount=pack.schedule.length;
  return {
    total: Math.round(total*100)/100,
    count: paidCount,
    source: histCount && recCount ? "mixed" : histCount ? "historical" : recCount ? "recorded" : "none",
    histCount, histAmount: Math.round(histCount*premium*100)/100,
    recordedCount: (p.payments||[]).filter(x=>x&&x.date).length,
    recordedSum: Math.round(pack.recordedSum*100)/100,
    unmatched: pack.unmatched.length,
    expected: expectedCount*premium,
    expectedCount,
    remaining: Math.max(0, expectedCount-paidCount)*premium,
    remainingCount: Math.max(0, expectedCount-paidCount),
    paidThrough: (p.paidThrough||"").trim()
  };
}
function coverPremiumSlots(p){
  const schedule=policyScheduleDates(p);
  const covered=new Map();
  const premium=Number(p&&p.premium)||0;
  const histAmt=historicalPremiumAmount(p);
  const paidThrough=(p&&p.paidThrough||"").trim();
  if(paidThrough){
    for(const d of schedule) if(d<=paidThrough) covered.set(d,{source:"historical", amount:histAmt});
  }
  const recorded=(p&&p.payments||[]).filter(x=>x&&x.date).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.id||"").localeCompare(String(b.id||"")));
  let recordedSum=0;
  const unmatched=[];
  for(const pay of recorded){
    const amt=Number(pay.amount);
    const amount=isFinite(amt)?amt:premium;
    recordedSum+=amount;
    if(paidThrough && pay.date<=paidThrough){
      let slot=null;
      for(const d of schedule){
        if(d<=pay.date && covered.get(d)?.source==="historical") slot=d;
      }
      const cur=slot&&covered.get(slot);
      if(cur && !cur.pay) covered.set(slot, {source:"historical", amount, pay});
      else unmatched.push(pay);
      continue;
    }
    let matched=null;
    for(const d of schedule){
      if(covered.has(d)) continue;
      if(d<=pay.date){ matched=d; break; }
    }
    if(!matched){
      for(const d of schedule){ if(!covered.has(d)){ matched=d; break; } }
    }
    if(matched) covered.set(matched, {source:"recorded", amount, pay});
    else unmatched.push(pay);
  }
  return {schedule, covered, recordedSum, unmatched};
}
function policyNextUnpaidDue(p){
  if(!p) return "";
  if(p.finalPremiumPaid) return "";
  if(!policyPremiumActive(p)) return "";
  const pack=coverPremiumSlots(p);
  const end=policyStopDate(p);
  if(!pack.schedule.length){
    const n=(p.next||"").trim();
    if(n && end && n>=end) return "";
    return n||"";
  }
  for(const d of pack.schedule) if(!pack.covered.has(d)) return d;
  return "";
}
function policyHasOpenPremium(p){
  if(!policyPremiumActive(p)) return false;
  if(p.finalPremiumPaid) return false;
  const next=policyNextUnpaidDue(p);
  if(!next) return false;
  const end=policyStopDate(p);
  if(end && next>=end) return false;
  return true;
}
function policyPayableDate(p){
  return policyNextUnpaidDue(p)||"";
}
function policyEffectiveNext(p){
  // Prefer computed next unpaid; fall back to stored p.next for display migration
  const computed=policyNextUnpaidDue(p);
  if(computed) return computed;
  const stored=(p.next||"").trim();
  if(stored && !p.finalPremiumPaid){
    const end=policyPptEnd(p);
    if(end && stored>end) return "";
    return stored;
  }
  return "";
}
function policyFullyPaidTerm(p){
  if(p.finalPremiumPaid) return true;
  if(!policyPremiumActive(p)) return true;
  return !policyNextUnpaidDue(p);
}
function policyPptEnd(p){
  if(!p||!p.start||!(Number(p.ppt)>0)) return "";
  // Last premium due date = commencement + PPT years (e.g. 2016-04-28 + 10y → 2026-04-28).
  return addM(p.start, Math.round(Number(p.ppt)*12));
}

function policyPremiumActive(p){
  if(!p) return false;

function nextDue(day){
  const t=today();
  const mk=(ym,d)=>{const [y,m]=ym.split("-").map(Number); const last=new Date(Date.UTC(y,m,0)).getUTCDate(); return y+"-"+String(m).padStart(2,"0")+"-"+String(Math.min(d,last)).padStart(2,"0");};
  let c=mk(t.slice(0,7),day);
  if(daysTo(c)<0) c=mk(addM(t.slice(0,8)+"01",1).slice(0,7),day);
  return c;
}

function maskCardLast4(raw){
  const digits=String(raw==null?"":raw).replace(/\D/g,"");
  if(!digits) return {ok:true, last4:""};
  if(digits.length===4 || (digits.length>=12 && digits.length<=19)) return {ok:true, last4:digits.slice(-4)};
  return {ok:false, error:"Enter the last 4 digits, or the full card number (12–19 digits). CVV and PIN are never stored."};
}
function collectForexWallets(rows){
  if(!Array.isArray(rows) || !rows.length) return {ok:false, error:"Add at least one currency balance."};
  const seen=new Set();
  const wallets=[];
  for(const row of rows){
    const cur=String(row&&row.cur||"").trim().toUpperCase();
    if(!fxKnown(cur)) return {ok:false, error:"Choose a supported currency."};
    if(seen.has(cur)) return {ok:false, error:cur+" is already on this card. Update that balance instead of adding it twice."};
    seen.add(cur);
    const n=Number(row.balance);
    if(!isFinite(n)) return {ok:false, error:"Enter a valid "+cur+" balance."};
    wallets.push({
      id:row.id||"",
      cur,
      balance:Math.round(n*100)/100,
      asOf:row.asOf||""
    });
  }
  return {ok:true, wallets};
}
function forexWallets(a){
  return (a && Array.isArray(a.wallets) ? a.wallets : []).filter(w=>w && fxKnown(String(w.cur||"").toUpperCase()));
}
function forexWalletInDisplay(amount, cur){
  const n=Number(amount)||0;
  const display=S.display||"INR";
  if(!cur || cur===display) return {ok:true, value:n};
  if(cur==="INR"){
    if(display==="EUR" && Number(S.rate)>0) return {ok:true, value:n/Number(S.rate)};
    return {ok:false, value:0};
  }
  if(cur==="EUR"){
    if(!(Number(S.rate)>0)) return {ok:false, value:0};
    if(display==="EUR") return {ok:true, value:n};
    if(display==="INR") return {ok:true, value:n*Number(S.rate)};
    return {ok:false, value:0};
  }
  const per=S.fx && Number(S.fx[cur]);
  if(!(per>0)) return {ok:false, value:0};
  const inr=n*per;
  if(display==="INR") return {ok:true, value:inr};
  if(display==="EUR") return {ok:true, value:inr/Number(S.rate)};
  return {ok:false, value:0};
}
function forexDisplayValue(a){
  let value=0, missing=false;
  for(const w of forexWallets(a)){
    const cur=String(w.cur).toUpperCase();
    const part=forexWalletInDisplay(w.balance, cur);
    if(!part.ok) missing=true;
    else value+=part.value;
  }
  return {value:Math.round(value*100)/100, missing};
}
function forexWalletNetMovement(acctId, walletId){
  let net=0;
  for(const t of (S.txns||[])){
    if(t.status!=="posted" || t.forexAcct!==acctId || t.walletId!==walletId || t.forexMovementApplied===false) continue;
    const amount=Math.abs(Number(t.amount||t.postings?.[0]?.amt)||0);
    if(t.type==="expense") net-=amount;
    else if(t.type==="refund") net+=amount;
  }
  return Math.round(net*100)/100;
}
function forexWalletReferenced(acctId, walletId){
  return (S.txns||[]).some(t=>{
    if(t.forexAcct===acctId&&t.walletId===walletId) return true;
    // An old/malformed posting without wallet metadata is ambiguous: protect every wallet
    // on this card rather than allowing the user to discard the only recoverable history.
    return (!t.forexAcct||!t.walletId)&&(t.postings||[]).some(p=>p.acct===acctId);
  });
}
function validateForexWalletChanges(a, wallets){
  if(!a||a.type!=="forex") return {ok:true};
  const current=forexWallets(a), nextIds=new Set(), nextById=new Map();
  for(const w of (wallets||[])){
    const id=String(w.id||"");
    if(id){
      if(nextIds.has(id)) return {ok:false,error:"A currency wallet is listed more than once. Keep each wallet ID unique."};
      nextIds.add(id); nextById.set(id,w);
    }
  }
  for(const old of current){
    const id=String(old.id||""), next=nextById.get(id), referenced=id&&forexWalletReferenced(a.id,id);
    if(referenced&&!next) return {ok:false,error:"The "+old.cur+" wallet has transaction history and cannot be removed. Keep it on the card with a zero balance; you can archive the card instead."};
    if(referenced&&next&&String(next.cur||"").toUpperCase()!==String(old.cur||"").toUpperCase()) return {ok:false,error:"The "+old.cur+" wallet has transaction history and its currency cannot be changed. Keep this wallet in "+old.cur+" and add a separate wallet for another currency."};
  }
  return {ok:true};
}
function applyForexWallets(a, wallets){
  const validation=validateForexWalletChanges(a,wallets);
  if(!validation.ok) throw new Error(validation.error);
  const prevById=new Map(forexWallets(a).filter(w=>w.id).map(w=>[String(w.id),w]));
  const prevByCur=new Map(forexWallets(a).map(w=>[String(w.cur).toUpperCase(),w]));
  a.type="forex";
  a.wallets=wallets.map(w=>{
    const cur=String(w.cur).toUpperCase();
    const old=(w.id&&prevById.get(String(w.id)))||(!w.id&&prevByCur.get(cur))||null;
    const id=(old&&old.id)||w.id||uid();
    const balance=Math.round(Number(w.balance)*100)/100;
    const unchanged=old && Math.abs(Number(old.balance)-balance)<0.001;
    const net=forexWalletNetMovement(a.id,id);
    return {id,cur,balance,openingBalance:Math.round((balance-net)*100)/100,asOf:unchanged?(old.asOf||today()):today()};
  });
  a.opening=0;
  a.cur=a.wallets.length===1?a.wallets[0].cur:"MULTI";
  a.cardMeta=Object.assign({}, a.cardMeta||{}, {cardType:"Forex"});
  const digits=String(a.accountNumber||"").replace(/\D/g,"");
  if(digits.length>4) a.accountNumber="";
}

function inspectAmt(v){
  if(v==null) return {ok:true, empty:true, value:0, decimals:0};
  let s=String(v).trim().replace(/\u00a0/g," ");
  if(!s) return {ok:true, empty:true, value:0, decimals:0};
  let neg=false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1).trim(); }
  s=s.replace(/[₹€$\s]/g,"");
  if(s.startsWith("-")){ neg=true; s=s.slice(1); }
  if(s.startsWith("+")) s=s.slice(1);
  if(!s) return {ok:false, error:"Enter a number."};
  if(/[^0-9.,]/.test(s)) return {ok:false, error:"Use digits with commas or one decimal separator."};
  // Several dots and no comma: European/Indian thousands (1.000.000), not a decimal.
  if(!s.includes(",") && (s.match(/\./g)||[]).length>1){
    const g=groupedDigits(s.split("."));
    if(g==null) return {ok:false, error:"Too many decimal points."};
    return {ok:true, empty:false, value:neg?-g:g, decimals:0};
  }
  const lastComma=s.lastIndexOf(","), lastDot=s.lastIndexOf(".");
  let decSep=null, grpSep=null;
  if(lastComma>=0 && lastDot>=0){
    if(lastComma>lastDot){ decSep=","; grpSep="."; }
    else { decSep="."; grpSep=","; }
  }else if(lastComma>=0){
    const parts=s.split(",");
    const tail=parts[parts.length-1];
    // European decimal-comma: last group 1-2 digits (e.g. 12,00 or 1,5)
    // Indian/Western thousands: last group 3 digits (e.g. 1,00,000 or 1,234)
    if(parts.length>=2 && tail.length>=1 && tail.length<=2){
      decSep=",";
    }else{
      grpSep=",";
    }
  }else if(lastDot>=0) decSep=".";
  let intPart=s, frac="";
  if(decSep){
    const i=s.lastIndexOf(decSep);
    intPart=s.slice(0,i);
    frac=s.slice(i+1);
    if(!frac || /[^0-9]/.test(frac)) return {ok:false, error:"Incomplete decimal."};
    if(grpSep){
      const groups=intPart.split(grpSep);
      if(groups.some(g=>!g)) return {ok:false, error:"Misplaced separator."};
      if(groups.length>1){
        const last=groups[groups.length-1], first=groups[0], middles=groups.slice(1,-1);
        const western=last.length===3 && middles.every(p=>p.length===3) && first.length>=1 && first.length<=3;
        const indian=last.length===3 && middles.every(p=>p.length===2) && first.length>=1 && first.length<=2;
        if(!(western || indian)) return {ok:false, error:"Number separators are not a valid amount."};
      }
      intPart=groups.join("");
    }else{
      // Pure decimal-comma case (no thousands separator). Integer part must be plain digits.
      if(/[.,]/.test(intPart)) return {ok:false, error:"Misplaced separator."};
    }
  }else if(grpSep){
    const parts=s.split(grpSep);
    if(parts.some(p=>!p)) return {ok:false, error:"Misplaced separator."};
    if(parts.length>1){
      const last=parts[parts.length-1], first=parts[0], middles=parts.slice(1,-1);
      const western=last.length===3 && middles.every(p=>p.length===3) && first.length>=1 && first.length<=3;
      const indian=last.length===3 && middles.every(p=>p.length===2) && first.length>=1 && first.length<=2;
      if(!(western || indian)) return {ok:false, error:"Number separators are not a valid amount."};
    }
    intPart=parts.join("");
    frac="";
  }
  if(!intPart) intPart="0";
  if(/[^0-9]/.test(intPart) || (frac && /[^0-9]/.test(frac))) return {ok:false, error:"Not a valid amount."};
  if(frac.length>6) return {ok:false, error:"Too many decimal places."};
  const n=Number((intPart||"0")+"."+(frac||"0"));
  if(!isFinite(n)) return {ok:false, error:"Not a valid amount."};
  return {ok:true, empty:false, value:neg?-Math.abs(n):n, decimals:frac.length};
}
function groupedDigits(parts){
  if(!parts || parts.length<2 || parts.some(p=>!p || !/^\d+$/.test(p))) return null;
  const last=parts[parts.length-1], first=parts[0], middles=parts.slice(1,-1);
  const western=last.length===3 && middles.every(p=>p.length===3) && first.length>=1 && first.length<=3;
  const indian=last.length===3 && middles.every(p=>p.length===2) && first.length>=1 && first.length<=2;
  const legacyHundreds=parts.length===2 && last==="00";
  if(!(western || indian || legacyHundreds)) return null;
  const n=Number(parts.join(""));
  return isFinite(n)?n:null;
}
// "1.000" is one thousand when a money field cannot store three decimal places.
// "10.999" stays a 3-decimal number and is rejected there — it is not a thousands group.
function thousandsFallback(raw){
  if(raw==null) return null;
  let s=String(raw).trim().replace(/\u00a0/g," ");
  let neg=false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1).trim(); }
  s=s.replace(/[₹€$\s]/g,"");
  if(s.startsWith("-")){ neg=true; s=s.slice(1); }
  if(s.startsWith("+")) s=s.slice(1);
  if(!s || /[^0-9.,]/.test(s)) return null;
  const commas=(s.match(/,/g)||[]).length, dots=(s.match(/\./g)||[]).length;
  if(commas+dots!==1) return null;
  const parts=s.split(commas?",":".");
  if(parts.length!==2 || parts[1]!=="000") return null;
  const g=groupedDigits(parts);
  if(g==null) return null;
  return neg?-g:g;
}
function parseAmt(v){
  const r=inspectAmt(v);
  if(!r.ok) return null;
  return r.value;
}
function readAmt(v, opts){
  opts=opts||{};
  let r=inspectAmt(v);
  if(!r.ok) return r;
  const max=opts.maxDecimals!=null?opts.maxDecimals:2;
  if(!r.empty && r.decimals>max){
    const g=thousandsFallback(v);
    if(g==null) return {ok:false, error:"Use at most "+max+" decimal places."};
    r={ok:true, empty:false, value:g, decimals:0};
  }
  if(!opts.allowNegative && r.value<0) return {ok:false, error:"Enter a positive amount."};
  if(opts.required && (r.empty || (opts.positive && !(r.value>0)))) return {ok:false, error:r.empty?"Enter an amount.":"Enter an amount greater than zero."};
  return {ok:true, value:r.value, empty:!!r.empty};
}
function rejectAmt(raw, opts){
  const r=readAmt(raw, opts||{required:true, maxDecimals:2, positive:true});
  if(!r.ok){ try{ alert(r.error); }catch(e){} return null; }
  return r.value;
}
function readCalendarDay(raw){
  if(raw==null || String(raw).trim()==="") return {ok:true, value:0};
  const r=readAmt(raw,{required:true, positive:true, maxDecimals:0, allowNegative:false});
  if(!r.ok) return r;
  if(r.value<1 || r.value>31) return {ok:false, error:"Use a day from 1 to 31."};
  return {ok:true, value:r.value};
}

const acct = id => S.accounts.find(a=>a.id===id);

function contactById(id){ return (S.contacts||[]).find(c=>c.id===id); }
function normalizeContactName(name){
  return String(name||"").normalize("NFKC").trim().replace(/\s+/g," ").toLowerCase();
}
function findContactByName(name){
  const key=normalizeContactName(name);
  if(!key) return {contact:null, ambiguous:false};
  const matches=(S.contacts||[]).filter(c=>normalizeContactName(c.name)===key);
  return {contact:matches.length===1?matches[0]:null, ambiguous:matches.length>1};
}
function ensureContactByName(name){
  name=String(name||"").normalize("NFKC").trim().replace(/\s+/g," ");
  if(!name) return null;
  const found=findContactByName(name);
  if(found.ambiguous) return null;
  if(found.contact) return found.contact;
  const c={id:uid(),name,notes:"",methods:[]};
  S.contacts.push(c);
  return c;
}
function renamePerson(oldName, newName){
  if(!oldName||!newName||oldName===newName) return;
const hit=(a)=>a===oldName || String(a||"").toLowerCase()===String(oldName).toLowerCase();
  for(const a of S.accounts||[]) if(hit(a.owner)) a.owner=newName;
  for(const h of S.holdings||[]) if(hit(h.owner)) h.owner=newName;
  for(const p of S.policies||[]) if(hit(p.owner)) p.owner=newName;
  for(const c of S.contacts||[]) if(hit(c.name)) c.name=newName;
  for(const b of S.bankContacts||[]) if(hit(b.person)) b.person=newName;
  for(const l of S.lending||[]) if(hit(l.person)) l.person=newName;
  for(const s of S.salaries||[]) if(hit(s.person)) s.person=newName;
  for(const t of S.txns||[]){
    if(hit(t.owner)) t.owner=newName;
    if(hit(t.person)) t.person=newName;
  }
  for(const h of S.history||[]) if(hit(h.owner)) h.owner=newName;
  for(const p of S.purchases||[]) if(hit(p.owner)) p.owner=newName;
  if(Array.isArray(S.people)) S.people=S.people.map(n=>hit(n)?newName:n);
}
function allPersonNames(){

}
function migrateContactsFromBank(){
  if(!S.contacts) S.contacts=[];
  if(!S.bankContacts) S.bankContacts=[];
  const addMethod=(person, meth)=>{
    const c=ensureContactByName(person); if(!c) return;
    c.methods=c.methods||[];
    const num=(meth.accountNumber||meth.upi||"").replace(/\s/g,"");
    const exists=c.methods.some(m=>{
      const mn=(m.accountNumber||m.upi||"").replace(/\s/g,"");
      return (meth.id&&m.id===meth.id) || (num&&mn&&num===mn) || (meth.upi&&m.upi&&meth.upi===m.upi);
    });
    if(!exists) c.methods.push(meth);
  };
  for(const b of S.bankContacts){
    const person=(b.person||b.holder||"").trim(); if(!person) continue;
    const kind=b.upi||(b.bank||"").toUpperCase()==="UPI"?"upi":"bank";
    addMethod(person,{id:b.id||uid(),kind,bank:b.bank||(kind==="upi"?"UPI":""),holder:b.holder||person,accountNumber:b.accountNumber||b.upi||"",accountMasked:b.accountMasked||"",ifsc:b.ifsc||"",branch:b.branch||"",branchCode:b.branchCode||"",upi:b.upi||"",cur:b.cur||"INR",nickname:b.nickname||""});
  }
  for(const l of (S.lending||[])) if(l.person) ensureContactByName(l.person);
  for(const c of S.contacts){
    for(const m of (c.methods||[])){
      if(!m.id) m.id=uid();
      const hit=S.bankContacts.find(b=>b.id===m.id || (((b.accountNumber||b.upi||"")&&(b.accountNumber||b.upi)===(m.accountNumber||m.upi))&&((b.person||"").toLowerCase()===(c.name||"").toLowerCase())));
      if(!hit){

  for(const t of S.txns||[]){

    else if(!found.ambiguous){

    }else delete t.contactId;
  }
  for(const l of S.lending||[]){
    if(l.contactId&&!contactById(l.contactId)) delete l.contactId;
    if(!l.contactId && l.person){
      const found=findContactByName(l.person);
      if(found.contact) l.contactId=found.contact.id;
      else if(!found.ambiguous){
        const c=ensureContactByName(l.person);
        if(c) l.contactId=c.id;

    if(l.contactId){
      for(const t of S.txns||[]){
        if(t.loanId===l.id || t.lendingId===l.id){
          if(!t.contactId||!contactById(t.contactId)) t.contactId=l.contactId;

function balance(a){
  let b = a.opening || 0;
  for(const t of S.txns){ if(t.status!=="posted" || !Array.isArray(t.postings)) continue; for(const p of t.postings) if(p&&p.acct===a.id) b += Number(p.amt)||0; }

}
function holdPos(h){
  let u=0,c=0;
  for(const t of S.txns){
    if(t.status!=="posted"||t.hold!==h.id) continue;
    if(t.type==="buy"||t.type==="open"||t.type==="adjust"){
      u+=Number(t.units)||0;
      c+=Number(t.cost)||0;
    }else if(t.type==="sell"){
      const units=Math.max(0, Number(t.units)||0);
      const f=u>0?Math.min(1, units/u):0;
      c-=c*f;
      u-=units;
    }
  }
  if(u<1e-9){ u=0; c=Math.max(0,c); }
  if(c<0) c=0;
  return {u:Math.round(u*1e6)/1e6, c:Math.round(c*100)/100, v:Math.round(u*(h.price||0)*100)/100};
}
function personPos(owner){
  // Informal IOUs from transfers only. Lending module uses loansReceivable/lendingPosition —
  // never mix loanId/lendingId/principalReduction/interestSettlement or lend/borrow types here
  // (that created phantom liabilities when repayments set negative pd).
  const m={};
  for(const t of S.txns){
    if(t.status!=="posted"||!t.person||!t.pd||!t.postings?.[0]) continue;
    if(t.loanId||t.lendingId||t.principalReduction||t.interestSettlement) continue;
    if(["lend","borrow","lendback","repay","givetake"].includes(t.type) || t.giveTake) continue;
    const who=t.owner||"Me";
    if(owner && who!==owner) continue;
    // Legacy records may lack loanId but use loan-related notes
    const note=(t.note||"").toLowerCase();
    if(/\b(loan|lending|interest on loan|principal repay|borrowed from|lent to)\b/.test(note) && (t.person)){
      // Only skip if this person also appears in S.lending — avoid excluding ordinary transfers
      if((S.lending||[]).some(L=>(L.person||"").toLowerCase()===(t.person||"").toLowerCase())) continue;
    }
    m[t.person]=(m[t.person]||0)+toDisplayAt(t.pd,t.postings[0].cur,t.fxRate);

}

function giveTakeBalance(contactIdOrName){

  let bal=0;

function giveTakeOpenItems(contactIdOrName, excludeSettlementId){
  const posted=(S.txns||[]).filter(t=>t.status==="posted"&&t.giveTake&&giveTakeMatches(t,contactIdOrName));
  const rows=[];
  // New records have individual source IDs. Settlements are linked to exactly
  // one source and never silently netted against another transaction.
  for(const t of posted.filter(x=>x.giveTakeVersion===2&&!x.settlesTxnId&&!x.settlesLegacyKey&&!x.settlement)){
    const cur=t.postings?.[0]?.cur||t.cur||S.display;
    let outstanding=Number(t.pd)||0;
    for(const st of posted) if(st.id!==excludeSettlementId&&st.settlesTxnId===t.id) outstanding+=Number(st.pd)||0;
    rows.push({id:t.id,txn:t,cur,outstanding:Math.round(outstanding*100)/100});
  }
  // Older records did not store settlement-to-source links. Keep them as one
  // transparent legacy balance per person and currency instead of guessing
  // which old transaction a settlement belonged to.
  const legacy=new Map();
  for(const t of posted.filter(x=>!x.giveTakeVersion&&!x.settlesTxnId&&!x.settlesLegacyKey)){
    const cur=t.postings?.[0]?.cur||t.cur||S.display;
    const personKey=t.contactId||normalizeContactName(t.person);
    const key=personKey+"|"+cur;
    if(!legacy.has(key)) legacy.set(key,{legacyKey:key,contactId:t.contactId||null,person:t.person,cur,outstanding:0,txns:[]});
    const row=legacy.get(key); row.outstanding+=Number(t.pd)||0; row.txns.push(t);
  }
  for(const [key,row] of legacy){
    for(const st of posted) if(st.id!==excludeSettlementId&&st.settlesLegacyKey===key) row.outstanding+=Number(st.pd)||0;
    row.outstanding=Math.round(row.outstanding*100)/100;
    if(Math.abs(row.outstanding)>0.005) rows.push({...row,id:"legacy:"+key,txn:null});
  }
  return rows.filter(x=>Math.abs(x.outstanding)>0.005);
}

function applyForexMovement(acctId, walletId, delta){
  const a=acct(acctId);
  if(!a||a.type!=="forex"||!Array.isArray(a.wallets)||!isFinite(Number(delta))) return false;
  const w=a.wallets.find(x=>x.id===walletId);
  if(!w) return false;
  w.balance=Math.round((Number(w.balance||0)+Number(delta))*100)/100;
  return true;
}
function forexTxnDelta(t){
  if(!t||!t.forexAcct||!t.walletId||t.forexMovementApplied===false) return 0;
  const amount=Math.abs(Number(t.amount||t.postings?.[0]?.amt)||0);
  if(t.type==="expense") return -amount;
  if(t.type==="refund") return amount;
  return 0;
}
function forexTxnMovement(t, reverse){
  if(!t) return true;
  if(t.forexMovementApplied===false) return true;
  if(!t.forexAcct&&!t.walletId) return true;
  if(!t.forexAcct||!t.walletId||!["expense","refund"].includes(t.type)) return false;
  const delta=forexTxnDelta(t);
  if(!delta) return false;
  return applyForexMovement(t.forexAcct,t.walletId,reverse?-delta:delta);
}
function forexWalletLedgerBalance(acctId,walletId){
  const a=acct(acctId),w=a&&a.type==="forex"&&(a.wallets||[]).find(x=>x.id===walletId);
  if(!w||!Number.isFinite(Number(w.openingBalance))) return null;
  let expected=Number(w.openingBalance);
  for(const t of (S.txns||[])){
    if(t.status!=="posted"||t.forexAcct!==acctId||t.walletId!==walletId) continue;
    expected+=forexTxnDelta(t);
  }
  return Math.round(expected*100)/100;
}
function syncLinkedPurchaseForTxn(t, previousDate){
  if(!t||t.type!=="expense") return 0;
  const posting=t.postings&&t.postings[0];
  if(!posting) return 0;
  let updated=0;
  for(const p of (S.purchases||[])){
    if(p.txnId!==t.id) continue;
    let months=Number(p.warrantyMonths);
    if(!(months>0)&&p.expiry&&p.date){
      const [y1,m1]=p.date.split("-").map(Number),[y2,m2]=p.expiry.split("-").map(Number);
      const inferred=(y2-y1)*12+(m2-m1);
      if(inferred>0) months=inferred;
    }
    if(p.expiry&&previousDate&&t.date!==previousDate&&months>0) p.expiry=addM(t.date,months);
    if(months>0) p.warrantyMonths=months;
    p.date=t.date;
    p.amt=Math.abs(Number(posting.amt)||0);
    p.cur=posting.cur;
    p.acct=posting.acct;
    p.txnVoided=false;
    updated++;
  }
  return updated;
}

async function commitForexAware(mutator){
  const before=JSON.parse(JSON.stringify(S));
  try{
    const result=mutator();
    const ok=await save();
    if(!ok){ S=before; return {ok:false,result:null}; }
    return {ok:true,result};
  }catch(err){ S=before; console.warn("Forex-aware transaction was rolled back",err); return {ok:false,result:null,error:err}; }
}
async function voidTxn(id){
  const t=S.txns.find(x=>x.id===id); if(!t||t.status!=="posted") return false;
  if(t.type==="expense"&&S.txns.some(x=>x.type==="refund"&&x.refundOf===id&&x.status==="posted")) return false;
  if(t.giveTake&&!t.settlesTxnId&&S.txns.some(x=>x.status==="posted"&&x.giveTake&&x.settlesTxnId===id)) return false;
  const r=await commitForexAware(()=>{ if(!forexTxnMovement(t,true)) throw new Error("Forex wallet reference is missing"); t.status="voided"; setLinkedPurchaseTxnVoided(id,true); log("void",id); });
  return r.ok;
}
async function unvoid(id){
  const t=S.txns.find(x=>x.id===id); if(!t||t.status==="posted") return false;
  if(t.giveTake&&t.settlesTxnId){
    const source=S.txns.find(x=>x.id===t.settlesTxnId&&x.status==="posted"&&x.giveTake);
    if(!source) return false;
    let available=Number(source.pd)||0;
    for(const st of S.txns||[]) if(st.status==="posted"&&st.giveTake&&st.settlesTxnId===source.id) available+=Number(st.pd)||0;
    const expected=available>0?-1:1;
    if(Math.sign(Number(t.pd)||0)!==expected || Math.abs(Number(t.pd)||0)>Math.abs(available)+0.005) return false;
  }
  if(t.giveTake&&t.settlesLegacyKey){
    const item=giveTakeOpenItems(t.contactId||t.person).find(x=>x.legacyKey===t.settlesLegacyKey);
    const available=item?.outstanding||0, expected=available>0?-1:1;
    if(!item||Math.sign(Number(t.pd)||0)!==expected||Math.abs(Number(t.pd)||0)>Math.abs(available)+0.005) return false;
  }
  if(t.type==="refund"){
    const parent=S.txns.find(x=>x.id===t.refundOf);
    if(!parent||parent.status!=="posted") return false;
  }
  const r=await commitForexAware(()=>{ if(!forexTxnMovement(t,false)) throw new Error("Forex wallet reference is missing"); t.status="posted"; setLinkedPurchaseTxnVoided(id,false); log("restore",id); });
  return r.ok;
}

function processDueAutomations(){

  const MAX_EACH=36;
  const runs=x=>(x.status||"active")==="active";

    for(const x of S.sips){
      if(!runs(x)) continue;
      let guard=0;
      while(x.next && daysTo(x.next)<=0 && guard++<MAX_EACH){
        const terms=sipTermsAt(x, x.next);
        const a=acct(terms.acct);
        const h=S.holdings.find(v=>v.id===x.hold)||{};
        const price=h.price>0?h.price:0;
        if(!(price>0)){
          skipped++;
          x.needsPrice=true;
          break;
        }
        x.needsPrice=false;
        if(!a||a.archived){
          skipped++;
          x.history=x.history||[];
          x.history.push({date:x.next,status:"missed",units:0,amount:terms.amt,auto:true,note:"Account unavailable"});
          x.next=advanceSipNext(x, x.next);
          continue;
        }
        const units=Math.round((terms.amt/price)*1e6)/1e6;
        const payDate=x.next;
        const n=S.txns.length;
        addTxn({type:"buy",date:payDate,note:"SIP (auto)",hold:x.hold,units,cost:terms.amt,sip:x.id,postings:[{acct:a.id,amt:-terms.amt,cur:x.cur}]},{skipSave:true});
        if(S.txns.length===n){ x.next=advanceSipNext(x, payDate); continue; }
        x.history=x.history||[]; x.history.push({date:payDate,status:"paid",units,amount:terms.amt,auto:true});
        x.next=advanceSipNext(x, payDate); sips++;
      }
    }
  }
  if(S.autoSalary!==false){
    for(const x of (S.salaries||[])){
      if(!runs(x)) continue;
      let guard=0;
      while(x.next && daysTo(x.next)<=0 && guard++<MAX_EACH){
        const payDate=x.next;
        const terms=salaryTermsAt(x, payDate);
        const a=acct(terms.acct);
        if(!a||a.archived){
          skipped++;
          x.history=x.history||[];
          x.history.push({date:payDate,status:"missed",amount:terms.amt,auto:true,note:"Account unavailable"});
          x.next=advanceSalaryNext(x, payDate);
          continue;
        }
        const n=S.txns.length;
        addTxn({type:"income",date:payDate,note:x.label||"Salary (auto)",cat:"Salary",person:x.person||"",owner:x.person||a.owner||"Me",salaryId:x.id,postings:[{acct:a.id,amt:terms.amt,cur:x.cur||a.cur}]},{skipSave:true});
        if(S.txns.length===n){ x.next=advanceSalaryNext(x, payDate); continue; }
        x.history=x.history||[]; x.history.push({date:payDate,status:"received",amount:terms.amt,auto:true});
        x.next=advanceSalaryNext(x, payDate); salaries++;
      }
    }
  }
  const still=(list)=> (list||[]).filter(x=>runs(x) && x.next && daysTo(x.next)<=0).length;
  const sipBacklog=still(S.sips), salaryBacklog=still(S.salaries);
  if(sips||salaries||skipped) save();
  return {sips, salaries, skipped, sipBacklog, salaryBacklog};
}

function applySectionSort(arr, section, accessors){
  // accessors: { name:fn, balance:fn, ... }
  const pref=getSortPref(section);
  if(pref.key==="manual" || !accessors[pref.key]) return sortedList(arr);
  const dir=pref.dir==="desc"?-1:1;
  return arr.slice().sort((a,b)=>{
    const va=accessors[pref.key](a), vb=accessors[pref.key](b);
    if(va==null&&vb==null) return 0;
    if(va==null) return 1;
    if(vb==null) return -1;
    if(typeof va==="number" && typeof vb==="number") return (va-vb)*dir;
    return String(va).localeCompare(String(vb), undefined, {sensitivity:"base", numeric:true})*dir;
  });
}

function sortedList(arr, key){
  // Manual Order = original array order. Never mutates arr.
  if(!arr||!arr.length) return arr||[];
  return arr.slice();
}

function applySortOrder(arr, orderedIds){
  if(!arr||!orderedIds) return;
  orderedIds.forEach((id,i)=>{ const x=arr.find(y=>y.id===id); if(x) x.sortOrder=i; });
}
function getNwPrefs(){
  const d=defaultNwPrefs();
  const p=(S&&S.nwPrefs)||{};
  return {
    insuranceCoverage:!!(p.insuranceCoverage!=null?p.insuranceCoverage:d.insuranceCoverage),
    insuranceCash:!!(p.insuranceCash!=null?p.insuranceCash:d.insuranceCash),
    loansReceivable:!!(p.loansReceivable!=null?p.loansReceivable:d.loansReceivable),
    accruedInterest:!!(p.accruedInterest!=null?p.accruedInterest:d.accruedInterest)
  };
}
function loansReceivable(owner){
  let receivable=0, payable=0, principalRecv=0, interestRecv=0;
  const prefs=getNwPrefs();
  for(const l of (S.lending||[])){
    const a=acct(l.account);
    if(owner && a && a.owner && a.owner!==owner) continue;
    if(owner && !a && owner!=="Me") continue;
    const p=lendingPosition(l);
    const prin=toDisplay(p.principalLeft, l.cur);
    const intL=toDisplay(p.interestLeft, l.cur);
    if(l.direction==="lent"){
      // Principal and interest prefs are independent
      if(prefs.loansReceivable){ receivable+=prin; principalRecv+=prin; }
      if(prefs.accruedInterest){ receivable+=intL; interestRecv+=intL; }
    } else {
      // Borrowed amounts are always liabilities (not controlled by receivable prefs)
      payable+=prin;
      payable+=intL; // interest owed on money we borrowed
    }
  }
  return {receivable, payable, principalRecv, interestRecv};
}

function insuranceValues(owner){
  const prefs=getNwPrefs();
  let coverage=0, cashValue=0;
  for(const p of (S.policies||[])){
    if(owner && (p.owner||"Me")!==owner) continue;
    const cur=p.cur||S.display||"INR";
    coverage+=toDisplay(Number(p.sum)||0, cur);
    const fv=Number(p.fundValue!=null?p.fundValue:(p.surrenderValue!=null?p.surrenderValue:0))||0;
    if(fv>0 && prefs.insuranceCash) cashValue+=toDisplay(fv, cur);
  }
  return {coverage, cashValue, coverageForAdjusted: prefs.insuranceCoverage?coverage:0};
}

function normKey(s){ return String(s||"").trim().toLowerCase(); }
function holdingLinkedTo(h, a){
  if(!h||!a) return false;
  if(h.accountId && h.accountId===a.id) return true;
  const ref=normKey(h.demat);
  if(!ref) return false;
  const keys=[a.id, a.name, a.broker, a.dematId, a.accountNumber, a.accountMasked].map(normKey).filter(Boolean);
  return keys.includes(ref);
}
function ownerHasLiveHoldings(owner){
  return (S.holdings||[]).some(h=>{
    if((h.owner||"Me")!==(owner||"Me")) return false;
    const p=holdPos(h);
    return p.u>0 || p.c>0 || p.v>0;
  });
}
function dematClaims(){
  const map=new Map();
  for(const a of (S.accounts||[])){
    if(a.archived||a.type!=="demat") continue;
    for(const h of (S.holdings||[])){
      if(map.has(h.id)) continue;
      if(holdingLinkedTo(h,a)) map.set(h.id, a.id);
    }
  }
  return map;
}
function holdingsForDemat(a, claims){
  const c=claims||dematClaims();
  return (S.holdings||[]).filter(h=>c.get(h.id)===a.id);
}
function dematHasExplicitValue(a){
  return !!(a && a.manualValue!=null && a.manualValue!=="" && isFinite(Number(a.manualValue)));
}
function amountInCur(amount, fromCur, toCur){
  const n=Number(amount)||0;
  if(!fromCur||!toCur||fromCur===toCur) return n;
  const disp=toDisplay(n, fromCur);
  if(toCur===(S.display||"INR")) return disp;
  if(toCur==="EUR") return (S.rate?disp/(S.rate):disp);
  return disp*(S.rate||1);
}
function resolvedDematMode(a){
  if(!a) return "manual";
  if(a.valuationMode==="holdings"||a.valuationMode==="manual") return a.valuationMode;
  if((S.holdings||[]).some(h=>holdingLinkedTo(h,a))) return "holdings";
  return "manual";
}
function dematPosition(a, claims){
  const invested=Math.round((Number(a&&a.invested)||0)*100)/100;
  const mode=resolvedDematMode(a);
  const linked=a?holdingsForDemat(a, claims):[];
  if(mode==="holdings"){
    let value=0, cost=0;
    for(const h of linked){
      const p=holdPos(h);
      value+=amountInCur(p.v, h.cur, a.cur);
      cost+=amountInCur(p.c, h.cur, a.cur);
    }
    value=Math.round(value*100)/100;
    cost=Math.round(cost*100)/100;
    if(linked.length && (value>0 || cost>0)){
      const basis=invested>0?invested:cost;
      return {mode, invested:basis, accountInvested:invested, holdingCost:cost, value, pl:Math.round((value-basis)*100)/100, estimated:false, source:"holdings", holdings:linked};
    }
    // No holdings are linked to this specific Demat account.
    // Do not invent a value from the account's invested amount or from other holdings of the owner.
    return {mode, invested, accountInvested:invested, holdingCost:0, value:0, pl:0, estimated:false, source:"unlinked", holdings:linked};
  }
  if(!dematHasExplicitValue(a)){
    return {mode:"manual", invested, accountInvested:invested, value:invested, pl:0, estimated:true, source:"invested", holdings:linked};
  }
  const value=Math.round(Number(a.manualValue)*100)/100;
  return {mode:"manual", invested, accountInvested:invested, value, pl:Math.round((value-invested)*100)/100, estimated:false, source:"manual", holdings:linked};
}
function investmentTotals(owner){
  const claims=dematClaims();
  const skip=new Set();
  let dematValue=0, dematCost=0, holdValue=0, holdCost=0;
  for(const a of (S.accounts||[])){
    if(a.archived||a.type!=="demat") continue;
    if(owner && (a.owner||"Me")!==owner) continue;
    const p=dematPosition(a, claims);
    if(p.source==="holdings" || p.source==="external-holdings"){
      // Holdings carry the value. The account lump is not added again.
    } else {
      dematValue+=toDisplay(p.value, a.cur);
      dematCost+=toDisplay(p.invested, a.cur);
      for(const h of (p.holdings||[])) skip.add(h.id);
    }
  }
  for(const h of (S.holdings||[])){
    if(owner && (h.owner||"Me")!==owner) continue;
    if(skip.has(h.id)) continue;
    const p=holdPos(h);
    holdValue+=toDisplay(p.v, h.cur);
    holdCost+=toDisplay(p.c, h.cur);
  }
  return {dematValue, dematCost, holdValue, holdCost, skip, value:dematValue+holdValue, cost:dematCost+holdCost};
}
function giveTakeOwner(t){
  if(t&&t.owner) return t.owner;
  const id=t&&t.postings&&t.postings[0]&&t.postings[0].acct;
  const a=id&&acct(id);
  return (a&&a.owner)||"Me";
}
function giveTakeWealth(owner){
  // Net each person first. A settlement cancels its source, so a closed
  // exchange is neither an asset nor a liability. Cash is already in the account.
  const nets=new Map();
  for(const t of (S.txns||[])){
    if(t.status!=="posted"||!t.giveTake) continue;
    if(owner && giveTakeOwner(t)!==owner) continue;
    const key=t.contactId||normalizeContactName(t.person)||t.id;
    nets.set(key,(nets.get(key)||0)+giveTakeTxnValue(t));
  }
  let inn=0, out=0;
  for(const v of nets.values()){
    const r=Math.round(v*100)/100;
    if(r>0.005) inn+=r;
    else if(r<-0.005) out+=-r;
  }
  return {in:Math.round(inn*100)/100, out:Math.round(out*100)/100};
}
function wealthBreakdown(owner){
  let cash=0, bank=0, cardLiab=0, cardAsset=0, overdraft=0, forex=0;
  for(const a of S.accounts){
    if(a.archived||(owner&&(a.owner||"Me")!==owner)) continue;
    if(a.type==="demat") continue;
    if(a.type==="forex"){
      forex+=forexDisplayValue(a).value;
      continue;
    }
    const b=toDisplay(balance(a),a.cur);
    if(a.type==="cash"){ if(b>=0) cash+=b; else overdraft+=-b; }
    else if(a.type==="bank"){ if(b>=0) bank+=b; else overdraft+=-b; }
    else if(a.type==="card"){ if(b<0) cardLiab+=-b; else cardAsset+=b; }
    else { if(b>=0) bank+=b; else overdraft+=-b; }
  }
  const inv=investmentTotals(owner);
  const holdings=inv.holdValue;
  const dematValue=inv.dematValue;
  let iouIn=0, iouOut=0;
  for(const v of Object.values(personPos(owner))){ if(v>=0) iouIn+=v; else iouOut+=-v; }
  const gt=giveTakeWealth(owner);
  iouIn+=gt.in; iouOut+=gt.out;
  const loans=loansReceivable(owner);
  const ins=insuranceValues(owner);
  const liquid=cash+bank+cardAsset+forex;
  const invested=holdings+dematValue+ins.cashValue;
  const owedToYou=loans.receivable+iouIn;
  const youOwe=cardLiab+overdraft+loans.payable+iouOut;
  const assets=liquid+invested+owedToYou;
  const liabilities=youOwe;
  return {
    cash, bank, forex, demat:dematValue, holdings, invested, liquid,
    dematCost:inv.dematCost, holdCost:inv.holdCost,
    cardLiab, cardAsset, overdraft,
    loansReceivable:loans.receivable, loansPayable:loans.payable,
    loanPrincipal:loans.principalRecv, loanInterest:loans.interestRecv,
    iouIn, iouOut, owedToYou, youOwe,
    insuranceCoverage:ins.coverage, insuranceCash:ins.cashValue,
    assets, liabilities, total:assets-liabilities
  };
}
function valuationNotes(owner){
  let missing=0, undated=0, old=0, insUndated=0, insOld=0;
  const cutoff=addDays(today(), -45);
  for(const h of (S.holdings||[])){
    if(owner && (h.owner||"Me")!==owner) continue;
    const pos=holdPos(h);
    if(!(pos.u>0)) continue;
    if(!(Number(h.price)>0)) missing++;
    else if(!h.priceAsOf) undated++;
    else if(h.priceAsOf<cutoff) old++;
  }
  for(const p of (S.policies||[])){
    if(owner && (p.owner||"Me")!==owner) continue;
    const fv=Number(p.fundValue!=null?p.fundValue:(p.surrenderValue!=null?p.surrenderValue:0))||0;
    if(!(fv>0)) continue;
    if(!p.fundAsOf) insUndated++;
    else if(p.fundAsOf<cutoff) insOld++;
  }
  return {missing, undated, old, insUndated, insOld};
}
function valuationNoteHtml(owner){

  if(n.undated) bits.push(n.undated+" investment price"+(n.undated===1?"":"s")+" with no recorded date");
  if(n.insOld) bits.push(n.insOld+" insurance value"+(n.insOld===1?"":"s")+" older than 45 days");

function forexGapNote(owner){
