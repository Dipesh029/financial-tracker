<style>
/* Theme tokens: light is the default on :root.
   Dark applies only via html[data-theme="dark"] or system+OS dark.
   Never put prefers-color-scheme on bare :root — that broke Light when the phone was in dark mode. */
:root, html[data-theme="light"]{
  color-scheme: light;
  --bg:#f4f5f7;
  --bg-2:#eef0f3;
  --card:#ffffff;
  --elev:#ffffff;
  --ink:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#2563eb;
  --accent-soft:rgba(37,99,235,.10);
  --accent-ink:#ffffff;
  --in:#047857;
  --out:#b91c1c;
  --warn:#b45309;
  --nav:#ffffff;
  --overlay:rgba(15,23,42,.45);
  --input:#ffffff;
  --radius:14px;
  --shadow:0 1px 2px rgba(17,24,39,.04), 0 4px 14px rgba(17,24,39,.05);
  --ease:cubic-bezier(.22,1,.36,1);
  --hero-from:#2563eb;
  --hero-to:#1e40af;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121212;
  --bg-2:#1a1a1a;
  --card:#1c1c1e;
  --elev:#2c2c2e;
  --ink:#f3f4f6;
  --muted:#9ca3af;
  --line:#2e2e32;
  --accent:#60a5fa;
  --accent-soft:rgba(96,165,250,.14);
  --accent-ink:#0b1220;
  --in:#34d399;
  --out:#f87171;
  --warn:#fbbf24;
  --nav:#1c1c1e;
  --overlay:rgba(0,0,0,.55);
  --input:#2c2c2e;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --hero-from:#2a2a2e;
  --hero-to:#1a1a1c;
}
@media (prefers-color-scheme: dark){
  html[data-theme="system"], html:not([data-theme]){
    color-scheme: dark;
    --bg:#121212;
    --bg-2:#1a1a1a;
    --card:#1c1c1e;
    --elev:#2c2c2e;
    --ink:#f3f4f6;
    --muted:#9ca3af;
    --line:#2e2e32;
    --accent:#60a5fa;
    --accent-soft:rgba(96,165,250,.14);
    --accent-ink:#0b1220;
    --in:#34d399;
    --out:#f87171;
    --warn:#fbbf24;
    --nav:#1c1c1e;
    --overlay:rgba(0,0,0,.55);
    --input:#2c2c2e;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --hero-from:#2a2a2e;
    --hero-to:#1a1a1c;
  }
}
@media (prefers-color-scheme: light){
  html[data-theme="system"], html:not([data-theme]){
    color-scheme: light;
    --bg:#f4f5f7;
    --bg-2:#eef0f3;
    --card:#ffffff;
    --elev:#ffffff;
    --ink:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#2563eb;
    --accent-soft:rgba(37,99,235,.10);
    --accent-ink:#ffffff;
    --in:#047857;
    --out:#b91c1c;
    --warn:#b45309;
    --nav:#ffffff;
    --overlay:rgba(15,23,42,.45);
    --input:#ffffff;
    --shadow:0 1px 2px rgba(17,24,39,.04), 0 4px 14px rgba(17,24,39,.05);
    --hero-from:#2563eb;
    --hero-to:#1e40af;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:14px 16px 20px}
h1{font-size:13px;font-weight:600;color:var(--muted);margin:4px 0 2px;letter-spacing:.02em}
h2{font-size:15px;font-weight:650;margin:20px 0 8px;letter-spacing:-.01em}
.big{font-size:36px;font-weight:720;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px;margin:8px 0;box-shadow:var(--shadow)}
.card.tap{cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.card.tap:active{transform:scale(.985)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row+.row{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.muted{color:var(--muted);font-size:13px}
.in{color:var(--in)} .out{color:var(--out)} .warn{color:var(--warn)}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 2px;font-size:12px;border-radius:9px;font:inherit;font-weight:650;transition:background .15s var(--ease),color .15s var(--ease)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
body.locked #nav,body.locked nav{display:none!important;pointer-events:none!important;height:0!important;overflow:hidden!important;border:0!important;padding:0!important}
body.locked #app{padding-bottom:24px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);

nav button.on{color:var(--accent)}
nav .add{flex:0 0 56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  font-size:30px;line-height:1;margin-top:-28px;box-shadow:0 6px 18px rgba(47,79,216,.35);font-weight:400;
  transition:transform .15s var(--ease)}
nav .add:active{transform:scale(.94)}
.sheet-bg{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:20;

.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;

.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:99px;background:var(--line);margin:2px auto 12px}
@keyframes sheetUp{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .sheet,.sheet-bg,.card.tap,nav .add,.seg button,.btn,.chip{animation:none!important;transition:none!important}
}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px;letter-spacing:.01em}
input,select,textarea{background:var(--input);color:var(--ink);width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}

.amt{font-size:40px;font-weight:720;text-align:center;padding:16px 12px;letter-spacing:-.02em;border-radius:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:active{transform:scale(.97)}
.amt-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 4px}
.amt-chips .chip{padding:7px 12px;font-size:12px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);margin-top:14px;
  transition:transform .12s var(--ease),opacity .12s var(--ease);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn:active{transform:scale(.985);opacity:.92}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line);margin-top:10px;box-shadow:none}
.btn.danger{background:var(--bg);color:var(--out);border:1px solid var(--line);box-shadow:none}
.btn.small{font-size:13px;padding:8px 12px;width:auto;margin:0;border-radius:10px;box-shadow:none}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .empty-title{font-size:17px;font-weight:650;color:var(--ink);margin-bottom:6px}
.empty p{margin:0 0 14px;font-size:14px;line-height:1.5}
.toast{background:var(--elev);color:var(--ink);border:1px solid var(--line);position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:30;display:flex;gap:14px;align-items:center;
  box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fadeIn .2s var(--ease);max-width:min(92vw,420px)}
.toast button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;filter:brightness(1.35)}
.void{opacity:.5;text-decoration:line-through}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s var(--ease)}
.bar.warn i{background:var(--warn)}
.bar.out i{background:var(--out)}
.bar.in i{background:var(--in)}
.hero{padding:6px 2px 4px}
.hero .big{margin:4px 0}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow)}
.metric span{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.metric b{font-size:17px;font-weight:700}
.quick-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 4px}
.quick-grid button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 8px;font:inherit;font-size:13px;font-weight:650;box-shadow:var(--shadow)}
.quick-grid button:active{transform:scale(.97)}
.chart{width:100%;height:auto;display:block}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.home-filter{margin:4px 0 10px}
.home-filter select{padding:10px 12px}
.security-note{font-size:12px;color:var(--muted);line-height:1.5}
.due-pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}

.limit-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}

.wealth-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}

#app{max-width:430px;margin:0 auto}
nav{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}

const BACKUP_DB="myfinance.backup-destination", BACKUP_STORE="handles", BACKUP_HANDLE_KEY="directory";
function backupDb(){return new Promise((resolve,reject)=>{if(!("indexedDB" in window))return reject(new Error("IndexedDB unavailable"));const req=indexedDB.open(BACKUP_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(BACKUP_STORE))req.result.createObjectStore(BACKUP_STORE);};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error("Backup settings storage unavailable"));});}
async function backupHandleGet(){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readonly"),req=tx.objectStore(BACKUP_STORE).get(BACKUP_HANDLE_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();});}
async function backupHandleSet(handle){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readwrite");tx.objectStore(BACKUP_STORE).put(handle,BACKUP_HANDLE_KEY);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};tx.onabort=()=>{db.close();reject(tx.error);};});}
async function backupHandleForget(){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readwrite");tx.objectStore(BACKUP_STORE).delete(BACKUP_HANDLE_KEY);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};});}
async function backupPermission(handle,request=false){if(!handle)return "missing";try{if(!handle.queryPermission)return "unsupported";let p=await handle.queryPermission({mode:"readwrite"});if(p!=="granted"&&request&&handle.requestPermission)p=await handle.requestPermission({mode:"readwrite"});return p;}catch(e){return "denied";}}
async function backupDestinationStatus(){

    return;

    else if(p==="prompt") node.textContent="Selected: "+name+" · Will ask permission on next save";

function b64(u){let t=""; for(const x of new Uint8Array(u)) t+=String.fromCharCode(x); return btoa(t);}

function policyScheduleDates(p){
  // All premium due dates from commencement through PPT end (inclusive of final), by frequency months
  const out=[];
  if(!p||!p.start||!(Number(p.premium)>0)) return out;
  const freq=Math.max(1, Number(p.freq)||1);
  const end=policyPptEnd(p);
  let d=p.start;
  const guard=800;
  for(let i=0;i<guard;i++){
    if(end && d>end) break;
    out.push(d);
    const next=addM(d, freq);
    if(end && next>end){
      // include final only if last date is exactly end or we haven't landed on end
      if(d!==end && end>=d){ /* final may equal last pushed */ }
      break;
    }
    d=next;
    if(!d) break;
  }
  // Ensure PPT end is included as last due when it falls on schedule
  if(end && out.length && out[out.length-1]!==end){
    // if end is on the same day-of-month cadence after last, append end as final due
    const last=out[out.length-1];
    if(end>last) out.push(end);
  }
  return out;
}
function policyPremiumsPaidToDate(p){
  const premium=Number(p.premium)||0;
  const freq=Math.max(1, Number(p.freq)||1);
  const schedule=policyScheduleDates(p);
  const expectedCount=schedule.length;
  const expectedTotal=expectedCount*premium;
  const paidThrough=(p.paidThrough||"").trim(); // user-confirmed historical paid-through date
  const recorded=(p.payments||[]).filter(x=>x&&x.date).slice().sort((a,b)=>a.date.localeCompare(b.date));
  // Mark schedule dates as paid if: date <= paidThrough, or a recorded payment covers that instalment month
  const covered=new Set();
  for(const d of schedule){
    if(paidThrough && d<=paidThrough) covered.add(d);
  }
  // Match recorded payments to nearest unpaid schedule date on/before payment date or same month
  let recordedSum=0, recordedCount=0;
  for(const pay of recorded){
    const amt=Number(pay.amount)||premium;
    recordedSum+=amt;
    recordedCount++;
    let matched=null;
    for(const d of schedule){
      if(covered.has(d)) continue;
      if(d<=pay.date) matched=d;
      else break;
    }
    if(matched) covered.add(matched);
  }
  const assumedCount=[...covered].filter(d=>paidThrough && d<=paidThrough && !recorded.some(r=>r.date>=d && r.date<=addM(d,freq))).length;
  // Simpler assumed: dates covered only via paidThrough
  let histCount=0;
  if(paidThrough){
    for(const d of schedule){ if(d<=paidThrough) histCount++; }
  }
  // Total paid count = unique covered schedule dates
  const paidCount=covered.size;
  // Amount: hist portion at premium rate + recorded amounts, but avoid double: use max(paidCount*premium, recordedSum) carefully
  // Prefer: assumed = histCount * premium (if no overlapping recorded before paidThrough)
  // recorded after paidThrough add their amounts
  let histAmount=0;
  if(paidThrough){
    const histDates=schedule.filter(d=>d<=paidThrough);
    histAmount=histDates.length*premium;
    // recorded payments on or before paidThrough are assumed already in histAmount — don't add again
  }
  const laterRecorded=recorded.filter(r=>!paidThrough||r.date>paidThrough);
  const laterAmount=laterRecorded.reduce((s,x)=>s+(Number(x.amount)||premium),0);
  const laterCount=laterRecorded.length;
  // If no paidThrough, use covered size * premium or recorded sum if higher fidelity
  let total, count, source;
  if(paidThrough){
    total=histAmount+laterAmount;
    count=histCount+laterCount;
    // if recorded matched more after, covered may exceed
    count=Math.max(count, paidCount);
    total=Math.max(total, paidCount*premium*0+histAmount+laterAmount);
    source="mixed";
  } else if(recorded.length){
    total=recordedSum;
    count=recordedCount;
    source="recorded";
  } else {
    // schedule assumption: all due on or before today (and within PPT) that are before next unpaid
    const next=policyNextUnpaidDue(p);
    const paidDates=schedule.filter(d=>d<today() && (!next || d<next));
    // if next is in the past (overdue), those overdue are NOT paid
    count=schedule.filter(d=>d<today() && !(next && d>=next)).length;
    if(next && next<today()){
      count=schedule.filter(d=>d<next).length;
    } else if(!next && p.finalPremiumPaid){
      count=schedule.length;
    } else if(!next){
      // no next stored — assume paid through last schedule date <= today if still in PPT?
      count=schedule.filter(d=>d<=today()).length;
    }
    total=count*premium;
    source="schedule";
  }
  const remainingCount=Math.max(0, expectedCount-count);
  const remaining=remainingCount*premium;
  return {
    total, count, source,
    histCount: paidThrough?histCount:0,
    histAmount: paidThrough?histAmount:0,
    recordedCount: recorded.length,
    recordedSum: recorded.reduce((s,x)=>s+(Number(x.amount)||premium),0),
    expected: expectedTotal,
    expectedCount,
    remaining,
    remainingCount,
    paidThrough: paidThrough||""
  };
}
function policyNextUnpaidDue(p){
  // Consistent next unpaid instalment from schedule + paidThrough + payments + finalPremiumPaid
  if(!p) return "";
  if(p.finalPremiumPaid) return "";
  if(!policyPremiumActive(p)) return "";
  const schedule=policyScheduleDates(p);
  if(!schedule.length){
    const n=(p.next||"").trim();
    return n||"";
  }
  const paidThrough=(p.paidThrough||"").trim();
  const paidDates=new Set();
  if(paidThrough){
    for(const d of schedule) if(d<=paidThrough) paidDates.add(d);
  }
  for(const pay of (p.payments||[])){
    if(!pay||!pay.date) continue;
    // mark latest unpaid schedule date on or before payment
    let matched=null;
    for(const d of schedule){
      if(paidDates.has(d)) continue;
      if(d<=pay.date) matched=d;
      else break;
    }
    if(matched) paidDates.add(matched);
  }
  for(const d of schedule){
    if(!paidDates.has(d)) return d;
  }
  return ""; // all scheduled premiums paid
}
function policyHasOpenPremium(p){
  if(!policyPremiumActive(p)) return false;
  if(p.finalPremiumPaid) return false;
  const next=policyNextUnpaidDue(p);
  if(!next) return false;
  const end=policyPptEnd(p);
  if(end && next>end) return false;
  return true;
}
function policyPayableDate(p){

function policyEffectiveNext(p){
  // Prefer computed next unpaid; fall back to stored p.next for display migration
  const computed=policyNextUnpaidDue(p);
  if(computed) return computed;
  const stored=(p.next||"").trim();
  if(stored && !p.finalPremiumPaid){
    const end=policyPptEnd(p);
    if(end && stored>end) return "";
    return stored;
  }
  return "";
}
function policyFullyPaidTerm(p){
  if(p.finalPremiumPaid) return true;

function policyPptEnd(p){
  if(!p||!p.start||!(Number(p.ppt)>0)) return "";

  return addM(p.start, Math.round(Number(p.ppt)*12));
}

function policyPremiumActive(p){

}

function migrateContactsFromBank(){

    const exists=c.methods.some(m=>{
      const mn=(m.accountNumber||m.upi||"").replace(/\s/g,"");
      return (meth.id&&m.id===meth.id) || (num&&mn&&num===mn) || (meth.upi&&m.upi&&meth.upi===m.upi);

  }
  for(const l of (S.lending||[])) if(l.person) ensureContactByName(l.person);
  for(const c of S.contacts){
    for(const m of (c.methods||[])){
      if(!m.id) m.id=uid();
      const hit=S.bankContacts.find(b=>b.id===m.id || (((b.accountNumber||b.upi||"")&&(b.accountNumber||b.upi)===(m.accountNumber||m.upi))&&((b.person||"").toLowerCase()===(c.name||"").toLowerCase())));
      if(!hit){
        S.bankContacts.push({id:m.id,person:c.name,holder:m.holder||c.name,bank:m.bank||"",accountNumber:m.accountNumber||"",accountMasked:m.accountMasked||"",ifsc:m.ifsc||"",branch:m.branch||"",branchCode:m.branchCode||"",cur:m.cur||"INR",upi:m.upi||"",_migrated:true});
      }else{ hit.person=hit.person||c.name; hit._migrated=true; }
    }
  }
  const by={};
  for(const c of S.contacts){
    const k=(c.name||"").trim().toLowerCase(); if(!k) continue;
    if(!by[k]) by[k]={...c, methods:(c.methods||[]).slice()};

        if(!exists) by[k].methods.push(m);
      }
    }
  }

}

function balance(a){
  let b = a.opening || 0;
  for(const t of S.txns){ if(t.status!=="posted") continue; for(const p of t.postings) if(p.acct===a.id) b += p.amt; }
  return Math.round(b*100)/100;
}
function holdPos(h){let u=0,c=0;for(const t of S.txns){if(t.status!=="posted"||t.hold!==h.id)continue;if(t.type==="buy"||t.type==="open"||t.type==="adjust"){u+=t.units;c+=t.cost;}else if(t.type==="sell"){const f=u?Math.min(1,t.units/u):0;c-=c*f;u-=t.units;}}return{u:Math.round(u*1e6)/1e6,c:Math.round(c*100)/100,v:Math.round(u*(h.price||0)*100)/100};}
function personPos(owner){
  // Informal IOUs from transfers only. Lending module uses loansReceivable/lendingPosition —
  // never mix loanId/lendingId/principalReduction/interestSettlement or lend/borrow types here
  // (that created phantom liabilities when repayments set negative pd).
  const m={};
  for(const t of S.txns){
    if(t.status!=="posted"||!t.person||!t.pd||!t.postings?.[0]) continue;
    if(owner&&t.owner&&t.owner!==owner) continue;
    if(t.loanId||t.lendingId||t.principalReduction||t.interestSettlement) continue;
    if(["lend","borrow","lendback","repay"].includes(t.type)) continue;
    m[t.person]=(m[t.person]||0)+toDisplayAt(t.pd,t.postings[0].cur,t.fxRate);
  }
  return m;
}
function monthKey(d){ return d.slice(0,7); }
function monthTotals(m,owner){
  let inc=0, exp=0;
  for(const t of S.txns){
    if(t.status!=="posted" || monthKey(t.date)!==m || (owner&&t.owner!==owner)) continue;
    if(t.type==="income") inc += toDisplayAt(t.postings[0].amt, t.postings[0].cur,t.fxRate);
    if(t.type==="expense") exp += toDisplayAt(-t.postings[0].amt, t.postings[0].cur,t.fxRate);
    if(t.type==="refund") exp -= toDisplayAt(t.postings[0].amt, t.postings[0].cur,t.fxRate);

function processDueAutomations(){
  if(!S) return {sips:0, salaries:0, skipped:0};
  let sips=0, salaries=0, skipped=0;
  const MAX_EACH=6;
  if(S.autoSip!==false){
    for(const x of S.sips){
      if((x.status||"active")==="stopped") continue;
      let guard=0;
      while(x.next && daysTo(x.next)<=0 && guard++<MAX_EACH){
        const a=acct(x.acct);
        if(!a||a.archived){ skipped++; x.next=addM(x.next,x.freq||1); continue; }
        const h=S.holdings.find(v=>v.id===x.hold)||{};
        const price=h.price>0?h.price:0;
        const units=price>0?Math.round((x.amt/price)*1e6)/1e6:0;
        const payDate=x.next;
        const n=S.txns.length;
        addTxn({type:"buy",date:payDate,note:price?"SIP (auto)":"SIP (auto · set price for units)",hold:x.hold,units,cost:x.amt,sip:x.id,postings:[{acct:x.acct,amt:-x.amt,cur:x.cur}]},{skipSave:true});
        if(S.txns.length===n){ x.next=addM(x.next,x.freq||1); continue; }
        x.history=x.history||[]; x.history.push({date:payDate,status:"paid",units,amount:x.amt,auto:true});
        x.next=addM(x.next,x.freq||1); sips++;
      }
    }
  }
  if(S.autoSalary!==false){
    for(const x of (S.salaries||[])){
      if((x.status||"active")==="stopped") continue;
      let guard=0;
      while(x.next && daysTo(x.next)<=0 && guard++<MAX_EACH){
        const a=acct(x.acct);
        if(!a||a.archived){ skipped++; x.next=addM(x.next,x.freq||1); continue; }
        const payDate=x.next;
        const n=S.txns.length;
        addTxn({type:"income",date:payDate,note:x.label||"Salary (auto)",cat:"Salary",person:x.person||"",owner:x.person||a.owner||"Me",salaryId:x.id,postings:[{acct:x.acct,amt:x.amt,cur:x.cur}]},{skipSave:true});
        if(S.txns.length===n){ x.next=addM(x.next,x.freq||1); continue; }
        x.history=x.history||[]; x.history.push({date:payDate,status:"received",amount:x.amt,auto:true});
        x.next=advanceSalaryNext(x, payDate); salaries++;
      }
    }
  }
  if(sips||salaries) save();
  return {sips, salaries, skipped};
}

function wireSortableLists(){

    const root=document.querySelector("#content")||document.querySelector("#app")||document.body;
    enableListSort(root, "[data-acct].card, [data-acct].rec-card", ids=>{ applySortOrder(S.accounts, ids); save(); });

    enableListSort(root, "[data-lend].card, [data-lend].rec-card, [data-lend]", ids=>{ applySortOrder(S.lending, ids); save(); });
  }catch(e){}
}
function enableListSort(rootSel, itemSel, onReorder){
  // Long-press (400ms) then drag to reorder; saves via onReorder(ids)
  const root=typeof rootSel==="string"?document.querySelector(rootSel):rootSel;
  if(!root) return;
  let dragEl=null, startY=0, armed=false, timer=null;
  root.querySelectorAll(itemSel).forEach(el=>{
    if(el.dataset.sortBound) return;
    el.dataset.sortBound="1";
    const clear=()=>{ if(timer){ clearTimeout(timer); timer=null; } armed=false; };
    el.addEventListener("pointerdown", e=>{
      if(e.button&&e.button!==0) return;
      startY=e.clientY; armed=false;
      timer=setTimeout(()=>{ armed=true; dragEl=el; el.classList.add("dragging"); try{ el.setPointerCapture(e.pointerId); }catch(err){} }, 420);
    });
    el.addEventListener("pointermove", e=>{
      if(!timer&&!armed) return;
      if(!armed && Math.abs(e.clientY-startY)>12){ clear(); return; }
      if(!armed||!dragEl) return;
      e.preventDefault();
      const y=e.clientY;
      const siblings=[...root.querySelectorAll(itemSel)].filter(x=>x!==dragEl);
      let placed=false;
      for(const s of siblings){
        const r=s.getBoundingClientRect();
        if(y < r.top+r.height/2){ root.insertBefore(dragEl, s); placed=true; break; }
      }
      if(!placed) root.appendChild(dragEl);
    });
    el.addEventListener("pointerup", ()=>{
      clear();
      if(dragEl){
        dragEl.classList.remove("dragging");
        const ids=[...root.querySelectorAll(itemSel)].map(x=>x.getAttribute("data-acct")||x.getAttribute("data-hold")||x.getAttribute("data-contact")||x.getAttribute("data-sip")||x.id).filter(Boolean);
        if(onReorder) onReorder(ids);
        dragEl=null;
      }
    });
    el.addEventListener("pointercancel", ()=>{ clear(); if(dragEl){ dragEl.classList.remove("dragging"); dragEl=null; } });
  });
}
(function bootSort(){
  const start=()=>{ try{
    const obs=new MutationObserver(()=>{ clearTimeout(window.__sortT); window.__sortT=setTimeout(wireSortableLists, 80); });
    obs.observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){} };
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
function sortedList(arr, key){
  // Stable display order using optional .sortOrder (number). Unset items keep relative order at end of numbered ones.
  if(!arr||!arr.length) return arr||[];
  return arr.slice().sort((a,b)=>{
    const ao=a.sortOrder, bo=b.sortOrder;
    if(ao!=null&&bo!=null&&ao!==bo) return ao-bo;
    if(ao!=null&&bo==null) return -1;
    if(ao==null&&bo!=null) return 1;
    return 0;
  });
}
function applySortOrder(arr, orderedIds){
  if(!arr||!orderedIds) return;
  orderedIds.forEach((id,i)=>{ const x=arr.find(y=>y.id===id); if(x) x.sortOrder=i; });
}

  };

function loansReceivable(owner){
  let receivable=0, payable=0, principalRecv=0, interestRecv=0;
  const prefs=getNwPrefs();
  for(const l of (S.lending||[])){
    const a=acct(l.account);
    if(owner && a && a.owner && a.owner!==owner) continue;
    if(owner && !a && owner!=="Me") continue;
    const p=lendingPosition(l);
    const prin=toDisplay(p.principalLeft, l.cur);
    const intL=toDisplay(p.interestLeft, l.cur);
    if(l.direction==="lent"){
      if(!prefs.loansReceivable) continue;
      receivable+=prin;
      principalRecv+=prin;
      if(prefs.accruedInterest){ receivable+=intL; interestRecv+=intL; }
    } else {
      payable+=prin;
      if(prefs.accruedInterest) payable+=intL;
    }
  }
  return {receivable, payable, principalRecv, interestRecv};
}

function insuranceValues(owner){
  const prefs=getNwPrefs();
  let coverage=0, cashValue=0;
  for(const p of (S.policies||[])){
    if(owner && (p.owner||"Me")!==owner) continue;
    const cur=p.cur||S.display||"INR";
    coverage+=toDisplay(Number(p.sum)||0, cur);
    const fv=Number(p.fundValue!=null?p.fundValue:(p.surrenderValue!=null?p.surrenderValue:0))||0;
    if(fv>0 && prefs.insuranceCash) cashValue+=toDisplay(fv, cur);
  }
  return {coverage, cashValue, coverageForAdjusted: prefs.insuranceCoverage?coverage:0};
}

function wealthBreakdown(owner){
  let cash=0,bank=0,dematCash=0,cardLiab=0,holdings=0;
  for(const a of S.accounts){
    if(a.archived||(owner&&a.owner!==owner))continue;
    const b=toDisplay(balance(a),a.cur);
    if(a.type==="cash") cash+=Math.max(0,b);
    else if(a.type==="bank") bank+=Math.max(0,b);
    else if(a.type==="demat") dematCash+=Math.max(0,b); // cash/settlement balance in demat — not holdings
    else if(a.type==="card"&&b<0) cardLiab+=-b;
  }
  for(const h of S.holdings){ if(!(owner&&h.owner!==owner)) holdings+=toDisplay(holdPos(h).v,h.cur); }
  const loans=loansReceivable(owner);
  const ins=insuranceValues(owner);
  // Investments subset: demat cash + security holdings + insurance cash/fund values (once)
  const invested=dematCash+holdings+ins.cashValue;
  return {
    cash, bank, demat:dematCash, holdings, invested,
    cardLiab, loansReceivable:loans.receivable, loansPayable:loans.payable,
    loanPrincipal:loans.principalRecv, loanInterest:loans.interestRecv,
    insuranceCoverage:ins.coverage, insuranceCash:ins.cashValue
  };
}
function personalAssetsValue(owner){

  return 0;
}

function netWorthBreakdown(owner){
  const parts={accounts:0,accountLiab:0,holdings:0,personAssets:0,personLiab:0,loansRecv:0,loansPay:0,insCash:0};
  for(const a of S.accounts){
    if(a.archived||(owner&&a.owner!==owner)) continue;
    const b=toDisplay(balance(a),a.cur);
    if(b>=0) parts.accounts+=b; else parts.accountLiab+=-b;
  }
  for(const h of S.holdings){ if(!(owner&&h.owner!==owner)) parts.holdings+=toDisplay(holdPos(h).v,h.cur); }
  for(const v of Object.values(personPos(owner))){ if(v>=0) parts.personAssets+=v; else parts.personLiab+=-v; }
  const loans=loansReceivable(owner);
  parts.loansRecv=loans.receivable; parts.loansPay=loans.payable;
  parts.insCash=insuranceValues(owner).cashValue;
  parts.assets=parts.accounts+parts.holdings+parts.personAssets+parts.loansRecv+parts.insCash;
  parts.liabilities=parts.accountLiab+parts.personLiab+parts.loansPay;
  parts.total=parts.assets-parts.liabilities;
  return parts;
}
function netWorth(owner){
  let assets=0, owed=0;
  for(const a of S.accounts){
    if(a.archived||(owner&&a.owner!==owner)) continue;
    const b=toDisplay(balance(a),a.cur);
    if(b>=0) assets+=b; else owed+=-b;
  }
  // Security holdings (stocks/funds) — not included in account balances
  for(const h of S.holdings){
    if(owner&&h.owner!==owner) continue;
    assets+=toDisplay(holdPos(h).v,h.cur);
  }
  // Legacy person balances from marked transfers (pd)
  for(const v of Object.values(personPos(owner))){
    if(v>=0) assets+=v; else owed+=-v;
  }
  const loans=loansReceivable(owner);
  assets+=loans.receivable;
  owed+=loans.payable;
  // Insurance: cash/fund/surrender only — never sum assured
  const ins=insuranceValues(owner);
  assets+=ins.cashValue;
  assets+=personalAssetsValue(owner);
  const actual=assets-owed;
  const adjusted=actual+(ins.coverageForAdjusted||0);
  return {
    assets, owed, total:actual, actual,
    adjusted, adjustedNetWorth:adjusted,
    loansReceivable:loans.receivable, loansPayable:loans.payable,
    insuranceCoverage:ins.coverage, insuranceCash:ins.cashValue,
    coverageInAdjusted:!!getNwPrefs().insuranceCoverage

function formatExpiryInput(raw){
  const digits=String(raw||"").replace(/\D/g,"").slice(0,4);
  if(digits.length<=2) return digits;
  return digits.slice(0,2)+"/"+digits.slice(2);
}
function parseExpiryParts(s){
  const n=formatExpiryInput(s);
  const m=/^(0[1-9]|1[0-2])\/(\d{2})$/.exec(n);
  return m?{mm:m[1],yy:m[2]}:null;
}
function isExpiryValid(s,opts){
  opts=opts||{};
  const p=parseExpiryParts(s); if(!p) return false;
  if(opts.allowPast) return true;
  const now=new Date(), cy=now.getFullYear()%100, cm=now.getMonth()+1;
  const y=+p.yy, mo=+p.mm;
  if(y>cy) return true; if(y<cy) return false; return mo>=cm;
}
function expiryPickerHtml(idPrefix, initial){
  const p=parseExpiryParts(initial||"")||{};
  const mm=p.mm||"";
  let yy=p.yy||"";
  // Prefer YY for storage display
  if(yy.length===4) yy=yy.slice(-2);
  return '<label>Card expiry</label>'+
    '<input type="hidden" id="'+idPrefix+'" value="'+esc(mm&&yy?(mm+"/"+yy):"")+'">'+
    '<div class="expiry-row">'+
    '<div><label class="sub">Month (MM)</label>'+
    '<input id="'+idPrefix+'_mm" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="MM" value="'+esc(mm)+'" autocomplete="cc-exp-month" aria-label="Expiry month"></div>'+
    '<div><label class="sub">Year (YY)</label>'+
    '<input id="'+idPrefix+'_yy" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="YY" value="'+esc(yy)+'" autocomplete="cc-exp-year" aria-label="Expiry year"></div>'+
    '</div>'+
    '<div class="muted">Example: 08 and 29 for August 2029. Stored as MM/YY.</div>';
}
function wireExpiryField(idPrefix){
  const hidden=document.getElementById(idPrefix);
  const mm=document.getElementById(idPrefix+"_mm");
  const yy=document.getElementById(idPrefix+"_yy");
  if(!hidden||!mm||!yy) return;
  const apply=function(){
    let m=(mm.value||"").replace(/\D/g,"").slice(0,2);
    let y=(yy.value||"").replace(/\D/g,"").slice(0,4);
    if(m.length===1) m="0"+m;
    if(y.length===4) y=y.slice(-2);
    if(mm.value!==m && m) mm.value=m;
    if(y.length===2 && yy.value!==y && (yy.value||"").replace(/\D/g,"").length>=2) yy.value=y;
    if(m.length===2 && y.length===2) hidden.value=m+"/"+y;
    else if(m||y) hidden.value="";
    else hidden.value="";
  };
  mm.addEventListener("input", function(){
    mm.value=(mm.value||"").replace(/\D/g,"").slice(0,2);
    apply();
  });
  yy.addEventListener("input", function(){
    yy.value=(yy.value||"").replace(/\D/g,"").slice(0,4);
    apply();
  });
  mm.addEventListener("blur", apply);
  yy.addEventListener("blur", apply);
  apply();
}
function readExpiryField(idPrefix, opts){
  opts=opts||{};
  const hidden=document.getElementById(idPrefix);
  const mmEl=document.getElementById(idPrefix+"_mm");
  const yyEl=document.getElementById(idPrefix+"_yy");
  let m=(mmEl&&mmEl.value||"").replace(/\D/g,"").slice(0,2);
  let y=(yyEl&&yyEl.value||"").replace(/\D/g,"").slice(0,4);
  if(m.length===1) m="0"+m;
  if(y.length===4) y=y.slice(-2);
  let v="";
  if(m||y) v=(m.length===2&&y.length===2)?(m+"/"+y):"";
  if(!v && hidden) v=formatExpiryInput(hidden.value||"");
  if(!m && !y && !v) return opts.required?{ok:false,error:"Enter the card expiry month and year."}:{ok:true,value:""};
  if(m && (m.length!==2 || +m<1 || +m>12)) return {ok:false,error:"Expiry month must be 01–12."};
  if(y && y.length!==2) return {ok:false,error:"Expiry year must be 2 digits (YY) or 4 digits (YYYY)."};
  if(!m || !y) return {ok:false,error:"Enter both expiry month and year."};
  v=m+"/"+y;
  const p=parseExpiryParts(v);
  if(!p) return {ok:false,error:"Enter a valid expiry month and year."};
  if(!isExpiryValid(v,{allowPast:!!opts.allowPast})) return {ok:false,error:"This expiry is in the past."};
  if(hidden) hidden.value=v;
  return {ok:true,value:v};
}

function holdParse(text){
  if(!text||!String(text).trim()){ alert("Paste CSV data or choose a file first."); return; }
  const owner=($("#howner")&&$("#howner").value)||"Me";
  const lines=String(text).replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2){ alert("Need a header row and at least one data row."); return; }
  // Simple CSV split respecting quotes
  const split=(line)=>{
    const out=[]; let cur="", q=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){ if(q&&line[i+1]==='"'){ cur+='"'; i++; } else q=!q; }
      else if((ch===","||ch==="\t")&&!q){ out.push(cur.trim()); cur=""; }
      else cur+=ch;
    }
    out.push(cur.trim()); return out;
  };
  const headers=split(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,""));
  const col=(names)=>{ for(const n of names){ const i=headers.indexOf(n); if(i>=0) return i; } return -1; };
  const iSym=col(["symbol","sym","ticker","tradingsymbol","scrip","name","security","instrument"]);
  const iQty=col(["qty","quantity","qty.","units","holding","freefloat","availableqty"]);
  const iAvg=col(["avg","average","avgprice","averageprice","buyavg","cost","buyprice","avgcost"]);
  const iPrice=col(["price","ltp","last","lastprice","close","prevclose","nav","marketprice","cmp"]);
  const iIsin=col(["isin"]);
  const iSec=col(["sector","industry"]);
  if(iSym<0||iQty<0){ alert("Could not find Symbol and Quantity columns. Include headers like Symbol, Qty, Avg, LTP."); return; }
  const items=[];
  let failed=0;
  for(let r=1;r<lines.length;r++){
    const cells=split(lines[r]); if(!cells.length||!cells[0]) continue;
    const sym=(cells[iSym]||"").trim(); if(!sym){ failed++; continue; }
    const qty=parseFloat(String(cells[iQty]||"0").replace(/,/g,""))||0;
    const avg=iAvg>=0?parseFloat(String(cells[iAvg]||"0").replace(/,/g,""))||0:0;
    const prev=iPrice>=0?parseFloat(String(cells[iPrice]||"0").replace(/,/g,""))||0:(avg||0);
    const isin=iIsin>=0?(cells[iIsin]||"").trim():"";
    const sec=iSec>=0?(cells[iSec]||"").trim():"";
    if(!(qty>0)&&qty!==0){ failed++; continue; }
    items.push({sym, qty, avg, prev:prev||avg, isin, sec});
  }
  if(!items.length){ alert("No valid rows found ("+failed+" skipped)."); return; }
  const plan=[];
  let dup=0;
  for(const it of items){
    let H=S.holdings.find(h=>(h.owner||"Me")===(owner||"Me") && (
      (it.isin&&h.isin&&h.isin===it.isin) ||
      (h.symbol&&h.symbol.toUpperCase()===it.sym.toUpperCase()) ||
      (h.name&&h.name.toUpperCase()===it.sym.toUpperCase())
    ));
    if(H){
      const pos=holdPos(H);
      const du=Math.round((it.qty-pos.u)*1e6)/1e6;
      const newCost=Math.round(it.qty*it.avg*100)/100;
      const dc=Math.round((newCost-pos.c)*100)/100;
      if(Math.abs(du)<1e-9 && Math.abs((H.price||0)-it.prev)<0.0001){ dup++; plan.push({H,it,kind:"price"}); }
      else if(Math.abs(du)<1e-9) plan.push({H,it,kind:"price"});
      else plan.push({H,it,kind:"changed",du,dc});
    } else {
      plan.push({H:null,it,kind:"new"});
    }
  }
  pendH={owner, plan, items:items.length, failed, dup};
  openSheet(`<h2 style="margin-top:0">Review import</h2>
  <div class="muted">${items.length} rows · ${plan.filter(p=>p.kind==="new").length} new · ${plan.filter(p=>p.kind==="changed").length} qty changes · ${failed} failed</div>
  <label>As-of date</label><input type="date" id="hdate" value="${today()}">
  <label class="row" style="gap:8px;align-items:center"><input type="checkbox" id="hmiss"> Mark holdings missing from file as sold (zero units)</label>
  <div class="card" style="max-height:40vh;overflow:auto;margin:10px 0">${plan.slice(0,40).map(p=>`<div class="row"><span>${esc(p.it.sym)} · ${p.it.qty} @ ${p.it.avg}</span><b>${p.kind}</b></div>`).join("")}${plan.length>40?"<div class='muted'>…and more</div>":""}</div>
  <p class="muted">Import sets positions only — no bank debit.</p>
  <button class="btn" data-doholds>Apply import</button>
  <button class="btn alt" data-close>Cancel</button>`);
}

function addM(t,n){const[y,m,d]=t.split("-").map(Number);const x=new Date(y,m-1+n,1);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(d,last));return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function addDays(t,n){const[y,m,d]=t.split("-").map(Number);const x=new Date(y,m-1,d+n);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function advanceSalaryNext(x, fromDate){
  const base=(fromDate||x.next||today());
  const unit=x.freqUnit||"month";
  const f=Math.max(1, Number(x.freq)||1);
  if(unit==="week") return addDays(base, 7*f);
  if(unit==="day") return addDays(base, f);
  return addM(base, f);
}

const daysTo=t=>Math.round((new Date(t+"T00:00")-new Date(today()+"T00:00"))/864e5);

function lendingPosition(l){
  const principalOrig=Math.max(0, Number(l.principal)||0);
  const rate=Number(l.rate)||0;
  const start=l.start||today();
  // Principal repayments chronological
  const prinTxns=S.txns.filter(t=>t.status==="posted"&&t.loanId===l.id&&t.principalReduction)
    .map(t=>({date:t.date||start, amt:Number(t.principalReduction)||0}))
    .sort((a,b)=>a.date.localeCompare(b.date));
  let principalLeft=principalOrig;
  let principalRepaid=0;
  let cursor=start;
  let accrued=0;
  const dayMs=864e5;
  const daysBetween=(a,b)=>{
    const d0=new Date(a+"T00:00"), d1=new Date(b+"T00:00");
    return Math.max(0, Math.floor((d1-d0)/dayMs));
  };
  // Accrue on outstanding principal for each interval between events
  for(const ev of prinTxns){
    if(principalLeft>0.0000001 && rate>0){
      const d=daysBetween(cursor, ev.date);
      accrued+=principalLeft*rate/100*d/365.25;
    }
    const pay=Math.min(principalLeft, Math.max(0, ev.amt));
    principalLeft-=pay;
    principalRepaid+=pay;
    cursor=ev.date>cursor?ev.date:cursor;
  }
  // After last repayment: only continue if principal still outstanding
  if(principalLeft>0.0000001 && rate>0){
    const d=daysBetween(cursor, today());
    accrued+=principalLeft*rate/100*d/365.25;
  }
  // If principal fully repaid, cursor is last repayment date — no further accrual (above branch skipped)
  principalLeft=Math.max(0, principalLeft);
  principalRepaid=Math.min(principalOrig, Math.max(0, principalRepaid));
  const interestPaid=S.txns.filter(t=>t.status==="posted"&&t.loanId===l.id&&t.interestSettlement)
    .reduce((v,t)=>v+Math.abs(t.postings?.[0]?.amt||0),0);
  // Manual adjustments: positive = more interest owed; negative = waiver/round-down
  const adjustments=l.interestAdjustments||[];
  const interestAdj=adjustments.reduce((v,a)=>v+(Number(a.amount)||0),0);
  const interestLeft=Math.max(0, accrued+interestAdj-interestPaid);
  const totalOutstanding=principalLeft+interestLeft;
  const totalPayable=principalOrig+Math.max(0, accrued+interestAdj);
  const totalPaid=principalRepaid+interestPaid;
  const pctPrincipal=principalOrig>0?Math.min(100, Math.round(principalRepaid/principalOrig*100)):100;
  const pctTotal=totalPayable>0?Math.min(100, Math.round(totalPaid/totalPayable*100)):(totalOutstanding<=0?100:0);
  let status="Unpaid";
  if(totalOutstanding<=0.0001) status="Fully Settled";
  else if(principalLeft<=0.0001 && interestLeft>0.0001) status="Principal Repaid · Interest Pending";
  else if(principalRepaid>0.0001 || interestPaid>0.0001 || interestAdj) status="Partially Repaid";
  else status="Unpaid";
  const days=daysBetween(start, today());
  return {
    principal: principalLeft,
    principalOrig, principalLeft, principalRepaid,
    interest: interestLeft,
    interestLeft, accrued, interestPaid, interestAdj, interestAccrued: accrued,
    total: totalOutstanding, totalOutstanding, totalPayable, totalPaid,
    pctPrincipal, pctTotal, status, days, rate, adjustments
  };
}

  <button class="btn alt" data-close>Cancel</button>`);
  const nameEl=$("#lpname"), recv=$("#lrecv");
  if(nameEl&&recv){
    const filterRecv=()=>{
      const n=(nameEl.value||"").trim().toLowerCase();
      let first="";
      for(const opt of [...recv.options]){
        if(!opt.value){ opt.hidden=false; continue; }
        const c=contactById(opt.value.split("::")[0]);
        const match=!n || (c&&c.name.toLowerCase()===n);
        opt.hidden=!match;
        if(match&&!first) first=opt.value;
      }
      if(n&&first) recv.value=first;
      else if(n) recv.value="";
    };
    nameEl.addEventListener("change", filterRecv);
    nameEl.addEventListener("input", filterRecv);
  }
}

function dueHtml(){
  const r=[];
  for(const x of S.sips){
    if(x.status==="stopped") continue;
    const d=daysTo(x.next);
    if(d<=14){
      const h=S.holdings.find(v=>v.id===x.hold)||{};
      const label=d<0?"Overdue SIP":d===0?"SIP due today":"SIP";
      r.push([d, label+" · "+esc(h.name||"Fund")+(h.folio?" · Folio "+esc(h.folio):""), fmt(x.amt,x.cur), `data-sip="${x.id}"`, d<0?"warn":""]);
    }
  }
  for(const x of S.salaries){
    if(x.status==="stopped") continue;
    const d=daysTo(x.next);
    if(d<=14){
      const label=d<0?"Overdue salary":d===0?"Salary today":"Salary";
      r.push([d, label+" · "+esc(x.person||"Me"), fmt(x.amt,x.cur), `data-salary="${x.id}"`, d<0?"warn":""]);
    }
  }
  for(const p of S.policies){
    if(!policyDueForReminder(p)) continue;
    const due=policyPayableDate(p);
    if(!due) continue;
    const d=daysTo(due);
    if(d<=30) r.push([d, "Premium · "+esc(p.name), fmt(p.premium,p.cur), `data-pol="${p.id}"`, d<0?"warn":""]);
  }
  for(const a of S.accounts){
    if(a.type!=="card"||a.archived||!a.dueDay) continue;
    const b=balance(a);
    if(b>=0) continue;
    const d=daysTo(nextDue(a.dueDay));
    if(d<=14) r.push([d, "Card due · "+esc(a.name), fmt(-b,a.cur), `data-acct="${a.id}"`, d<=3?"warn":""]);
  }
  for(const p of S.purchases){
    if(!p.expiry) continue;
    const d=daysTo(p.expiry);
    if(d>=0&&d<=30) r.push([d, "Warranty · "+esc(p.item), "", "", ""]);
  }
  for(const a of S.accounts){
    if(a.archived) continue;
    const exp=(a.cardMeta||{}).expiry;
    if(!exp || !/^(0[1-9]|1[0-2])\/([0-9]{2})$/.test(exp)) continue;
    const [mm,yy]=exp.split("/");
    const end="20"+yy+"-"+mm+"-01";
    // treat as due in the expiry month (1st); show within 60 days before
    const d=daysTo(end);
    if(d>=-31 && d<=60){
      const kind=a.type==="card"?"Credit card":"Debit card";
      const last=(a.cardMeta||{}).last4?(" ••••"+a.cardMeta.last4):"";

async function unlockBiometric(){
  const rawEnv=store.get();
  if(!rawEnv) throw new Error("No vault found on this device.");
  const env=JSON.parse(rawEnv);
  if(!env?.bio) throw new Error("No biometric key is configured.");
  const bio=env.bio;

  try{
    prf=await biometricPRF(bio);
    wrap=await biometricWrapKey(prf);
    raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(bio.iv),additionalData:new TextEncoder().encode("myfinance-biometric-v1")},wrap,unb64(bio.wrapped));

  }

  try{ S=await unseal(env,CK); }
  catch(e){ S=null; CK=null; throw new Error("Vault would not decrypt with biometric key. Use passphrase, then re-enable fingerprint in More."); }

/* ---------- integrity check ---------- */
function runCheck(){
  const issues=[]; const ids=new Set();
  // Reconstruct balances from openings + postings and compare to balance()
  for(const x of (S.sips||[])){ if(x.hold&&!S.holdings.find(h=>h.id===x.hold)) issues.push("Orphan SIP → missing holding "+x.hold); if(x.acct&&!acct(x.acct)) issues.push("Orphan SIP → missing account"); }
  for(const a of S.accounts){
    if(a.archived) continue;
    let recon=Number(a.opening)||0;
    for(const t of S.txns){
      if(t.status!=="posted"||!t.postings) continue;
      for(const p of t.postings){ if(p.acct===a.id) recon+=Number(p.amt)||0; }
    }
    const live=balance(a);
    if(Math.abs(recon-live)>0.02) issues.push("Balance mismatch "+(a.name||a.id)+": live="+live+" recon="+recon);
  }

  for(const t of S.txns){
    if(ids.has(t.id)) issues.push("Duplicate ID "+t.id); ids.add(t.id);
    if(!Array.isArray(t.postings)) issues.push("Transaction has no postings");
    for(const p of (t.postings||[])) if(!acct(p.acct)) issues.push("A transaction points at a missing account");
    if(t.fxRate!=null&&!(Number(t.fxRate)>0)) issues.push("Invalid historical FX rate on "+t.id);
    if(t.type==="transfer" && t.postings.length!==2) issues.push("Transfer without two sides");
    if(t.type!=="transfer" && t.type!=="open" && t.type!=="adjust" && t.type!=="adjustment" && t.postings.length!==1) issues.push("Unexpected postings on "+t.type);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(t.date)) issues.push("Bad date on a transaction");
  }
  openSheet(`<h2 style="margin-top:0">${issues.length?"Problems found":"All good"}</h2>
  <p class="muted">${S.txns.length} transactions, ${S.accounts.length} accounts and ${S.lending.length} lending records checked.</p>
  ${issues.length?`<ul>${[...new Set(issues)].map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:""}
  <button class="btn alt" data-close>Close</button>`);
}

/* ---------- export / import ---------- */
function download(name, text, type){
  const blob=new Blob([text],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},1000);
}
async function exportJSON(){
  const filename=`finance-backup-${today()}.enc`, encrypted=await seal(S);
  try{
    const h=await backupHandleGet();
    if(h){
      // Directory handles expose getFileHandle; createWritable is only on file handles.
      const permission=await backupPermission(h,true);
      if(permission==="granted" && typeof h.getFileHandle==="function"){
        const file=await h.getFileHandle(filename,{create:true});
        const writable=await file.createWritable();
        try{
          await writable.write(new Blob([encrypted],{type:"application/octet-stream"}));
          await writable.close();
        }catch(err){
          try{await writable.abort();}catch(_){}
          throw err;
        }
        toast("Encrypted backup saved to "+(h.name||"selected folder"));
        await backupDestinationStatus();
        return;
      }
      await backupDestinationStatus();
      if(permission!=="granted"){
        toast("Folder permission not granted. Re-choose the folder, then try again. Downloading instead.");
      }else{
        toast("This browser cannot write into the selected folder. Downloading instead.");
      }
    }
  }catch(err){
    console.warn("Folder backup failed; fallback download",err);
    toast("Folder save failed ("+(err&&err.message?err.message:"error")+"). Downloading instead.");
  }
  download(filename,encrypted,"application/octet-stream");
}
function exportCSV(){
  const rows=[["id","date","type","status","category","note","account","account_owner","amount","currency","fx_rate","person","reference"]];
  for(const t of S.txns) for(const p of t.postings) rows.push([t.id,t.date,t.type,t.status,t.cat||"",t.note||"",(acct(p.acct)||{}).name||"",(acct(p.acct)||{}).owner||"Me",p.amt,p.cur,t.fxRate||S.rate,t.person||"",t.id]);
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  download(`transactions-${today()}.csv`, csv, "text/csv");
}

  const el=e.target.closest("[data-tab],[data-editpeople],[data-setowner],[data-delperson],[data-addperson],[data-savepeople],[data-moneyseg],[data-planseg],[data-moneyacctf],[data-moneyholdf],[data-homenwf],[data-actmore],[data-clearfilters],[data-movetofamily],[data-movetocontacts],[data-add],[data-type],[data-snapshot],[data-newlend],[data-lend],[data-lendrec],[data-lendadj],[data-reconcile],[data-cat],[data-amtchip],[data-editcats],[data-xfermode],[data-catadd],[data-catdel],[data-toggle],[data-holds],[data-holdparse],[data-doholds],[data-csvimp],[data-csvtpl],[data-newacct],[data-newsip],[data-newsalary],[data-salary],[data-editsalary],[data-salarydel],[data-salaryrecv],[data-salarystop],[data-togglesip],[data-togglehide],[data-nwpref],[data-nwprefreset],[data-dismissonboard],[data-togglesal],[data-sip],[data-newpol],[data-pol],[data-newpur],[data-sipfail],[data-sipstop],[data-delpol],[data-delpur],[data-refund],[data-newhold],[data-hold],[data-txn],[data-acct],[data-void],[data-restore],[data-filter],[data-archive],[data-edit],[data-change-pass],[data-newbank],[data-newcontact],[data-contact],[data-addmethod],[data-delmethod],[data-delcontact],[data-copymethod],[data-editcontact],[data-editmethod],[data-newdemat],[data-delbank],[data-copybank],[data-copyownbank],[data-releases],[data-readme],[data-bio-enable],[data-bio-disable],[data-bio-unlock],[data-backup-folder],[data-backup-forget],[data-export],[data-csv],[data-import],[data-check],[data-wipe],[data-close]");
  if(!el){ return; }
  const d=el.dataset;
  if(!S || !CK){
    const allowed = ("bioUnlock" in d) || ("releases" in d) || ("readme" in d);
    if(!allowed) return;
  }
  if("close" in d){ if(el.classList.contains("sheet-bg") && e.target!==el) return; closeSheet(); return; }
  if(d.tab){ tab=d.tab; render(); window.scrollTo(0,0); return; }
  if("editpeople" in d){
    openSheet(`<h2 style="margin-top:0">Family members</h2>
    <p class="muted">Family view names. <b>Move to Contacts</b> hides them from Family view but keeps accounts and history. Rename updates owner labels on accounts/holdings.</p>
    ${(S.people||[]).map(n=>`<div class="card" style="margin:8px 0"><div class="row" style="gap:8px"><input class="person-name" data-personold="${esc(n)}" value="${esc(n)}" style="flex:1"></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
        ${n!=="Me"?`<button type="button" class="chip" data-movetocontacts="${esc(n)}">Move to Contacts</button><button type="button" class="chip" data-delperson="${esc(n)}">Remove from list</button>`:`<span class="muted">Primary profile</span>`}
      </div></div>`).join("")||`<div class="muted">No members yet.</div>`}
    <button type="button" class="btn alt" data-addperson>Add member</button>
    <button type="button" class="btn" data-savepeople>Save names</button>
    <button type="button" class="btn alt" data-close>Close</button>`);
    return;
  }
  if(d.setowner){ homeOwner=d.setowner; render(); return; }
  if(d.movetocontacts){
    const name=d.movetocontacts;
    if(name==="Me"){ alert("Me stays in Family view."); return; }
    if(!confirm("Move “"+name+"” to Contacts? They leave Family view; accounts and history stay.")) return;
    ensureContactByName(name);
    S.people=(S.people||[]).filter(x=>x!==name);
    if(homeOwner===name) homeOwner="All family";
    save(); toast(name+" moved to Contacts");
    // reopen manage sheet
    closeSheet(); render();
    setTimeout(()=>document.querySelector("[data-editpeople]")?.dispatchEvent(new Event("click",{bubbles:true})), 50);
    return;
  }
  if(d.movetofamily){
    const name=d.movetofamily;
    if(!confirm("Add “"+name+"” to Family view? Contact details stay under Contacts.")) return;
    ensureContactByName(name);
    if(!S.people.includes(name)) S.people.push(name);
    save(); toast(name+" added to Family view"); closeSheet(); render(); return;
  }
  if(d.delperson){
    const name=d.delperson;
    if(["Me"].includes(name)){ alert("Keep at least the Me profile."); return; }
    if(!confirm("Remove “"+name+"” from the members list? Accounts owned by this name are not deleted.")) return;
    S.people=(S.people||[]).filter(x=>x!==name); save(); 
    // refresh sheet
    document.querySelector("[data-editpeople]")?.click?.();
    render();
    openSheet(`<h2 style="margin-top:0">Family members</h2>
    <p class="muted">Member removed from the list.</p>
    ${(S.people||[]).map(n=>`<div class="row" style="gap:8px;margin:8px 0"><input class="person-name" data-personold="${esc(n)}" value="${esc(n)}" style="flex:1"><button type="button" class="chip" data-delperson="${esc(n)}">Remove</button></div>`).join("")}
    <button type="button" class="btn alt" data-addperson>Add member</button>
    <button type="button" class="btn" data-savepeople>Save names</button>
    <button type="button" class="btn alt" data-close>Close</button>`);
    return;
  }
  if("addperson" in d){
    const list=document.querySelector(".sheet");
    // append row
    const wrap=document.createElement("div"); wrap.className="row"; wrap.style.cssText="gap:8px;margin:8px 0";
    wrap.innerHTML=`<input class="person-name" data-personold="" value="" placeholder="New name" style="flex:1"><button type="button" class="chip" data-delperson="">Remove</button>`;
    const btn=document.querySelector("[data-addperson]");
    if(btn) btn.parentNode.insertBefore(wrap, btn);
    wrap.querySelector("input").focus();
    return;
  }
  if("savepeople" in d){
    const inputs=[...document.querySelectorAll(".person-name")];
    const next=[];
    for(const inp of inputs){
      const v=inp.value.trim(); if(!v) continue;
      if(!next.includes(v)) next.push(v);
      const old=inp.getAttribute("data-personold")||"";
      if(old && old!==v){
        for(const a of S.accounts) if(a.owner===old) a.owner=v;
        for(const h of S.holdings) if(h.owner===old) h.owner=v;
        for(const p of S.policies) if(p.owner===old) p.owner=v;
        for(const c of (S.contacts||[])) if(c.name===old) c.name=v;
      }
    }
    if(!next.includes("Me")) next.unshift("Me");
    S.people=next; save(); closeSheet(); render(); toast("Family members updated"); return;
  }

  if(d.moneyseg){ moneySeg=d.moneyseg; render(); window.scrollTo(0,0); return; }
  if(d.planseg){ planSeg=d.planseg; render(); window.scrollTo(0,0); return; }
  if(d.moneyacctf){ moneyAcctFilter=d.moneyacctf; render(); return; }
  if(d.moneyholdf){ moneyHoldFilter=d.moneyholdf; render(); return; }
  if(d.homenwf){ homeNwFilter=d.homenwf; render(); return; }
  if("actmore" in d){ actLimit=(actLimit||40)+40; render(); return; }
  if("clearfilters" in d){ q=""; filterAcct=""; filterType=""; actLimit=40; render(); return; }
  if("add" in d){ if(el.dataset.quick){sheetType=el.dataset.quick;chosenCat=null;} addSheet(); return; }
  if(d.type){ sheetType=d.type; addSheet(); return; }
  if(d.cat){ chosenCat=d.cat; document.querySelectorAll("#cats .chip").forEach(c=>c.classList.toggle("on",c.dataset.cat===chosenCat)); return; }
  if(d.amtchip){ const a=$("#amt"); if(a){ const cur=parseAmt(a.value)||0; a.value=String(cur+parseAmt(d.amtchip)); a.focus(); } return; }
  if(d.xfermode){ xferMode=d.xfermode; addSheet(); return; }
  if(d.editcats){ openCatsSheet(d.editcats); return; }
  if("catadd" in d){
    const list=$("#catList"); if(!list) return;
    const i=list.querySelectorAll("input").length;
    const row=document.createElement("div"); row.className="row"; row.style.gap="8px";
    row.innerHTML=`<input id="cat_${i}" value="" style="flex:1" placeholder="New category"><button type="button" class="chip" data-catdel="${i}">Remove</button>`;
    list.appendChild(row); row.querySelector("input").focus(); return;
  }
  if(d.catdel!=null){
    const row=e.target.closest(".row"); if(row) row.remove(); return;
  }
  if("toggle" in d){ S.display=S.display==="INR"?"EUR":"INR"; save(); render(); return; }
  if("snapshot" in d){ const owner=homeOwner==="All family"?null:homeOwner,nw=netWorth(owner).total,m=today().slice(0,7); const old=S.history.find(x=>x.month===m&&(x.owner||null)===owner); if(old){old.value=nw;old.date=today();old.cur=S.display;old.fxRate=S.rate;}else S.history.push({month:m,date:today(),value:nw,cur:S.display,fxRate:S.rate,owner}); save(); render(); toast("Net worth snapshot saved"); return; }
  if("newlend" in d){newLendingSheet();return;}
  if(d.lend){ lendingDetailSheet(d.lend); return; }
  if(d.lendadj){ lendingAdjustSheet(d.lendadj); return; }
  if(d.lendrec){lendingPaymentSheet(d.lendrec);return;}
  if(d.reconcile){const a=acct(d.reconcile);if(!a)return;const cur=balance(a);openSheet(`<h2 style="margin-top:0">Set current balance</h2>
<div class="muted">${esc(a.name)} · recorded now: <b class="num">${fmt(cur,a.cur)}</b></div>
<p class="muted" style="margin-top:8px">Enter the real balance from your bank app or statement. The difference is posted as a single adjustment so your history stays consistent.</p>
<form id="frecon"><input type="hidden" id="raid" value="${a.id}">
<label>Actual balance</label><input id="ractual" inputmode="decimal" required placeholder="${cur}">
<label>Date</label><input id="rdate" type="date" value="${today()}">
<label>Note</label><input id="rnote" value="Balance adjustment">
<button class="btn" type="submit">Update balance</button></form>
<button class="btn alt" data-close>Cancel</button>`);return;}
  if("newacct" in d){ newAcctSheet(); return; }
  if("newcontact" in d){
    openSheet(`<h2 style="margin-top:0">Add person</h2>
    <form id="fcontact"><label>Name</label><input id="cname" required placeholder="Type to see suggestions" list="cpeople"><datalist id="cpeople">${allPersonNames().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    <label>Notes (optional)</label><textarea id="cnotes" rows="3" placeholder="Optional notes"></textarea>
    <button class="btn" type="submit">Save Details</button></form>`); return;
  }
  if(d.contact){
    const c=contactById(d.contact); if(!c) return;
    const methods=c.methods||[];
    openSheet(`<h2 style="margin-top:0">${esc(c.name)}</h2>
    <div class="muted" style="white-space:pre-wrap">${c.notes?esc(c.notes):"No notes yet"}</div>
    <button class="btn alt" data-editcontact="${c.id}" style="margin-top:8px">Edit name & notes</button>
    <h2 style="font-size:15px;margin:16px 0 8px">Accounts & UPI</h2>
    ${methods.map(m=>{
      const title=m.kind==="upi"?esc(m.nickname||m.label||"UPI"):esc(m.nickname||m.bank||"Bank");
      const sub=m.kind==="upi"?("UPI ID: "+esc(m.upi||m.accountNumber||"")):(esc(m.holder||"")+" · "+esc(m.accountMasked||m.accountNumber||"")+(m.ifsc?" · IFSC "+esc(m.ifsc):""));
      const note=m.notes?`<div class="muted">${esc(m.notes)}</div>`:"";
      return `<div class="card tap method-card" data-editmethod="${c.id}::${m.id}">
        <div class="row"><div><b>${title}</b><div class="muted">${sub}</div>${note}</div><span class="muted">Edit ›</span></div>
      </div>`;
    }).join("")||`<div class="muted">No bank or UPI yet.</div>`}
    <button class="btn" data-addmethod="${c.id}">Add bank / UPI</button>
    ${!(S.people||[]).includes(c.name)?`<button class="btn alt" data-movetofamily="${esc(c.name)}">Move to Family view</button>`:`<div class="muted" style="margin-top:8px">Also in Family view</div>`}
    <button class="btn alt" data-delcontact="${c.id}">Remove from Contacts</button>
    <button class="btn alt" data-close>Close</button>`); return;
  }
  if(d.editcontact){
    const c=contactById(d.editcontact); if(!c) return;
    openSheet(`<h2 style="margin-top:0">Edit contact</h2>
    <form id="fcontactedit"><input type="hidden" id="ceid" value="${c.id}">
    <label>Name</label><input id="cename" value="${esc(c.name||"")}" required list="cpeople"><datalist id="cpeople">${allPersonNames().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    <label>Notes</label><textarea id="cenotes" rows="4" placeholder="Optional notes">${esc(c.notes||"")}</textarea>
    <button class="btn" type="submit">Save Details</button></form>
    <button class="btn alt" data-close>Cancel</button>`); return;
  }
  if(d.editmethod){
    const [cid,mid]=String(d.editmethod).split("::");
    const c=contactById(cid); const m=c&&(c.methods||[]).find(x=>x.id===mid); if(!c||!m) return;
    openSheet(`<h2 style="margin-top:0">Edit ${m.kind==="upi"?"UPI":"bank"} · ${esc(c.name)}</h2>
    <form id="fmethodedit" autocomplete="off"><input type="hidden" id="meidc" value="${c.id}"><input type="hidden" id="meidm" value="${m.id}">
    <label>Type</label><select id="mekind"><option value="bank" ${m.kind!=="upi"?"selected":""}>Bank account</option><option value="upi" ${m.kind==="upi"?"selected":""}>UPI ID</option></select>
    <div id="mebankfields">
      <label>Nickname (optional)</label><input id="menick" value="${esc(m.nickname||"")}" placeholder="e.g. Salary account">
      <label>Bank name</label><input id="mebank" value="${esc(m.bank||"")}">
      <label>Account holder</label><input id="meholder" value="${esc(m.holder||"")}">
      <label>Account number / IBAN</label><input id="menum" value="${esc(m.accountNumber||"")}" autocomplete="off">
      <label>IFSC</label><input id="meifsc" value="${esc(m.ifsc||"")}" autocapitalize="characters">
      <label>Branch</label><input id="mebranch" value="${esc(m.branch||"")}">
    </div>
    <div id="meupifields" style="display:none">
      <label>UPI name</label><input id="meupiname" value="${esc(m.nickname||m.label||"")}" placeholder="e.g. Personal UPI, PhonePe" required>
      <label>UPI ID</label><input id="meupi" value="${esc(m.upi||(m.kind==="upi"?m.accountNumber:"")||"")}" placeholder="name@oksbi" required>
      <label>Description (optional)</label><input id="meupinotes" value="${esc(m.notes||"")}" placeholder="Optional note">
    </div>
    <label>Currency</label><select id="mecur"><option ${m.cur==="INR"?"selected":""}>INR</option><option ${m.cur==="EUR"?"selected":""}>EUR</option></select>
    <button class="btn" type="submit">Save Details</button></form>
    <div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn alt" data-copymethod="${c.id}::${m.id}">Copy</button>
      <button type="button" class="btn alt" data-delmethod="${c.id}::${m.id}" style="color:var(--out)">Delete</button>
    </div>
    <button class="btn alt" data-close>Cancel</button>`);
    const sync=()=>{const k=$("#mekind")?.value; if($("#mebankfields"))$("#mebankfields").style.display=k==="bank"?"block":"none"; if($("#meupifields"))$("#meupifields").style.display=k==="upi"?"block":"none";};
    const mk=$("#mekind"); if(mk){ mk.onchange=sync; sync(); }
    return;
  }
  if(d.addmethod){
    const c=contactById(d.addmethod); if(!c) return;
    openSheet(`<h2 style="margin-top:0">Add bank / UPI · ${esc(c.name)}</h2>
    <form id="fmethod" autocomplete="off"><input type="hidden" id="midc" value="${c.id}">
    <label>Type</label><select id="mkind"><option value="bank">Bank account</option><option value="upi">UPI ID</option></select>
    <div id="mbankfields">
      <label>Nickname (optional)</label><input id="mnick" placeholder="e.g. Salary account">
      <label>Bank name</label><input id="mbank" placeholder="e.g. HDFC">
      <label>Account holder</label><input id="mholder" placeholder="As on account">
      <label>Account number / IBAN</label><input id="mnum" autocomplete="off">
      <label>IFSC</label><input id="mifsc" autocapitalize="characters">
      <label>Branch</label><input id="mbranch">
    </div>
    <div id="mupifields" style="display:none">
      <label>UPI name</label><input id="mupiname" placeholder="e.g. Personal UPI, PhonePe">
      <label>UPI ID</label><input id="mupi" placeholder="name@oksbi">
      <label>Description (optional)</label><input id="mupinotes" placeholder="Optional note">
    </div>
    <label>Currency</label><select id="mcur"><option>INR</option><option>EUR</option></select>
    <button class="btn" type="submit">Save Details</button></form>
    <button class="btn alt" data-close>Cancel</button>`);
    const sync=()=>{const k=$("#mkind")?.value; if($("#mbankfields"))$("#mbankfields").style.display=k==="bank"?"block":"none"; if($("#mupifields"))$("#mupifields").style.display=k==="upi"?"block":"none";};
    const mk=$("#mkind"); if(mk){ mk.onchange=sync; sync(); }
    return;
  }
if(d.delmethod){
    const [cid,mid]=String(d.delmethod).split("::");
    const c=contactById(cid); const m=c&&(c.methods||[]).find(x=>x.id===mid);
    if(!c||!m) return;
    if(!confirm("Delete this "+(m.kind==="upi"?"UPI":"bank")+" record?")) return;
    c.methods=(c.methods||[]).filter(x=>x.id!==mid); save();
    closeSheet(); render(); return;
  }
  if(d.delcontact){
    const c=contactById(d.delcontact);
    if(!c){ closeSheet(); return; }
    if(!confirm("Remove “"+c.name+"” from Contacts? Saved bank/UPI rows remain available for restore on unlock. Transactions are not deleted.")) return;
    S.contacts=(S.contacts||[]).filter(x=>x.id!==d.delcontact);
    save(); closeSheet(); render(); toast("Removed from Contacts"); return;
  }
  if(d.copymethod){
    const [cid,mid]=String(d.copymethod).split("::");
    const c=contactById(cid); const meth=c&&(c.methods||[]).find(x=>x.id===mid);
    if(!meth){ toast("Nothing to copy"); return; }
    copyToClipboard(formatContactMethodCopy(c, meth));
    return;
  }
  if("newdemat" in d){
    openSheet(`<h2 style="margin-top:0">Demat account</h2>
    <form id="fdemat">
    <label>Nickname</label><input id="dn" required placeholder="e.g. Zerodha">
    <label>Owner</label><input id="downer" list="owners" value="Me"><datalist id="owners">${S.people.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    <label>Broker / platform</label><input id="dbroker" placeholder="Zerodha, Groww, …">
    <label>Demat / client ID (optional)</label><input id="ddematid" placeholder="Optional">
    <label>Currency</label><select id="dcur"><option>INR</option><option>EUR</option></select>
    <label>Total invested (cost)</label><input id="dinv" inputmode="decimal" placeholder="0">
    <label>Current value</label><input id="dval" inputmode="decimal" placeholder="0">
    <div class="muted">Use current value as the live standing. Update anytime from the account sheet.</div>
    <button class="btn" type="submit">Save demat account</button></form>`); return;
  }
  if("newbank" in d){ moneySeg="contacts"; render(); openSheet(`<h2 style="margin-top:0">Add person first</h2><p class="muted">Contacts now live under a person registry. Add the person, then add bank or UPI methods on their card.</p><button class="btn" data-newcontact>Add person</button><button class="btn alt" data-close>Close</button>`); return; }

  if("releases" in d){
    openSheet(`<h2 style="margin-top:0">Release notes</h2>
    <div class="muted" style="margin-bottom:10px">Current version <b>v${esc(APP_VERSION)}</b></div>
    ${RELEASES.map(r=>`<div class="card"><div class="row"><b>v${esc(r.v)}</b><span class="muted">${esc(r.d)}</span></div><div class="muted" style="margin-top:6px">${esc(r.notes)}</div></div>`).join("")}
    <button class="btn alt" data-close>Close</button>`);
    return;
  }
  if(d.copybank){
    const b=S.bankContacts.find(x=>x.id===d.copybank);
    if(!b)return;
    const lines=[
      b.person?("Name: "+b.person):"",
      b.holder?("Account holder: "+b.holder):"",
      b.bank?("Bank: "+b.bank):"",
      b.accountNumber?("Account number: "+b.accountNumber):"",
      b.ifsc?("IFSC: "+b.ifsc):"",
      b.branch?("Branch: "+b.branch):"",
      b.branchCode?("Branch code: "+b.branchCode):"",
      b.cur?("Currency: "+b.cur):"",
      b.nickname?("Nickname: "+b.nickname):""
    ].filter(Boolean).join("\\n");
    const done=()=>toast("Account details copied");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(lines).then(done).catch(()=>{
        const ta=document.createElement("textarea");ta.value=lines;document.body.appendChild(ta);ta.select();
        try{document.execCommand("copy");done();}catch(e){alert(lines);}
        document.body.removeChild(ta);
      });
    }else{
      const ta=document.createElement("textarea");ta.value=lines;document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");done();}catch(e){alert(lines);}
      document.body.removeChild(ta);
    }
    return;
  }
  if(d.copyownbank){
    const a=acct(d.copyownbank); if(!a)return;
    const lines=[
      a.name?("Account: "+a.name):"",
      a.owner?("Owner: "+a.owner):"",
      a.bank?("Bank: "+a.bank):"",
      a.accountNumber?("Account number: "+a.accountNumber):"",
      a.ifsc?("IFSC: "+a.ifsc):"",
      a.branch?("Branch: "+a.branch):"",
      a.branchCode?("Branch code: "+a.branchCode):"",
      a.cur?("Currency: "+a.cur):""
    ].filter(Boolean).join("\n");
    const done=()=>toast("Account details copied");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(lines).then(done).catch(()=>{ const ta=document.createElement("textarea");ta.value=lines;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){alert(lines);}document.body.removeChild(ta);});
    }else{ const ta=document.createElement("textarea");ta.value=lines;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){alert(lines);}document.body.removeChild(ta); }
    return;
  }
  if(d.delbank){if(confirm("Remove this saved recipient bank account? Past transfers keep their recorded reference text only.")){S.bankContacts=S.bankContacts.filter(x=>x.id!==d.delbank);save();render();}return;}
  if("readme" in d){openSheet(readmeHtml());return;}
  if("togglesip" in d){ S.autoSip=S.autoSip===false; save(); render(); return; }
  if("togglehide" in d){ S.hideBalances=!S.hideBalances; save(); render(); return; }
  if(d.nwpref){
    const key=d.nwpref;
    const allowed=["insuranceCoverage","insuranceCash","loansReceivable","accruedInterest"];
    if(!allowed.includes(key)) return;
    S.nwPrefs=Object.assign({}, defaultNwPrefs(), S.nwPrefs||{});
    S.nwPrefs[key]=!S.nwPrefs[key];
    save();
    render();
    toast(S.nwPrefs[key]?"Enabled":"Disabled");
    return;
  }
  if("nwprefreset" in d){
    S.nwPrefs=defaultNwPrefs(); save(); render(); toast("Net worth defaults restored"); return;
  }
  if("dismissonboard" in d){ S.onboardingDone=true; save(); render(); return; }

function boot(){
  S=null; CK=null;
  document.body.classList.add("locked");
  let env=null, legacy=null;
  try{ const d=JSON.parse(store.get()); if(d&&d.enc) env=d; else if(d&&d.v===1) legacy=d; }catch(e){}
  BIO=env?.bio||null;KDF_ITER=env?.iterations||250000;
  $("#nav").innerHTML="";$("#layer").innerHTML="";
  $("#app").innerHTML=`<div style="padding-top:42px;position:relative">
  <button type="button" data-releases title="Release notes" style="position:absolute;top:8px;right:0;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;padding:4px 2px;opacity:.85">v${esc(APP_VERSION)}</button>
  <div class="big" style="font-size:28px">My Finance</div>
  <p class="muted">${env?"Your encrypted finance vault is locked.":"Create a strong passphrase. It encrypts your data on this phone and in backup files."}</p>
  <form id="pf"><input id="pp" type="password" autocomplete="current-password" placeholder="Passphrase" required>${env?"":`<input id="pp2" type="password" autocomplete="new-password" placeholder="Repeat passphrase" style="margin-top:8px">`}<div id="pe" class="out" style="margin-top:8px"></div><button class="btn" type="submit">${env?"Unlock with passphrase":"Create secure vault"}</button></form>
  ${env?.bio?`<button class="btn alt" data-bio-unlock>Use fingerprint / device passkey</button>`:""}
  <div class="security-note" style="margin-top:18px">Encryption: AES-256-GCM. Passphrase key derivation: PBKDF2-HMAC-SHA-256. Never share your passphrase. If you lose it and have no working biometric unlock, encrypted data cannot be recovered.</div>
  </div>`;
  $("#pf").onsubmit=async e=>{
    e.preventDefault();
    const p=$("#pp").value, er=m=>{$("#pe").textContent=m;};
    const btn=e.target.querySelector('button[type="submit"]');
    if(btn){ btn.disabled=true; btn.textContent="Unlocking…"; }
    try{
      if(!p) return er("Enter your passphrase.");
      if(env){
        SALT=unb64(env.salt);
        const k=await deriveKey(p,SALT,KDF_ITER);
        try{
          S=await unseal(env,k);
        }catch(decErr){
          S=null; CK=null;
          return er("Wrong passphrase (or vault data is damaged). Fingerprint unlock may still work if enabled.");
        }
        CK=k; BIO=env.bio||null;
        if(KDF_ITER<600000){
          try{
            const ns=crypto.getRandomValues(new Uint8Array(16)),nk=await deriveKey(p,ns,600000);
            SALT=ns; CK=nk; KDF_ITER=600000; BIO=null;
            store.set(await seal(S));
          }catch(upErr){ console.warn("kdf upgrade failed", upErr); }
        }
      }else{
        if(p.length<12) return er("Use at least 12 characters. A unique multi-word passphrase is best.");
        if(p!==$("#pp2").value) return er("The two passphrases differ.");
        SALT=crypto.getRandomValues(new Uint8Array(16)); KDF_ITER=600000;
        CK=await deriveKey(p,SALT,KDF_ITER); S=legacy||blank(); BIO=null;
      }
      try{ migrate(); }catch(mErr){ console.error(mErr); /* still allow in with partial migrate */ }
      try{ const auto=processDueAutomations(); if(auto&&(auto.sips||auto.salaries)){ setTimeout(()=>toast((auto.sips?auto.sips+" SIP(s)":"")+(auto.sips&&auto.salaries?" · ":"")+(auto.salaries?auto.salaries+" salary":"")+" posted"), 400); } }catch(aErr){ console.warn(aErr); }
      try{ save(); }catch(sErr){ console.warn(sErr); }
      document.body.classList.remove("locked");
      render();
    }catch(x){
      S=null; CK=null; document.body.classList.add("locked");
      er("Could not unlock: "+(x&&x.message?x.message:"unknown error"));
    }finally{
      if(btn){ btn.disabled=false; btn.textContent=env?"Unlock with passphrase":"Create secure vault"; }
    }
  };
}

let hidAt=0;
document.addEventListener("visibilitychange",()=>{ if(!S) return; if(document.hidden) hidAt=Date.now(); else if(Date.now()-hidAt>120000) chain=chain.then(()=>{ S=null; CK=null; boot(); }); });
boot();
