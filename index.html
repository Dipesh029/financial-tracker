function formatExpiryInput(raw){
  const digits=String(raw||"").replace(/\D/g,"").slice(0,4);
  if(digits.length<=2) return digits;
  return digits.slice(0,2)+"/"+digits.slice(2);
}
function parseExpiryParts(s){
  const n=formatExpiryInput(s);
  const m=/^(0[1-9]|1[0-2])\/(\d{2})$/.exec(n);
  return m?{mm:m[1],yy:m[2]}:null;
}
function isExpiryValid(s,opts){
  opts=opts||{};
  const p=parseExpiryParts(s); if(!p) return false;
  if(opts.allowPast) return true;
  const now=new Date(), cy=now.getFullYear()%100, cm=now.getMonth()+1;
  const y=+p.yy, mo=+p.mm;
  if(y>cy) return true; if(y<cy) return false; return mo>=cm;
}
function expiryPickerHtml(idPrefix, initial){
  const p=parseExpiryParts(initial||"")||{};
  const mm=p.mm||"";
  let yy=p.yy||"";
  // Prefer YY for storage display
  if(yy.length===4) yy=yy.slice(-2);
  return '<label>Card expiry</label>'+
    '<input type="hidden" id="'+idPrefix+'" value="'+esc(mm&&yy?(mm+"/"+yy):"")+'">'+
    '<div class="expiry-row">'+
    '<div><label class="sub">Month (MM)</label>'+
    '<input id="'+idPrefix+'_mm" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="MM" value="'+esc(mm)+'" autocomplete="cc-exp-month" aria-label="Expiry month"></div>'+
    '<div><label class="sub">Year (YY)</label>'+
    '<input id="'+idPrefix+'_yy" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="YY" value="'+esc(yy)+'" autocomplete="cc-exp-year" aria-label="Expiry year"></div>'+
    '</div>'+
    '<div class="muted">Example: 08 and 29 for August 2029. Stored as MM/YY.</div>';
}
function wireExpiryField(idPrefix){
  const hidden=document.getElementById(idPrefix);
  const mm=document.getElementById(idPrefix+"_mm");
  const yy=document.getElementById(idPrefix+"_yy");
  if(!hidden||!mm||!yy) return;
  const apply=function(){
    let m=(mm.value||"").replace(/\D/g,"").slice(0,2);
    let y=(yy.value||"").replace(/\D/g,"").slice(0,4);
    if(m.length===1) m="0"+m;
    if(y.length===4) y=y.slice(-2);
    if(mm.value!==m && m) mm.value=m;
    if(y.length===2 && yy.value!==y && (yy.value||"").replace(/\D/g,"").length>=2) yy.value=y;
    if(m.length===2 && y.length===2) hidden.value=m+"/"+y;
    else if(m||y) hidden.value="";
    else hidden.value="";
  };
  mm.addEventListener("input", function(){
    mm.value=(mm.value||"").replace(/\D/g,"").slice(0,2);
    apply();
  });
  yy.addEventListener("input", function(){
    yy.value=(yy.value||"").replace(/\D/g,"").slice(0,4);
    apply();
  });
  mm.addEventListener("blur", apply);
  yy.addEventListener("blur", apply);
  apply();
}
function readExpiryField(idPrefix, opts){
  opts=opts||{};
  const hidden=document.getElementById(idPrefix);
  const mmEl=document.getElementById(idPrefix+"_mm");
  const yyEl=document.getElementById(idPrefix+"_yy");
  let m=(mmEl&&mmEl.value||"").replace(/\D/g,"").slice(0,2);
  let y=(yyEl&&yyEl.value||"").replace(/\D/g,"").slice(0,4);
  if(m.length===1) m="0"+m;
  if(y.length===4) y=y.slice(-2);
  let v="";
  if(m||y) v=(m.length===2&&y.length===2)?(m+"/"+y):"";
  if(!v && hidden) v=formatExpiryInput(hidden.value||"");
  if(!m && !y && !v) return opts.required?{ok:false,error:"Enter the card expiry month and year."}:{ok:true,value:""};
  if(m && (m.length!==2 || +m<1 || +m>12)) return {ok:false,error:"Expiry month must be 01–12."};
  if(y && y.length!==2) return {ok:false,error:"Expiry year must be 2 digits (YY) or 4 digits (YYYY)."};
  if(!m || !y) return {ok:false,error:"Enter both expiry month and year."};
  v=m+"/"+y;
  const p=parseExpiryParts(v);
  if(!p) return {ok:false,error:"Enter a valid expiry month and year."};
  if(!isExpiryValid(v,{allowPast:!!opts.allowPast})) return {ok:false,error:"This expiry is in the past."};
  if(hidden) hidden.value=v;
  return {ok:true,value:v};
}

function pushSheetHistoryEntry(){
  if(sheetHistoryActive || sheetHistoryBackPending || !window.history || typeof window.history.pushState!=="function") return;
  try{ window.history.pushState({__myFinanceSheet:true},""); sheetHistoryActive=true; }catch(e){ sheetHistoryActive=false; }
}
function openSheet(html){
  // One history entry per open sheet. Replacing a sheet (for example with a
  // passphrase prompt) reuses that entry instead of stacking Back presses.
  if(sheetHistoryBackPending) sheetReopenAfterBack=true;
  else pushSheetHistoryEntry();
  $("#layer").innerHTML = `<div class="sheet-bg" data-close><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}
  try{ ["adexpiry","cexpiry","expiry","fxexpiry"].forEach(id=>{ if(document.getElementById(id)) wireExpiryField(id); }); }catch(e){}
}
function closeSheet(options){
  options=options||{};
  $("#layer").innerHTML="";
  // A closed Give & Take form must not remain the selected quick-add mode.
  if(sheetType==="givetake"){ sheetType="expense"; chosenCat=null; }
  if(passWait){ const r=passWait; passWait=null; r(null); }
  if(sheetHistoryActive){
    sheetHistoryActive=false;
    if(!options.fromPop && window.history&&typeof window.history.back==="function"){
      sheetHistoryBackPending=true;
      try{ window.history.back(); }catch(e){ sheetHistoryBackPending=false; }
    }
  }else if(sheetHistoryBackPending){
    // The user closed a just-reopened sheet before the previous Back event
    // completed. Do not resurrect a history entry for a now-closed sheet.
    sheetReopenAfterBack=false;
  }
}
function handleSheetPopState(){
  if(sheetHistoryBackPending){
    sheetHistoryBackPending=false;
    const reopen=sheetReopenAfterBack && !!document.querySelector("#layer .sheet");
    sheetReopenAfterBack=false;
    if(reopen) pushSheetHistoryEntry();
    return;
  }
  if(!sheetHistoryActive) return;
  sheetHistoryActive=false;
  closeSheet({fromPop:true});
}
window.addEventListener&&window.addEventListener("popstate",handleSheetPopState);

function backupTooLarge(text){ return String(text||"").length>6000000; }
function vaultHasUnsafeId(v, depth){
  if((depth||0)>14 || v==null) return false;
  if(Array.isArray(v)){
    if(v.length>80000) return true;
    return v.some(x=>vaultHasUnsafeId(x, (depth||0)+1));
  }
  if(typeof v==="object"){
    if(typeof v.id==="string" && /[<>"'&]/.test(v.id)) return true;
    return Object.values(v).some(x=>vaultHasUnsafeId(x, (depth||0)+1));
  }
  return false;
}
function refreshAmtPreview(){
  const prev=$("#amtPreview"), input=$("#amt");
  if(!prev||!input) return;
  const raw=String(input.value||"").trim();
  if(!raw){ prev.textContent=""; return; }
  const r=readAmt(raw,{required:true,maxDecimals:2,positive:true});
  if(!r.ok){ prev.textContent=r.error; return; }
  const a=acct($("#from")&&$("#from").value);
  const cur=(a&&a.cur)||S.display;
  prev.textContent="Will record "+fmt(r.value, cur);

function toast(msg, undo){
  const el=document.createElement("div"); el.className="toast"; el.innerHTML=`<span>${esc(msg)}</span>${undo?`<button>Undo</button>`:""}`;
  document.body.appendChild(el);
  const t=setTimeout(()=>el.remove(),5000);
  if(undo) el.querySelector("button").onclick=()=>{ clearTimeout(t); el.remove(); undo(); };
}

function matchHoldingCandidates(holdings, it, owner){
  // Production matcher used by CSV import. Returns 0, 1, or many candidates.
  const iEx=(it.exch||"").toUpperCase();
  const iIsin=(it.isin||"").trim();
  const iSym=(it.sym||"").toUpperCase();
  return (holdings||[]).filter(h=>{
    if((h.owner||"Me")!==(owner||"Me")) return false;
    const hEx=(h.exchange||"").toUpperCase();
    const hIsin=(h.isin||"").trim();
    if(iIsin && hIsin){
      if(iIsin!==hIsin) return false;
      return hEx===iEx;
    }
    // Symbol fallback only when ISIN missing on at least one side
    const hSym=(h.symbol||h.name||"").toUpperCase();
    if(hSym && iSym && hSym===iSym) return hEx===iEx;
    return false;
  });
}
function buildHoldPlanRow(holdings, it, owner){
  const candidates=matchHoldingCandidates(holdings, it, owner);
  if(candidates.length>1) return {H:null, it, kind:"ambiguous", note:"Multiple matches — skipped"};
  if(candidates.length===1){
    const H=candidates[0];
    // qty compare deferred to holdParse with holdPos
    return {H, it, kind:"matched"};
  }
  return {H:null, it, kind:"new"};
}
function applyHoldPlanMutations(plan, opts){
  // Pure-ish apply: opts={holdings, people, addTxn, uid, date}
  // Skips ambiguous BEFORE any create. Returns stats + new holdings list.
  const holdings=(opts.holdings||[]).slice();
  const people=(opts.people||[]).slice();
  const date=opts.date||"2020-01-01";
  const txns=[];
  let added=0, changed=0, price=0, skippedAmbiguous=0;
  for(const p of plan){
    if(p.kind==="ambiguous"){ skippedAmbiguous++; continue; }
    let H=p.H;
    if(!H){
      H={id:(opts.uid?opts.uid():("h"+added)), name:p.it.sym, type:"stock", cur:"INR", isin:p.it.isin, sector:p.it.sec, price:p.it.prev, owner:(opts.owner||"Me"), symbol:p.it.sym, exchange:p.it.exch||""};
      holdings.push(H);
      if(!people.includes(H.owner)) people.push(H.owner);
      added++;
      p.H=H;
      if(p.kind==="new" || !p.kind) txns.push({type:"open", hold:H.id});
    } else if(p.kind==="changed"){
      changed++;
      txns.push({type:"adjust", hold:H.id});
    } else price++;
  }
  const snapItems=plan.filter(p=>p.kind!=="ambiguous").map(p=>p.it);
  return {holdings, people, txns, added, changed, price, skippedAmbiguous, snapItems};
}

function parseCsvRows(text){
  // RFC-style CSV: quoted fields may contain commas and newlines
  const rows=[]; let row=[]; let cur=""; let q=false;
  const s=String(text||"").replace(/^\uFEFF/,"");
  for(let i=0;i<s.length;i++){
    const ch=s[i], next=s[i+1];
    if(q){
      if(ch==='"' && next==='"'){ cur+='"'; i++; }
      else if(ch==='"'){ q=false; }
      else cur+=ch;
    } else {
      if(ch==='"') q=true;
      else if(ch===',' || ch==='\t'){ row.push(cur.trim()); cur=""; }
      else if(ch==='\n' || (ch==='\r' && next==='\n')){
        if(ch==='\r') i++;
        row.push(cur.trim()); cur="";
        if(row.some(c=>c!=="")) rows.push(row);
        row=[];
      } else if(ch==='\r'){
        row.push(cur.trim()); cur="";
        if(row.some(c=>c!=="")) rows.push(row);
        row=[];
      } else cur+=ch;
    }
  }
  row.push(cur.trim());
  if(row.some(c=>c!=="")) rows.push(row);
  return rows;
}
function holdParse(text){
  if(!text||!String(text).trim()){ alert("Paste CSV data or choose a file first."); return; }
  const owner=($("#howner")&&$("#howner").value)||"Me";
  const rows=parseCsvRows(text);
  if(rows.length<2){ alert("Need a header row and at least one data row."); return; }
  const headers=rows[0].map(h=>String(h).toLowerCase().replace(/[^a-z0-9]/g,""));
  const col=(names)=>{ for(const n of names){ const i=headers.indexOf(n); if(i>=0) return i; } return -1; };
  const iSym=col(["symbol","sym","ticker","tradingsymbol","scrip","name","security","instrument"]);
  const iQty=col(["qty","quantity","qty","units","holding","availableqty","freefloat"]);
  const iAvg=col(["avg","average","avgprice","averageprice","buyavg","cost","buyprice","avgcost"]);
  const iPrice=col(["price","ltp","last","lastprice","close","prevclose","nav","marketprice","cmp"]);
  const iIsin=col(["isin"]);
  const iSec=col(["sector","industry"]);
  const iExch=col(["exchange","exch"]);
  if(iSym<0||iQty<0){ alert("Could not find Symbol and Quantity columns. Include headers like Symbol, Qty, Avg, LTP."); return; }
  const items=[]; const seenInFile=new Set();
  let failed=0, fileDup=0;
  for(let r=1;r<rows.length;r++){
    const cells=rows[r]; if(!cells||!cells.length) continue;
    const sym=(cells[iSym]||"").trim(); if(!sym){ failed++; continue; }
    const qtyRaw=String(cells[iQty]||"").replace(/,/g,"").trim();
    const qty=parseFloat(qtyRaw);
    if(!(qty>0) || !isFinite(qty)){ failed++; continue; } // reject zero/invalid — do not silently treat as 0 position
    const avg=iAvg>=0?parseFloat(String(cells[iAvg]||"0").replace(/,/g,""))||0:0;
    const prev=iPrice>=0?parseFloat(String(cells[iPrice]||"0").replace(/,/g,""))||0:(avg||0);
    const isin=iIsin>=0?(cells[iIsin]||"").trim():"";
    const sec=iSec>=0?(cells[iSec]||"").trim():"";
    const exch=iExch>=0?(cells[iExch]||"").trim():"";
    const fileKey=isin?( (owner||"Me")+"|"+isin.toUpperCase()+"|"+(exch||"").toUpperCase() ):( (owner||"Me")+"|"+sym.toUpperCase()+"|"+(exch||"").toUpperCase() );
    if(seenInFile.has(fileKey)){ fileDup++; continue; }
    seenInFile.add(fileKey);
    items.push({sym, qty, avg, prev:prev||avg, isin, sec, exch});
  }
  if(!items.length){ alert("No valid rows found ("+failed+" failed, "+fileDup+" duplicate in file)."); return; }
  const plan=[]; let existingMatch=0;
  for(const it of items){
    const row=buildHoldPlanRow(S.holdings, it, owner);
    if(row.kind==="ambiguous"){ plan.push(row); continue; }
    let H=row.H;

    if(H){
      existingMatch++;
      const pos=holdPos(H);
      const du=Math.round((it.qty-pos.u)*1e6)/1e6;
      const newCost=Math.round(it.qty*it.avg*100)/100;
      const dc=Math.round((newCost-pos.c)*100)/100;
      if(Math.abs(du)<1e-9) plan.push({H,it,kind:"price"});
      else plan.push({H,it,kind:"changed",du,dc});
    } else {
      plan.push({H:null,it,kind:"new"});
    }
  }
  pendH={owner, plan, items:items.length, failed, fileDup, existingMatch};
  openSheet(`<h2 style="margin-top:0">Review import</h2>
  <div class="muted">${items.length} valid · ${plan.filter(p=>p.kind==="new").length} new · ${plan.filter(p=>p.kind==="changed").length} qty changes · ${plan.filter(p=>p.kind==="price").length} price-only · ${plan.filter(p=>p.kind==="ambiguous").length} ambiguous · ${fileDup} file dups · ${failed} failed</div>
  <label>As-of date</label><input type="date" id="hdate" value="${today()}">
  <p class="muted">Import sets positions only — no bank debit. Holdings not in the file are left unchanged (nothing is marked sold).</p>
  <div class="card" style="max-height:40vh;overflow:auto;margin:10px 0">${plan.slice(0,50).map(p=>`<div class="row"><span>${esc(p.it.sym)}${p.it.isin?" · "+esc(p.it.isin):""} · ${p.it.qty} @ ${p.it.avg}</span><b>${p.kind}</b></div>`).join("")}${plan.length>50?"<div class='muted'>…and more</div>":""}</div>
  <button class="btn" data-doholds>Apply import</button>
  <button class="btn alt" data-close>Cancel</button>`);
}
function doHolds(){
  const P=pendH; if(!P) return;
  const date=($("#hdate")||{}).value||today();
  let added=0, changed=0, price=0, sold=0, skippedAmbiguous=0;
  // Process only non-ambiguous plan rows; never create holdings for ambiguous
  for(const p of P.plan){
    if(p.kind==="ambiguous"){ skippedAmbiguous++; continue; }
    let H=p.H;
    if(!H){
      H={id:uid(),name:p.it.sym,type:"stock",cur:"INR",isin:p.it.isin,sector:p.it.sec,price:p.it.prev,owner:(P.owner||"Me"),symbol:p.it.sym,exchange:p.it.exch||"",demat:"",broker:"",amc:"",folio:"",notes:""};
      S.holdings.push(H);
      if(!S.people.includes(H.owner)) S.people.push(H.owner);
      added++;
    } else {
      H.price=p.it.prev;
      H.priceAsOf=date;
      if(!H.isin && p.it.isin) H.isin=p.it.isin;
      if(p.it.sec) H.sector=p.it.sec;
      if(p.it.exch && !H.exchange) H.exchange=p.it.exch;
    }
    if(p.kind==="new") addTxn({type:"open",date,note:"Imported opening position",hold:H.id,units:p.it.qty,cost:Math.round(p.it.qty*p.it.avg*100)/100,postings:[]},{skipSave:true});
    else if(p.kind==="changed"){ addTxn({type:"adjust",date,note:"Portfolio file sync",hold:H.id,units:p.du,cost:p.dc,postings:[]},{skipSave:true}); changed++; }
    else price++;
  }
  // Snapshot from non-ambiguous items only
  const snapItems=(P.plan||[]).filter(p=>p.kind!=="ambiguous").map(p=>p.it);
  S.snaps=S.snaps||[];
  if(snapItems.length){
    S.snaps.push({
      date,
      inv:Math.round(snapItems.reduce((a,x)=>a+(Number(x.qty)||0)*(Number(x.avg)||0),0)),
      val:Math.round(snapItems.reduce((a,x)=>a+(Number(x.qty)||0)*(Number(x.prev)||0),0))
    });
  }
  pendH=null;
  save();
  closeSheet();
  render();
  toastSaved(added+" new, "+changed+" changed, "+price+" prices"+(skippedAmbiguous?", "+skippedAmbiguous+" ambiguous skipped":""));
}

const acctTypeLabel=a=>({bank:"Bank",cash:"Cash",card:"Card",demat:"Demat"}[a.type]||a.type||"Account");
const accOpts=()=>S.accounts.filter(a=>!a.archived).map(a=>[a.id,`${a.name} · ${acctTypeLabel(a)} (${a.cur})`]);
function acctUseScore(a){
  let n=0;
  for(const t of (S.txns||[])){
    if(!t||t.status!=="posted"||!t.postings) continue;
    if(t.postings.some(p=>p.acct===a.id)) n++;
  }
  if(S.lastAcct===a.id) n+=1000;
  return n;
}
function payPurposeTypes(purpose){
  if(purpose==="in") return ["bank","cash"];
  if(purpose==="expense" || purpose==="forex-expense") return ["bank","card","cash","forex"];
  return ["bank","card","cash"];
}
function payAccountAllowed(a, purpose){
  if(!a||a.archived) return false;
  return payPurposeTypes(purpose).includes(a.type);
}
function paymentAccounts(purpose, opts){
  opts=opts||{};
  const includeId=opts.includeId||"";
  const types=payPurposeTypes(purpose);
  const list=(S.accounts||[]).filter(a=>{
    if(a.id===includeId) return true;
    if(a.archived) return false;
    if(a.type==="forex" && !forexVisible()) return false;
    return types.includes(a.type);
  });
  const rank=(a,b)=>{
    const d=acctUseScore(b)-acctUseScore(a);
    if(d) return d;
    return String(a.name||"").localeCompare(String(b.name||""), undefined, {sensitivity:"base"});
  };
  const groups=[
    {key:"bank", label:"Bank accounts"},
    {key:"card", label:"Credit / debit cards"},
    {key:"cash", label:"Cash accounts"},
    {key:"forex", label:"Forex cards"}
  ].map(g=>({...g, accounts:list.filter(a=>a.type===g.key).slice().sort(rank)})).filter(g=>g.accounts.length);
  const extra=list.filter(a=>!types.includes(a.type));
  if(extra.length) groups.push({key:"other", label:"Current account", accounts:extra});
  return groups;
}
function preferredPayId(purpose, pref){
  const wanted=pref&&acct(pref);
  if(payAccountAllowed(wanted, purpose) && (wanted.type!=="forex" || forexVisible())) return wanted.id;
  const last= S.lastAcct && acct(S.lastAcct);
  if(last && payAccountAllowed(last, purpose) && (last.type!=="forex" || forexVisible())) return last.id;
  const groups=paymentAccounts(purpose);
  return groups[0]&&groups[0].accounts[0]?groups[0].accounts[0].id:"";
}

function addM(t,n){const[y,m,d]=t.split("-").map(Number);const x=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,0)).getUTCDate();const day=Math.min(d,last);const z=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth(),day));return z.getUTCFullYear()+"-"+String(z.getUTCMonth()+1).padStart(2,"0")+"-"+String(z.getUTCDate()).padStart(2,"0");}
function addDays(t,n){const[y,m,d]=t.split("-").map(Number);const x=new Date(Date.UTC(y,m-1,d+n));return x.getUTCFullYear()+"-"+String(x.getUTCMonth()+1).padStart(2,"0")+"-"+String(x.getUTCDate()).padStart(2,"0");}
function calendarDays(a,b){
  if(!a||!b) return 0;
  const p=s=>{ const [y,m,d]=String(s).slice(0,10).split("-").map(Number); return Date.UTC(y,(m||1)-1,d||1); };
  return Math.round((p(b)-p(a))/864e5);
}
function sipTermsAt(x, payDate){
  const revs=(x.revisions||[]).filter(r=>r&&r.prev).slice().sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
  let state=revs.length
    ? {amt:revs[0].prev.amt, freq:revs[0].prev.freq, acct:revs[0].prev.acct}
    : {amt:x.amt, freq:x.freq, acct:x.acct};
  for(let i=0;i<revs.length;i++){
    if(String(payDate) < String(revs[i].date||"")) break;
    if(i+1<revs.length){
      const p=revs[i+1].prev;
      state={amt:p.amt, freq:p.freq, acct:p.acct};
    }else state={amt:x.amt, freq:x.freq, acct:x.acct};
  }
  return {amt:Number(state.amt)||0, freq:Math.max(1, Number(state.freq)||1), acct:state.acct||x.acct};
}
function advanceSipNext(x, fromDate){
  const base=(fromDate||x.next||today());
  return addM(base, sipTermsAt(x, base).freq);
}
function salaryTermsAt(x, payDate){
  const revs=(x.revisions||[]).filter(r=>r&&r.prev).slice().sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
  let state=revs.length
    ? {amt:revs[0].prev.amt, freq:revs[0].prev.freq, freqUnit:revs[0].prev.freqUnit, acct:revs[0].prev.acct}
    : {amt:x.amt, freq:x.freq, freqUnit:x.freqUnit, acct:x.acct};
  for(let i=0;i<revs.length;i++){
    if(String(payDate) < String(revs[i].date||"")) break;
    if(i+1<revs.length){
      const p=revs[i+1].prev;
      state={amt:p.amt, freq:p.freq, freqUnit:p.freqUnit, acct:p.acct};
    }else state={amt:x.amt, freq:x.freq, freqUnit:x.freqUnit, acct:x.acct};
  }
  return {
    amt:Number(state.amt)||0,
    freq:Math.max(1, Number(state.freq)||1),
    freqUnit:state.freqUnit||"month",
    acct:state.acct||x.acct
  };
}
function advanceSalaryNext(x, fromDate){
  const base=(fromDate||x.next||today());
  const t=salaryTermsAt(x, base);
  if(t.freqUnit==="week") return addDays(base, 7*t.freq);
  if(t.freqUnit==="day") return addDays(base, t.freq);
  return addM(base, t.freq);
}

function lendingPosition(l){
  const principalOrig=Math.max(0, Number(l.principal)||0);
  const rate=Number(l.rate)||0;
  const start=l.start||today();
  // Principal repayments chronological
  const asOf=today();
  const prinTxns=S.txns.filter(t=>t.status==="posted"&&t.loanId===l.id&&t.principalReduction&&(t.date||start)<=asOf)
    .map(t=>({date:t.date||start, amt:Number(t.principalReduction)||0, created:t.created||""}))
    .sort((a,b)=>a.date.localeCompare(b.date)||String(a.created).localeCompare(String(b.created)));
  for(const t of prinTxns){ if(t.date<start) t.date=start; }
  let principalLeft=principalOrig;
  let principalRepaid=0;
  let cursor=start;
  let accrued=0;
  let interestFromOverpay=0;
  for(const ev of prinTxns){
    if(principalLeft>0.0000001 && rate>0){
      const accrualEnd=ev.date>asOf?asOf:ev.date;
      const d=Math.max(0, calendarDays(cursor, accrualEnd));
      accrued+=principalLeft*rate/100*d/365.25;
    }
    const raw=Math.max(0, ev.amt);
    const pay=Math.min(principalLeft, raw);
    interestFromOverpay+=Math.max(0, raw-pay);
    principalLeft-=pay;
    principalRepaid+=pay;
    cursor=ev.date>cursor?ev.date:cursor;
  }
  if(principalLeft>0.0000001 && rate>0){
    const d=Math.max(0, calendarDays(cursor>asOf?asOf:cursor, asOf));
    accrued+=principalLeft*rate/100*d/365.25;
  }
  // If principal fully repaid, cursor is last repayment date — no further accrual (above branch skipped)
  principalLeft=Math.max(0, principalLeft);
  principalRepaid=Math.min(principalOrig, Math.max(0, principalRepaid));
  const interestPaid=S.txns.filter(t=>t.status==="posted"&&t.loanId===l.id&&t.interestSettlement&&(t.date||start)<=asOf)
    .reduce((v,t)=>v+Math.abs(t.postings?.[0]?.amt||0),0);
  // Manual adjustments: positive = more interest owed; negative = waiver/round-down
  const asOfAdj=today();
  const adjustments=(l.interestAdjustments||[]).filter(a=>!a.date || a.date<=asOfAdj);
  const interestAdj=adjustments.reduce((v,a)=>v+(Number(a.amount)||0),0);
  const interestLeft=Math.max(0, accrued+interestAdj-interestPaid-interestFromOverpay);
  const totalOutstanding=principalLeft+interestLeft;
  const totalPayable=principalOrig+Math.max(0, accrued+interestAdj);
  const totalPaid=principalRepaid+interestPaid+interestFromOverpay;
  const pctPrincipal=principalOrig>0?Math.min(100, Math.round(principalRepaid/principalOrig*100)):100;
  const pctTotal=totalPayable>0?Math.min(100, Math.round(totalPaid/totalPayable*100)):(totalOutstanding<=0?100:0);
  let status="Unpaid";
  if(totalOutstanding<=0.0001) status="Fully Settled";
  else if(principalLeft<=0.0001 && interestLeft>0.0001) status="Principal Repaid · Interest Pending";
  else if(principalRepaid>0.0001 || interestPaid>0.0001 || interestAdj) status="Partially Repaid";
  else status="Unpaid";
  const days=Math.max(0, calendarDays(start, today()));
  return {
    principal: principalLeft,
    principalOrig, principalLeft, principalRepaid,
    interest: interestLeft,
    interestLeft, accrued, interestPaid, interestAdj, interestAccrued: accrued,
    total: totalOutstanding, totalOutstanding, totalPayable, totalPaid,
    pctPrincipal, pctTotal, status, days, rate, adjustments
  };
}

function dueHtml(){
  const r=[];
  for(const x of S.sips){
    if(x.status==="stopped") continue;
    const d=daysTo(x.next);
    if(d<=14){
      const h=S.holdings.find(v=>v.id===x.hold)||{};
      const label=d<0?"Overdue SIP":d===0?"SIP due today":"SIP";
      const priceNote=!(h.price>0)?" · set fund price":"";
      r.push([d, label+" · "+esc(h.name||"Fund")+(h.folio?" · Folio "+esc(h.folio):"")+priceNote, fmtHide(x.amt,x.cur), `data-sip="${esc(x.id)}"`, d<0?"warn":""]);
    }
  }
  for(const x of S.salaries){
    if(x.status==="stopped") continue;
    const d=daysTo(x.next);
    if(d<=14){
      const label=d<0?"Overdue salary":d===0?"Salary today":"Salary";
      r.push([d, label+" · "+esc(x.person||"Me"), fmtHide(x.amt,x.cur), `data-salary="${esc(x.id)}"`, d<0?"warn":""]);
    }
  }
  for(const p of S.policies){
    if(!policyDueForReminder(p)) continue;
    const due=policyPayableDate(p);
    if(!due) continue;
    const d=daysTo(due);
    if(d<=30) r.push([d, "Premium · "+esc(p.name), fmtHide(p.premium,p.cur), `data-pol="${esc(p.id)}"`, d<0?"warn":""]);
  }
  for(const a of S.accounts){
    if(a.type!=="card"||a.archived||!a.dueDay) continue;
    const b=balance(a);
    if(b>=0) continue;
    const d=daysTo(nextDue(a.dueDay));
    if(d<=14) r.push([d, "Card due · "+esc(a.name), fmtHide(-b,a.cur), `data-acct="${esc(a.id)}"`, d<=3?"warn":""]);
  }
  for(const p of S.purchases){
    if(p.txnVoided||!p.expiry) continue;
    const d=daysTo(p.expiry);
    if(d>=0&&d<=30) r.push([d, "Warranty · "+esc(p.item), "", "", ""]);
  }
  for(const a of S.accounts){
    if(a.archived) continue;
    const exp=(a.cardMeta||{}).expiry;
    if(!exp || !/^(0[1-9]|1[0-2])\/([0-9]{2})$/.test(exp)) continue;
    const [mm,yy]=exp.split("/");
    const end="20"+yy+"-"+mm+"-01";
    // treat as due in the expiry month (1st); show within 60 days before
    const d=daysTo(end);
    if(d>=-31 && d<=60){
      const kind=a.type==="forex"?"Forex card":a.type==="card"?"Credit card":"Debit card";
      const last=(a.cardMeta||{}).last4?(" ••••"+a.cardMeta.last4):"";
      r.push([Math.max(0,d), kind+" expires · "+esc(a.name)+last, exp, `data-acct="${esc(a.id)}"`, d<=30?"warn":""]);
    }
  }
  if(!r.length) return "";
  r.sort((a,b)=>a[0]-b[0]);
  return `<h2>Due soon</h2><div class="card">${r.map(x=>{
    const when=x[0]<0?((-x[0])+"d overdue"):x[0]===0?"today":("in "+x[0]+"d");
    const pill=x[0]<0?`<span class="due-pill over">overdue</span>`:x[0]===0?`<span class="due-pill">today</span>`:"";
    return `<div class="row" ${x[3]||""} style="cursor:pointer"><div><b class="${x[4]||""}">${x[1]}</b> ${pill}<div class="muted">${when}</div></div><b class="num ${x[4]||""}">${x[2]}</b></div>`;
  }).join("")}</div>`;
}

async function unlockBiometric(){

/* ---------- integrity check ---------- */
function runCheck(){
  const issues=[]; const ids=new Set();
  const txnById=new Map(), refundTotals=new Map(), walletMovements=new Map();
  for(const t of (S.txns||[])){
    if(t.id) txnById.set(t.id,t);
    if(t.type==="refund"&&t.status==="posted"&&t.refundOf){
      refundTotals.set(t.refundOf,(refundTotals.get(t.refundOf)||0)+Math.abs(Number(t.postings?.[0]?.amt)||0));
    }
    if(t.status==="posted"&&t.forexAcct&&t.walletId){
      const key=t.forexAcct+"\u0000"+t.walletId;
      walletMovements.set(key,(walletMovements.get(key)||0)+forexTxnDelta(t));
    }
  }
  // Reconstruct balances from openings + postings and compare to balance()
  for(const x of (S.sips||[])){ if(x.hold&&!S.holdings.find(h=>h.id===x.hold)) issues.push("Orphan SIP → missing holding "+x.hold); if(x.acct&&!acct(x.acct)) issues.push("Orphan SIP → missing account"); }
  for(const a of S.accounts){
    if(a.archived&&a.type!=="forex") continue;
    if(a.type==="forex"){
      const curs=new Set(),walletIds=new Set();
      for(const w of (a.wallets||[])){
        if(!w||!w.cur){issues.push("Forex wallet missing currency on "+(a.name||a.id));continue;}
        const cur=String(w.cur).toUpperCase();
        if(curs.has(cur)) issues.push("Duplicate currency "+cur+" on Forex card "+(a.name||a.id));
        curs.add(cur);
        if(!fxKnown(cur)) issues.push("Unsupported currency "+cur+" on "+(a.name||a.id));
        if(!w.id||walletIds.has(w.id)) issues.push("Missing or duplicate wallet ID on "+(a.name||a.id));
        walletIds.add(w.id);
        if(!Number.isFinite(Number(w.balance))||!Number.isFinite(Number(w.openingBalance))) issues.push("Invalid wallet balance baseline on "+(a.name||a.id)+" "+cur);
        const expected=Number.isFinite(Number(w.openingBalance))?Math.round((Number(w.openingBalance)+(walletMovements.get(a.id+"\u0000"+w.id)||0))*100)/100:null;
        if(expected!=null&&Math.abs(expected-(Number(w.balance)||0))>0.02) issues.push("Forex wallet balance mismatch "+(a.name||a.id)+" "+cur+": live="+w.balance+" ledger="+expected);
      }
      continue;
    }
    let recon=Number(a.opening)||0;
    for(const t of S.txns){
      if(t.status!=="posted"||!t.postings) continue;
      for(const p of t.postings){ if(p.acct===a.id) recon+=Number(p.amt)||0; }
    }
    const live=balance(a);
    if(Math.abs(recon-live)>0.02) issues.push("Balance mismatch "+(a.name||a.id)+": live="+live+" recon="+recon);
  }
  // Forex transaction integrity, including refunds and voided historical references.
  for(const t of S.txns){
    if(t.type==="refund"&&t.status==="posted"){
      const parent=txnById.get(t.refundOf);
      if(!parent) issues.push("Refund "+t.id+" references a missing original expense");
      else if(parent.type!=="expense") issues.push("Refund "+t.id+" references a non-expense transaction");
      else if(parent.status!=="posted") issues.push("Posted refund "+t.id+" belongs to a voided expense");
      const refunded=refundTotals.get(t.refundOf)||0;
      if(parent&&refunded>Math.abs(Number(parent.postings?.[0]?.amt)||0)+0.02) issues.push("Refunds exceed original expense "+parent.id);
    }
    const postingAcct=t.postings?.[0]?.acct?acct(t.postings[0].acct):null;
    if(postingAcct&&postingAcct.type==="forex"&&!t.forexAcct) issues.push("Transaction "+t.id+" posts to a Forex card without wallet metadata");
    if(t.forexAcct){
      const a=acct(t.forexAcct);
      if(!a) issues.push("Forex transaction references missing card "+t.forexAcct);
      else if(a.type!=="forex") issues.push("Transaction "+t.id+" points at non-Forex account");
      else if(!t.walletId||!(a.wallets||[]).some(w=>w.id===t.walletId)) issues.push("Forex transaction "+t.id+" references missing wallet");
      else{
        const w=a.wallets.find(x=>x.id===t.walletId);
        if(!["expense","refund"].includes(t.type)) issues.push("Unsupported Forex transaction type "+t.type+" on "+t.id);
        if(t.walletCur&&String(t.walletCur).toUpperCase()!==String(w.cur).toUpperCase()) issues.push("Forex transaction currency mismatch on "+t.id);
        if(t.postings?.[0]?.acct!==a.id) issues.push("Forex transaction posting account mismatch on "+t.id);
        const postingAmount=Math.abs(Number(t.postings?.[0]?.amt)||0);
        if(!Number.isFinite(Number(t.amount))||Math.abs(Number(t.amount)-postingAmount)>0.02) issues.push("Forex transaction amount mismatch on "+t.id);
        if(String(t.postings?.[0]?.cur||"").toUpperCase()!==String(w.cur).toUpperCase()) issues.push("Forex posting currency mismatch on "+t.id);
        if(t.type==="expense"&&Number(t.postings?.[0]?.amt)>=0) issues.push("Forex expense posting must be negative on "+t.id);
        if(t.type==="refund"&&Number(t.postings?.[0]?.amt)<=0) issues.push("Forex refund posting must be positive on "+t.id);
      }
    }
  }

  for(const p of (S.purchases||[])){
    if(!p.txnId) continue;
    const parent=txnById.get(p.txnId);
    if(!parent) issues.push("Purchase "+(p.item||p.id)+" references a missing transaction");
    else if(parent.type!=="expense") issues.push("Purchase "+(p.item||p.id)+" is linked to a non-expense transaction");
    else if(!!p.txnVoided!==(parent.status!=="posted")) issues.push("Purchase "+(p.item||p.id)+" warranty status does not match its linked expense");
  }
  for(const t of S.txns){
    if(ids.has(t.id)) issues.push("Duplicate ID "+t.id); ids.add(t.id);
    if(!Array.isArray(t.postings)) issues.push("Transaction has no postings");
    for(const p of (t.postings||[])) if(!acct(p.acct)) issues.push("A transaction points at a missing account");
    if(t.fxRate!=null&&!(Number(t.fxRate)>0)) issues.push("Invalid historical FX rate on "+t.id);
    if(t.type==="transfer" && t.postings.length!==2) issues.push("Transfer without two sides");
    if(t.type!=="transfer" && t.type!=="open" && t.type!=="adjust" && t.type!=="adjustment" && t.postings.length!==1) issues.push("Unexpected postings on "+t.type);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(t.date)) issues.push("Bad date on a transaction");
  }
  openSheet(`<h2 style="margin-top:0">${issues.length?"Problems found":"All good"}</h2>
  <p class="muted">${S.txns.length} transactions, ${S.accounts.length} accounts and ${S.lending.length} lending records checked.</p>
  ${issues.length?`<ul>${[...new Set(issues)].map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:""}
  <button class="btn alt" data-close>Close</button>`);
}

function download(name, text, type){

}
async function exportJSON(){
  const filename=`finance-backup-${today()}.enc`, encrypted=await seal(S);
  try{
    const h=await backupHandleGet();

      // Directory handles expose getFileHandle; createWritable is only on file handles.
      const permission=await backupPermission(h,true);
      if(permission==="granted" && typeof h.getFileHandle==="function"){
        const file=await h.getFileHandle(filename,{create:true});
        const writable=await file.createWritable();
        try{
          await writable.write(new Blob([encrypted],{type:"application/octet-stream"}));
          await writable.close();
        }catch(err){
          try{await writable.abort();}catch(_){}
          throw err;
        }
        toast("Encrypted backup saved to "+(h.name||"selected folder"));
        await backupDestinationStatus();

      }

  }catch(err){
    console.warn("Folder backup failed; fallback download",err);
    toast("Folder save failed ("+(err&&err.message?err.message:"error")+"). Downloading instead.");
  }

}
function csvSafeText(value){

    const originalAccount=originalTxn&&originalTxn.postings&&originalTxn.postings[0]?(acct(originalTxn.postings[0].acct)||{}).name||"":(acct(l.account)||{}).name||"";
    const events=[{
      date:l.start||"",order:0,created:l.created||"",event:l.direction==="lent"?"Original amount lent":"Original amount borrowed",principal:csvNum(l.principal),
      interest:0,account:originalAccount,status:"Recorded",
      note:l.note||""
    }];
    for(const t of (S.txns||[])){
      if(t.status!=="posted"||t.loanId!==l.id) continue;
      const accountName=t.postings&&t.postings[0]?(acct(t.postings[0].acct)||{}).name||"":"";
      if(Number(t.principalReduction)>0){
        events.push({
          date:t.date||l.start||"",order:1,created:t.created||"",event:l.direction==="lent"?"Principal repayment received":"Principal repayment paid",
          principal:csvNum(t.principalReduction),interest:0,account:accountName,
          status:"Posted",note:t.note||""
        });
      }
      if(t.interestSettlement){
        const paid=Math.abs(Number(t.postings&&t.postings[0]&&t.postings[0].amt)||0);
        events.push({
          date:t.date||l.start||"",order:2,created:t.created||"",event:l.direction==="lent"?"Interest received":"Interest paid",
          principal:0,interest:csvNum(paid),account:accountName,
          status:"Posted",note:t.note||""
        });
      }
    }
    for(const a of (l.interestAdjustments||[])){
      if(a.date&&a.date>asOf) continue;
      const amount=csvNum(a.amount);
      events.push({
        date:a.date||l.start||"",order:3,created:a.created||"",event:amount<0?"Interest waiver / reduction":"Interest added / agreed adjustment",
        principal:0,interest:amount,account:"",
        status:"Adjustment",note:a.note||""
      });
    }
    events.sort((a,b)=>String(a.date).localeCompare(String(b.date))||a.order-b.order||String(a.created).localeCompare(String(b.created)));
    for(const e of events){
      ledger.push([l.person||"",l.direction==="lent"?"Lent":"Borrowed",l.cur||"",l.start||"",csvNum(l.principal),e.date,e.event,e.principal,e.interest,e.account,e.status,asOf,e.note]);
    }
  }
  return {summary,ledger,loanCount:loans.length,asOf};
}
function cleanShareText(value){
  return String(value==null?"":value)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,"")
    .replace(/[\u200B-\u200F\u202A-\u202E\u2060\uFEFF]/g,"")
    .replace(/\uFFFD/g,"")
    .replace(/ï»¿/g,"").replace(/â€™/g,"’").replace(/â€œ/g,"“").replace(/â€\u009d/g,"”")
    .replace(/â€“/g,"–").replace(/â€”/g,"—").replace(/Â(?=\s|$)/g,"")
    .trim();
}
function buildLendingPdfHtml(rows, kind, asOf, summaryRows){

    const closing=summaryBody.map(r=>`<tr><td>${escHtml(r[0])}</td><td>${escHtml(r[1])}</td><td>${escHtml(r[2])}</td><td class="num">${escHtml(money(r[6],r[2]))}</td><td class="num">${escHtml(money(r[11],r[2]))}</td><td class="num strong">${escHtml(money(r[12],r[2]))}</td></tr>`).join("");
    table+=`<section class="closing"><h2>Closing balance by loan</h2><table><thead><tr><th>Person</th><th>Direction</th><th>Currency</th><th>Principal outstanding</th><th>Interest outstanding</th><th>Total outstanding</th></tr></thead><tbody>${closing}</tbody></table></section>`;
  }
  return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title} · ${escHtml(asOf)}</title><style>
  *{box-sizing:border-box}html{print-color-adjust:exact;-webkit-print-color-adjust:exact}body{font:10px/1.4 Arial,Helvetica,sans-serif;color:#20242b;margin:0;background:#fff}
  header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #263445;padding:0 0 10px;margin-bottom:14px}h1{font-size:21px;margin:0 0 3px}h2{font-size:13px;margin:0 0 7px;color:#263445}p{margin:0;color:#606975}.meta{text-align:right;color:#606975}.section-note{margin:0 0 8px;font-size:9px}

  </style></head><body><header><div><h1>${title}</h1><p>Prepared from your Finance Tracker · ${isSummary?"Portfolio overview":"Transaction history and closing balances"}</p></div><div class="meta">Report date<br><strong>${escHtml(asOf)}</strong></div></header>${summaryHtml}${isSummary?"<h2>Individual lending records</h2>":"<h2>Transaction history</h2>"}${table}<footer>Private financial information · Generated locally in your browser · Amounts are not combined across currencies</footer></body></html>`;
}

function exportLendingCSV(kind, fixedLoanId){
  const selected=$("#lendExportScope")?.value||"all";
  let scope=selected;
  if(fixedLoanId) scope={type:"loan",loanId:fixedLoanId};
  else if(typeof selected==="string"&&selected.startsWith("loan:")) scope={type:"loan",loanId:selected.slice(5)};

  if(scope&&typeof scope==="object"&&scope.type==="loan") rawSuffix="loan-statement";
  else if(typeof scope==="string"&&scope==="lent") rawSuffix="money-lent";
  else if(typeof scope==="string"&&scope==="borrowed") rawSuffix="money-borrowed";
  else if(typeof scope==="string"&&scope.startsWith("person:")) rawSuffix="person-"+((filterLendingForExport(scope)[0]||{}).person||"lending");
  const suffix=String(rawSuffix).normalize("NFKD").replace(/[^a-z0-9-]+/gi,"-").replace(/^-+|-+$/g,"").toLowerCase();
  download(`lending-${isSummary?"summary":"ledger"}-${suffix}-${rows.asOf}.csv`,"\uFEFF"+csv,"text/csv;charset=utf-8");
  toast((isSummary?"Lending summary":"Lending ledger")+" exported");
}

async function openBackupPayload(raw, password){
  if(backupTooLarge(raw)) return {ok:false, error:"That backup is too large."};
  let parsed;
  try{ parsed=JSON.parse(raw); }
  catch(e){ return {ok:false, error:"That file is not a My Finance backup."}; }
  if(parsed && parsed.enc){
    if(!password) return {ok:false, needsPassword:true, error:"Enter the backup passphrase."};
    const checked=inspectEncryptedEnvelope(parsed);
    if(!checked.ok) return {ok:false,error:checked.error};
    try{
      const key=await deriveKey(password, checked.salt, checked.iterations, false);
      const data=await unseal(parsed, key);
      return {ok:true, data, key, salt:checked.salt, iter:checked.iterations, bio:parsed.bio||null, password, encrypted:true};
    }catch(e){
      return {ok:false, error:"Wrong passphrase, or the backup is damaged."};
    }
  }
  return {ok:true, data:parsed, encrypted:false};
}
function vaultShapeOk(d){
  return !!(d && [1,2].includes(d.v) && Array.isArray(d.accounts) && Array.isArray(d.txns) && !vaultHasUnsafeId(d));
}
async function commitRestore(decoded){
  const prev={S, CK, SALT, KDF_ITER, BIO, notice:unlockNotice};
  try{
    S=decoded.data;
    if(decoded.encrypted && decoded.key){
      CK=decoded.key; SALT=decoded.salt; KDF_ITER=decoded.iter; BIO=decoded.bio||null;
      if(KDF_ITER<600000){
        const hadBio=!!decoded.bio;
        SALT=crypto.getRandomValues(new Uint8Array(16));
        KDF_ITER=600000;
        CK=await deriveKey(decoded.password, SALT, KDF_ITER, false);
        BIO=null;
        unlockNotice=hadBio
          ? "Backup restored and re-encrypted. Fingerprint unlock was turned off — enable it again under More."
          : "Backup restored and re-encrypted with a stronger key.";
      }
    }
    migrate();
    const ok=await save();
    if(!ok) throw new Error("The restored vault could not be stored on this phone.");
    return {ok:true};
  }catch(err){
    S=prev.S; CK=prev.CK; SALT=prev.SALT; KDF_ITER=prev.KDF_ITER; BIO=prev.BIO;
    unlockNotice=prev.notice||"";
    try{ store.abandonUnpersisted(); }catch(e){}
    return {ok:false, error:(err&&err.message)||"Restore failed."};
  }
}

      accountNumber:rawNum,
      accountMasked:rawNum?(rawNum.length>4?"••••"+rawNum.slice(-4):"••••"):"",
      owner:($("#aowner").value.trim()||"Me"),type,cur:$("#ac").value,opening:o,archived:false};
    if(type==="bank"){
      const last4=($("#adlast4")?.value||"").replace(/\D/g,"").slice(-4);
      const expAd=readExpiryField("adexpiry",{allowPast:false}); if(!expAd.ok){alert(expAd.error);return;} const expiry=expAd.value;
      if(last4 || expiry || ($("#adnetwork")?.value||"").trim()){
        a.cardMeta={last4, network:($("#adnetwork")?.value||"").trim(), cardType:"Debit", expiry, annualFee:0};
      }
    }
    if(type==="card"){
      const last4=(($("#clast4")?.value)||"").replace(/\D/g,"").slice(-4);
      const expC=readExpiryField("cexpiry",{allowPast:false}); if(!expC.ok){alert(expC.error);return;} const expiry=expC.value;
      const fee=rejectAmt($("#cfee")?.value||"",{required:false,allowNegative:false,maxDecimals:2});
      const limit=rejectAmt($("#climit")?.value||"",{required:false,allowNegative:false,maxDecimals:2});
      const stmt=readCalendarDay($("#cstmt")?.value);
      const dueDay=readCalendarDay($("#cdue")?.value);
      if(fee==null||limit==null) return;
      if(!stmt.ok){ alert(stmt.error); return; }
      if(!dueDay.ok){ alert(dueDay.error); return; }
      a.cardMeta={last4, network:($("#cnetwork")?.value||"").trim(), cardType:($("#ctype")?.value||"").trim(), expiry, annualFee:fee};
      a.limit=limit;
      a.stmtDay=stmt.value; a.dueDay=dueDay.value;
      a.linkedBankId=($("#clinked")?.value)||"";
    }
    S.accounts.push(a); if(!S.people.includes(a.owner))S.people.push(a.owner); log("account",a.id); save(); closeSheet(); render(); toastSaved(type==="card"?"Credit card added":"Account added");
  }
});

function boot(){
  S=null; CK=null;
  document.body.classList.add("locked");
  let env=null, legacy=null;
  try{ const d=JSON.parse(store.get()); if(d&&d.enc) env=d; else if(d&&d.v===1) legacy=d; }catch(e){}
  const bootEnvelopeCheck=env?inspectEncryptedEnvelope(env):null;
  BIO=env?.bio||null;KDF_ITER=bootEnvelopeCheck?.ok?bootEnvelopeCheck.iterations:(env?.iterations||250000);
  $("#nav").innerHTML="";$("#layer").innerHTML="";
  $("#app").innerHTML=`<div style="padding-top:42px;position:relative">
  <button type="button" data-releases title="Release notes" style="position:absolute;top:8px;right:0;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;padding:4px 2px;opacity:.85">v${esc(APP_VERSION)}</button>
  <div class="big" style="font-size:28px">My Finance</div>
  <p class="muted">${env?"Your encrypted finance vault is locked.":"Create a strong passphrase. It encrypts your data on this phone and in backup files."}</p>
  <form id="pf"><input id="pp" type="password" autocomplete="current-password" placeholder="Passphrase" required>${env?"":`<input id="pp2" type="password" autocomplete="new-password" placeholder="Repeat passphrase" style="margin-top:8px">`}<div id="pe" class="out" style="margin-top:8px"></div><button class="btn" type="submit">${env?"Unlock with passphrase":"Create secure vault"}</button></form>
  ${env?.bio?`<button class="btn alt" data-bio-unlock>Use fingerprint / device passkey</button>`:""}
  <div class="security-note" style="margin-top:18px">Encryption: AES-256-GCM. Passphrase key derivation: PBKDF2-HMAC-SHA-256. Never share your passphrase. If you lose it and have no working biometric unlock, encrypted data cannot be recovered.</div>
  </div>`;
  $("#pf").onsubmit=async e=>{
    e.preventDefault();
    const p=$("#pp").value, er=m=>{$("#pe").textContent=m;};
    const btn=e.target.querySelector('button[type="submit"]');
    if(btn){ btn.disabled=true; btn.textContent="Unlocking…"; }
    try{
      if(!p) return er("Enter your passphrase.");
      if(env){
        if(!bootEnvelopeCheck?.ok) return er(bootEnvelopeCheck?.error||"The encrypted vault metadata is invalid. Your stored vault has not been changed.");
        SALT=bootEnvelopeCheck.salt;
        const k=await deriveKey(p,SALT,KDF_ITER);
        try{
          S=await unseal(env,k);
        }catch(decErr){
          S=null; CK=null;
          return er("Wrong passphrase (or vault data is damaged). Fingerprint unlock may still work if enabled.");
        }
        CK=k; BIO=env.bio||null;
        if(KDF_ITER<600000){
          const hadBio=!!(env.bio||BIO);
          const prevSalt=SALT, prevKey=CK, prevIter=KDF_ITER, prevBio=BIO;
          try{
            const ns=crypto.getRandomValues(new Uint8Array(16)), nk=await deriveKey(p,ns,600000);
            SALT=ns; CK=nk; KDF_ITER=600000; BIO=null;
            store.set(await seal(S));
            unlockNotice=hadBio
              ? "Security update: vault re-encrypted. Fingerprint unlock was turned off — enable it again under More."
              : "Security update: vault re-encrypted with a stronger key.";
          }catch(upErr){
            SALT=prevSalt; CK=prevKey; KDF_ITER=prevIter; BIO=prevBio;
            try{ store.abandonUnpersisted(); }catch(e){}
            console.warn("kdf upgrade failed", upErr);
            unlockNotice="A security update could not be stored. Your existing vault and passphrase are unchanged.";
          }
        }
      }else{
        if(p.length<12) return er("Use at least 12 characters. A unique multi-word passphrase is best.");
        if(p!==$("#pp2").value) return er("The two passphrases differ.");
        SALT=crypto.getRandomValues(new Uint8Array(16)); KDF_ITER=600000;
        CK=await deriveKey(p,SALT,KDF_ITER); S=legacy||blank(); BIO=null;
      }
      // Safe migration: work on a copy. If it fails, keep the original encrypted vault untouched.
      const originalS = JSON.parse(JSON.stringify(S));
      let migrated = false;
      try{
        migrate();
        // Basic post-migrate validation
        if(!Array.isArray(S.accounts) || !Array.isArray(S.txns)) throw new Error("Invalid state after migration");
        for(const a of S.accounts){
          if(a._forexMigrateProblems && a._forexMigrateProblems.length){
            throw new Error("Forex wallet data could not be migrated safely: "+a._forexMigrateProblems.join(", "));
          }
        }
        migrated = true;
      }catch(mErr){
        console.error("Migration failed — original vault preserved", mErr);
        S = originalS;
        unlockNotice = "Migration failed. Your existing vault was not changed. "+(mErr&&mErr.message||"");
        // Do not run automations or save a partial state
      }
      if(migrated){
        try{ const auto=processDueAutomations(); toastAutomations(auto); }catch(aErr){ console.warn(aErr); }
        try{ save(); }catch(sErr){ console.warn(sErr); }
      }
      document.body.classList.remove("locked");
      render();
      resetIdleLock();
      if(unlockNotice){ const note=unlockNotice; unlockNotice=""; setTimeout(()=>toast(note), 700); }
    }catch(x){
      S=null; CK=null; document.body.classList.add("locked");
      er("Could not unlock: "+(x&&x.message?x.message:"unknown error"));
    }finally{
      if(btn){ btn.disabled=false; btn.textContent=env?"Unlock with passphrase":"Create secure vault"; }
    }
  };
}

let hidAt=0, idleTimer=null, lastActivityAt=0, lockPending=false;
const IDLE_LOCK_MS=15*60*1000;
function lockActiveSession(){
  if(!S||!CK||lockPending) return;
  lockPending=true;
  if(idleTimer){ clearTimeout(idleTimer); idleTimer=null; }
  closeSheet();
  chain=chain.then(()=>{ S=null; CK=null; boot(); }).finally(()=>{ lockPending=false; });
}
function resetIdleLock(){
  if(!S||!CK) return;
  lastActivityAt=Date.now();
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{
    if(!S||!CK) return;
    const elapsed=Date.now()-lastActivityAt;
    if(elapsed>=IDLE_LOCK_MS) lockActiveSession();
    else resetIdleLock();
  },IDLE_LOCK_MS+25);
}
["pointerdown","keydown","touchstart","input","change","wheel","scroll"].forEach(type=>document.addEventListener(type,()=>resetIdleLock(),true));
document.addEventListener("visibilitychange",()=>{
  if(!S) return;
  if(document.hidden){ hidAt=Date.now(); return; }
  const wasAway=hidAt>0 && Date.now()-hidAt>120000;
  hidAt=0;
  if(wasAway) lockActiveSession(); else resetIdleLock();
});
