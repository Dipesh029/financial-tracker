<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4fd8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<title>My Finance</title>
<style>
:root{
  --bg:#f0f2f6; --card:#ffffff; --ink:#121a24; --muted:#6b7785; --line:#e2e7ee;
  --accent:#2f4fd8; --accent-ink:#fff; --in:#0f7a4f; --out:#c0392b; --warn:#a16207;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 12px rgba(16,24,40,.04);
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1319; --card:#171e27; --ink:#e9eef4; --muted:#8b98a8; --line:#2a3441;
    --accent:#7d93ff; --accent-ink:#0b1020; --in:#3dca8c; --out:#ff8a80; --warn:#e3b341;
    --shadow:0 1px 2px rgba(0,0,0,.25), 0 6px 16px rgba(0,0,0,.2); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:14px 16px 20px}
h1{font-size:13px;font-weight:600;color:var(--muted);margin:4px 0 2px;letter-spacing:.02em}
h2{font-size:15px;font-weight:650;margin:20px 0 8px;letter-spacing:-.01em}
.big{font-size:36px;font-weight:720;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px;margin:8px 0;box-shadow:var(--shadow)}
.card.tap{cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.card.tap:active{transform:scale(.985)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row+.row{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.muted{color:var(--muted);font-size:13px}
.in{color:var(--in)} .out{color:var(--out)} .warn{color:var(--warn)}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 2px;font-size:12px;border-radius:9px;font:inherit;font-weight:650;transition:background .15s var(--ease),color .15s var(--ease)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;z-index:5;
  padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:10px 0;border-radius:10px;transition:color .15s var(--ease)}
nav button.on{color:var(--accent)}
nav .add{flex:0 0 56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  font-size:30px;line-height:1;margin-top:-28px;box-shadow:0 6px 18px rgba(47,79,216,.35);font-weight:400;
  transition:transform .15s var(--ease)}
nav .add:active{transform:scale(.94)}
.sheet-bg{position:fixed;inset:0;background:rgba(8,12,20,.48);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  animation:fadeIn .18s var(--ease)}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:92vh;overflow:auto;
  animation:sheetUp .28s var(--ease);
  box-shadow:0 -8px 40px rgba(0,0,0,.18)}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:99px;background:var(--line);margin:2px auto 12px}
@keyframes sheetUp{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .sheet,.sheet-bg,.card.tap,nav .add,.seg button,.btn,.chip{animation:none!important;transition:none!important}
}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px;letter-spacing:.01em}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.amt{font-size:40px;font-weight:720;text-align:center;padding:16px 12px;letter-spacing:-.02em;border-radius:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:active{transform:scale(.97)}
.amt-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 4px}
.amt-chips .chip{padding:7px 12px;font-size:12px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);margin-top:14px;
  transition:transform .12s var(--ease),opacity .12s var(--ease);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn:active{transform:scale(.985);opacity:.92}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line);margin-top:10px;box-shadow:none}
.btn.danger{background:var(--bg);color:var(--out);border:1px solid var(--line);box-shadow:none}
.btn.small{font-size:13px;padding:8px 12px;width:auto;margin:0;border-radius:10px;box-shadow:none}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .empty-title{font-size:17px;font-weight:650;color:var(--ink);margin-bottom:6px}
.empty p{margin:0 0 14px;font-size:14px;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:30;display:flex;gap:14px;align-items:center;
  box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fadeIn .2s var(--ease);max-width:min(92vw,420px)}
.toast button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;filter:brightness(1.35)}
.void{opacity:.5;text-decoration:line-through}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s var(--ease)}
.bar.warn i{background:var(--warn)}
.bar.out i{background:var(--out)}
.bar.in i{background:var(--in)}
.hero{padding:6px 2px 4px}
.hero .big{margin:4px 0}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow)}
.metric span{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.metric b{font-size:17px;font-weight:700}
.quick-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 4px}
.quick-grid button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 8px;font:inherit;font-size:13px;font-weight:650;box-shadow:var(--shadow)}
.quick-grid button:active{transform:scale(.97)}
.chart{width:100%;height:auto;display:block}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.home-filter{margin:4px 0 10px}
.home-filter select{padding:10px 12px}
.security-note{font-size:12px;color:var(--muted);line-height:1.5}
.due-pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.due-pill.over{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.limit-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="layer"></div>

<script>
"use strict";
/* ---------- storage (stays on this phone; nothing is sent anywhere) ---------- */
const KEY = "myfinance.v1";
const APP_VERSION = "1.4.5";
const RELEASES = [
  {v:"1.4.5", d:"2026-11-15", notes:"Restore encryption helpers (deriveKey, seal, unseal, save, migrate) so unlock works again."},
  {v:"1.4.4", d:"2026-11-15", notes:"Fix blank screen: restore missing vault state globals (S, CK, BIO, SALT)."},
  {v:"1.4.3", d:"2026-11-15", notes:"Folder backup write path fixed (directory getFileHandle); clearer permission and fallback messages."},
  {v:"1.4.2", d:"2026-11-15", notes:"Optional linked debit card (last4, network, expiry) when adding a bank account; Debit in card type; expiry on Due soon."},
  {v:"1.4.1", d:"2026-11-15", notes:"Bank account number / IBAN on own and family accounts (add, edit, masked display, copy)."},
  {v:"1.4.0", d:"2026-11-15", notes:"UI polish: motion, clearer hierarchy, amount quick-chips, card limit bars, debounced search, stronger empty and overdue states."},
  {v:"1.3.0", d:"2026-11-15", notes:"SIP paid/missed ledger with history; stronger due-soon strip (SIPs, card bills, premiums); release notes robust on unlock."},
  {v:"1.2.1", d:"2026-11-15", notes:"Compact version control on unlock and home (corner, small). Tap v… for release notes."},
  {v:"1.2.0", d:"2026-11-15", notes:"Fixed release notes; unlock screen version; full credit-card fields on add account; richer MF/stock future projection with year chart; more investment visuals"},
  {v:"1.1.1", d:"2026-11-15", notes:"Service worker network-first for HTML so updates show after deploy"},
  {v:"1.1.0", d:"2026-11-15", notes:"Historical holdings, stock import owner, set balance, copy recipient details, investment returns & projections"},
  {v:"1.0.0", d:"2026-11", notes:"Local encrypted vault, accounts, transfers, stocks/MF, SIPs, lending, backup location"}
];
const EXPENSE_CATS = ["Groceries","Rent / housing","Utilities","Transport","Dining out","Shopping","Health","Insurance premium","Travel","Subscriptions","Education","Taxes","Bank fees","Gifts","Other"];
const INCOME_CATS = ["Salary","Interest","Rental income","Business","Gift received","Other income"];
const mem = {};
const store = {
  get(){ try{ return localStorage.getItem(KEY); }catch(e){ return mem[KEY] || null; } },
  set(v){ try{ localStorage.setItem(KEY, v); }catch(e){ mem[KEY] = v; } }
};

/* Optional encrypted-backup destination. The vault data remains in existing encrypted storage. */
const BACKUP_DB="myfinance.backup-destination", BACKUP_STORE="handles", BACKUP_HANDLE_KEY="directory";
function backupDb(){return new Promise((resolve,reject)=>{if(!("indexedDB" in window))return reject(new Error("IndexedDB unavailable"));const req=indexedDB.open(BACKUP_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(BACKUP_STORE))req.result.createObjectStore(BACKUP_STORE);};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error("Backup settings storage unavailable"));});}
async function backupHandleGet(){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readonly"),req=tx.objectStore(BACKUP_STORE).get(BACKUP_HANDLE_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();});}
async function backupHandleSet(handle){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readwrite");tx.objectStore(BACKUP_STORE).put(handle,BACKUP_HANDLE_KEY);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};tx.onabort=()=>{db.close();reject(tx.error);};});}
async function backupHandleForget(){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readwrite");tx.objectStore(BACKUP_STORE).delete(BACKUP_HANDLE_KEY);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};});}
async function backupPermission(handle,request=false){if(!handle)return "missing";try{if(!handle.queryPermission)return "unsupported";let p=await handle.queryPermission({mode:"readwrite"});if(p!=="granted"&&request&&handle.requestPermission)p=await handle.requestPermission({mode:"readwrite"});return p;}catch(e){return "denied";}}
async function backupDestinationStatus(){
  const node=$("#backupFolderStatus"); if(!node) return;
  if(!("showDirectoryPicker" in window)){
    node.textContent="Folder picker not available on this browser/device. Save backup file uses Downloads.";
    return;
  }
  try{
    const h=await backupHandleGet();
    if(!h){ node.textContent="No folder selected yet. Choose a folder, then Save backup file writes the .enc there."; return; }
    const p=await backupPermission(h,false);
    const name=h.name||"Device folder";
    if(p==="granted") node.textContent="Selected: "+name+" · Ready (Save backup file writes here)";
    else if(p==="prompt") node.textContent="Selected: "+name+" · Will ask permission on next save";
    else node.textContent="Selected: "+name+" · Permission lost — choose the folder again";
  }catch(e){
    node.textContent="Could not read folder preference. Download backup still works.";
  }
}
async function chooseBackupFolder(){
  if(!("showDirectoryPicker" in window)){
    toast("Folder picker not supported in this browser. Use Save backup file (Downloads).");
    return;
  }
  try{
    const h=await window.showDirectoryPicker({mode:"readwrite",id:"myfinance-backup"});
    // Verify we can create a file handle API on this handle
    if(typeof h.getFileHandle!=="function"){
      alert("This browser selected a folder but cannot write files into it. Backups will use download.");
      return;
    }
    const perm=await backupPermission(h,true);
    if(perm!=="granted"){
      alert("Write permission was not granted for that folder. Try again and allow access when prompted.");
      return;
    }
    await backupHandleSet(h);
    await backupDestinationStatus();
    toast("Backup folder ready: "+(h.name||"folder"));
  }catch(e){
    if(e&&e.name==="AbortError")return;
    alert("Could not select backup folder: "+(e&&e.message?e.message:e));
  }
}
/* ---------- encryption & vault helpers ---------- */
const blank=()=>({v:2,rate:104.16,display:"INR",accounts:[],holdings:[],sips:[],policies:[],purchases:[],snaps:[],history:[],lending:[],bankContacts:[],people:["Me","Father","Mother"],txns:[],audit:[],lastAcct:null});
const LBL={adjust:"Portfolio sync · ",open:"Opening position · ",refund:"Refund · ",buy:"Bought ",sell:"Sold ",lend:"Lent to ",lendback:"Repaid by ",borrow:"Borrowed from ",repay:"Repaid to "};
const isSecureContext = window.isSecureContext === true;
function b64(u){let t=""; for(const x of new Uint8Array(u)) t+=String.fromCharCode(x); return btoa(t);}
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function deriveKey(p, salt, iterations=KDF_ITER, extractable=false){
  const m = await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations, hash:"SHA-256"}, m, {name:"AES-GCM", length:256}, extractable, ["encrypt","decrypt"]);
}
async function seal(o){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, CK, new TextEncoder().encode(JSON.stringify(o)));
  return JSON.stringify({enc:2, salt:b64(SALT), iterations:KDF_ITER, iv:b64(iv), data:b64(ct), bio:BIO||null});
}
async function unseal(env, key){
  const ct = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(env.iv)}, key, unb64(env.data));
  return JSON.parse(new TextDecoder().decode(ct));
}
function save(){ if(!CK||!S) return; chain=chain.then(async()=>store.set(await seal(S))).catch(err=>console.warn("save failed",err)); }
function migrate(){
  for(const k of ["accounts","holdings","sips","policies","purchases","snaps","history","lending","bankContacts","people","txns","audit"]) S[k]=S[k]||[];
  S.v=2;
  if(S.rate==null) S.rate=104.16;
  if(!S.display) S.display="INR";
  for(const a of S.accounts){
    a.owner=a.owner||"Me"; a.bank=a.bank||""; a.ifsc=a.ifsc||""; a.branchCode=a.branchCode||""; a.branch=a.branch||"";
    a.accountNumber=a.accountNumber||""; a.accountMasked=a.accountMasked||"";
  }
  if(!Array.isArray(S.people)||!S.people.length) S.people=["Me","Father","Mother"];
  for(const h of S.holdings){
    h.owner=h.owner||"Me"; h.folio=h.folio||""; h.isin=h.isin||""; h.symbol=h.symbol||"";
    h.exchange=h.exchange||""; h.demat=h.demat||""; h.broker=h.broker||""; h.amc=h.amc||""; h.notes=h.notes||"";
  }
  for(const x of S.sips){ x.status=x.status||"active"; x.history=x.history||[]; }
  for(const t of S.txns){
    if(t.fxRate==null) t.fxRate=S.rate||104.16;
    if(!t.owner&&t.postings?.[0]) t.owner=(S.accounts.find(a=>a.id===t.postings[0].acct)||{}).owner||"Me";
  }
}
function nextDue(day){
  const t=today();
  const mk=(ym,d)=>{const [y,m]=ym.split("-").map(Number); const last=new Date(y,m,0).getDate(); return y+"-"+String(m).padStart(2,"0")+"-"+String(Math.min(d,last)).padStart(2,"0");};
  let c=mk(t.slice(0,7),day);
  if(daysTo(c)<0) c=mk(addM(t.slice(0,8)+"01",1).slice(0,7),day);
  return c;
}

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)); }
function log(action, id){ S.audit.push({ts:new Date().toISOString(), action, id}); }
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };

/* ---------- money ---------- */
const fmt = (n,cur) => new Intl.NumberFormat(cur==="INR"?"en-IN":"nl-NL",{style:"currency",currency:cur,maximumFractionDigits:2}).format(n||0);
const toDisplay = (n,cur) => cur===S.display ? n : (cur==="EUR" ? n*S.rate : n/S.rate);
const toDisplayAt = (n,cur,rate) => cur===S.display ? n : (cur==="EUR" ? n*(rate||S.rate) : n/(rate||S.rate));
const parseAmt = v => { const n = parseFloat(String(v).replace(/,/g,".").replace(/[^0-9.]/g,"")); return isFinite(n)?n:0; };
const acct = id => S.accounts.find(a=>a.id===id);

/* ---------- ledger: every transaction = balanced postings; balances are derived ---------- */
function balance(a){
  let b = a.opening || 0;
  for(const t of S.txns){ if(t.status!=="posted") continue; for(const p of t.postings) if(p.acct===a.id) b += p.amt; }
  return Math.round(b*100)/100;
}
function holdPos(h){let u=0,c=0;for(const t of S.txns){if(t.status!=="posted"||t.hold!==h.id)continue;if(t.type==="buy"||t.type==="open"||t.type==="adjust"){u+=t.units;c+=t.cost;}else if(t.type==="sell"){const f=u?Math.min(1,t.units/u):0;c-=c*f;u-=t.units;}}return{u:Math.round(u*1e6)/1e6,c:Math.round(c*100)/100,v:Math.round(u*(h.price||0)*100)/100};}
function personPos(owner){const m={};for(const t of S.txns){if(t.status==="posted"&&t.person&&t.pd&&t.postings?.[0]&&(!owner||t.owner===owner))m[t.person]=(m[t.person]||0)+toDisplayAt(t.pd,t.postings[0].cur,t.fxRate);}return m;}
function monthKey(d){ return d.slice(0,7); }
function monthTotals(m,owner){
  let inc=0, exp=0;
  for(const t of S.txns){
    if(t.status!=="posted" || monthKey(t.date)!==m || (owner&&t.owner!==owner)) continue;
    if(t.type==="income") inc += toDisplayAt(t.postings[0].amt, t.postings[0].cur,t.fxRate);
    if(t.type==="expense") exp += toDisplayAt(-t.postings[0].amt, t.postings[0].cur,t.fxRate);
    if(t.type==="refund") exp -= toDisplayAt(t.postings[0].amt, t.postings[0].cur,t.fxRate);
  }
  return {inc,exp};
}
function addTxn(t){ t.id=uid(); t.status="posted"; t.created=new Date().toISOString(); if(t.fxRate==null)t.fxRate=S.rate; if(!t.owner&&t.postings?.[0])t.owner=(acct(t.postings[0].acct)||{}).owner||"Me"; S.txns.push(t); log("create",t.id); save(); return t; }
function voidTxn(id){ const t=S.txns.find(x=>x.id===id); if(t){ t.status="voided"; log("void",id); save(); } }
function unvoid(id){ const t=S.txns.find(x=>x.id===id); if(t){ t.status="posted"; log("restore",id); save(); } }

/* ---------- app state (vault) ---------- */

function netWorth(owner){
  let assets=0,owed=0;
  for(const a of S.accounts){if(a.archived||(owner&&a.owner!==owner))continue;const b=toDisplay(balance(a),a.cur);if(b>=0)assets+=b;else owed+=-b;}
  for(const h of S.holdings){if(owner&&h.owner!==owner)continue;assets+=toDisplay(holdPos(h).v,h.cur);}
  for(const v of Object.values(personPos(owner))){if(v>=0)assets+=v;else owed+=-v;}
  return {assets,owed,total:assets-owed};
}
function historyHtml(owner){const hs=(S.history||[]).filter(x=>owner?x.owner===owner:!x.owner).slice(-12).reverse();return `<h2>Net worth history</h2><div class="card">${hs.length?hs.map(x=>`<div class="row"><span>${esc(x.date)}</span><b class="num">${fmt(toDisplayAt(x.value,x.cur||S.display,x.fxRate||S.rate),S.display)}</b></div>`).join(""):`<div class="muted">No saved snapshots yet for this view.</div>`}<button class="btn alt" data-snapshot>Save this month's snapshot</button></div>`;}
function investSummaryHtml(owner){
  let cost=0,val=0,n=0;
  for(const h of S.holdings){
    if(owner&&h.owner!==owner)continue;
    const p=holdPos(h); if(p.u<=0&&p.c<=0)continue;
    cost+=toDisplay(p.c,h.cur); val+=toDisplay(p.v,h.cur); n++;
  }
  if(!n) return "";
  const pl=val-cost, pct=cost>0?Math.round(pl/cost*1000)/10:0;
  const bar=cost>0?Math.min(100,Math.max(0,Math.round(val/Math.max(cost,val)*100))):0;
  return `<h2>Investments</h2><div class="card">
  <div class="row"><span>Holdings</span><b>${n}</b></div>

  <div class="row"><span>Current value</span><b class="num">${fmt(val,S.display)}</b></div>
  <div class="row"><span>Unrealized P/L</span><b class="num ${pl<0?"out":"in"}">${fmt(pl,S.display)} · ${pct}%</b></div>

}

function allocationHtml(owner){
  const parts=[];
  let cash=0,invest=0,receivable=0;
  for(const a of S.accounts){if(a.archived||(owner&&a.owner!==owner))continue;const v=toDisplay(balance(a),a.cur);if(v>0)cash+=v;}
  for(const h of S.holdings){if(owner&&h.owner!==owner)continue;const v=toDisplay(holdPos(h).v,h.cur);if(v>0)invest+=v;}
  for(const v of Object.values(personPos(owner)))if(v>0)receivable+=v;
  if(cash>0)parts.push(['Cash & accounts',cash]);if(invest>0)parts.push(['Investments',invest]);if(receivable>0)parts.push(['Money lent',receivable]);
  const total=parts.reduce((a,x)=>a+x[1],0);if(!total)return '';
  const colors=['var(--accent)','var(--in)','var(--warn)'];let offset=0;
  const seg=parts.map(([n,v],i)=>{const pct=v/total*100,el=`<span style="display:block;height:12px;width:${pct}%;background:${colors[i]}"></span>`;return {n,v,pct,el};});
  return `<h2>Asset mix</h2><div class="card"><div style="display:flex;overflow:hidden;border-radius:8px;gap:2px">${seg.map(x=>x.el).join('')}</div>${seg.map((x,i)=>`<div class="row"><span><i class="dot" style="background:${colors[i]}"></i>${x.n}</span><b class="num">${fmt(x.v,S.display)} · ${Math.round(x.pct)}%</b></div>`).join('')}</div>`;
}

function txnRow(t){
  const p=t.postings[0]||{amt:t.cost,cur:(S.holdings.find(h=>h.id===t.hold)||{}).cur||"INR"}, a=acct(p.acct);

  else { title=t.type in LBL?LBL[t.type]+esc(t.person||(S.holdings.find(h=>h.id===t.hold)||{}).name||t.cat||""):esc(t.cat||t.type); amt=(p.amt<0?"−":"+")+fmt(Math.abs(p.amt),p.cur); cls=p.amt<0?"out":"in"; }
  return `<div class="row ${t.status==="voided"?"void":""}" data-txn="${t.id}">

    <b class="${cls} num">${amt}</b></div>`;
}

<div class="card"><b>3. Friends / recipient bank accounts</b><p class="muted">Save a friend's account holder, bank, account number/IBAN, IFSC, branch, branch code and currency. Select a saved recipient while recording a transfer. This is a reference record; external transfers do not automatically update balances or contact banks.</p></div>
<div class="card"><b>4. Transactions</b><p class="muted">Record income, expenses and transfers. Transfers between your own accounts are balance movements, not income or expenses. You can edit ordinary transactions, record refunds, void and restore entries, export/import transaction CSV and reconcile account balances.</p></div>
<div class="card"><b>5. Investments and SIPs</b><p class="muted">Track mutual funds and stocks, owners, folios/identifiers, ISIN, units, cost and manually updated prices. Record buy/sell activity, import supported stock holdings files, and set SIP reminders. A SIP reminder never creates a transaction until you confirm the debit and units.</p></div>

<div class="card"><b>11. Important accounting behaviour</b><p class="muted">Credit-card purchases increase card liability and count as expenses. Paying a credit-card bill reduces bank balance and card liability; it is not a second expense. Own-account transfers are not income/expense. Loan principal is not income/expense. Reconciliation posts an adjustment rather than silently changing history.</p></div>
<button class="btn alt" data-close>Close guide</button>`;}

function doHolds(){
  const P=pendH; if(!P) return; const date=($("#hdate")||{}).value||today(), killMissing=!!($("#hmiss")&&$("#hmiss").checked);
  let added=0, changed=0, price=0, sold=0;
  for(const p of P.plan){ let H=p.H;
    if(!H){ H={id:uid(),name:p.it.sym,type:"stock",cur:"INR",isin:p.it.isin,sector:p.it.sec,price:p.it.prev,owner:(P.owner||"Me"),symbol:p.it.sym,exchange:"",demat:"",broker:"",amc:"",folio:"",notes:""}; S.holdings.push(H); if(!S.people.includes(H.owner))S.people.push(H.owner); added++; }
    else{ H.price=p.it.prev; if(!H.isin) H.isin=p.it.isin; if(p.it.sec) H.sector=p.it.sec; }
    if(p.kind==="new") addTxn({type:"open",date,note:"Imported opening position",hold:H.id,units:p.it.qty,cost:Math.round(p.it.qty*p.it.avg*100)/100,postings:[]});
    else if(p.kind==="changed"){ addTxn({type:"adjust",date,note:"Portfolio file sync",hold:H.id,units:p.du,cost:p.dc,postings:[]}); changed++; } else price++; }
  if(killMissing) for(const h of P.missing){ const q=holdPos(h); addTxn({type:"adjust",date,note:"Not in portfolio file, treated as sold",hold:h.id,units:-q.u,cost:-q.c,postings:[]}); sold++; }
  S.snaps=S.snaps||[]; S.snaps.push({date,inv:Math.round(P.items.reduce((a,x)=>a+x.qty*x.avg,0)),val:Math.round(P.items.reduce((a,x)=>a+x.qty*x.prev,0))});
  pendH=null; save(); closeSheet(); render(); toast(added+" new, "+changed+" changed, "+price+" prices, "+sold+" sold");
}

function lendingPosition(l){
  let principal=l.principal||0;
  for(const t of S.txns){if(t.status!=="posted"||t.loanId!==l.id||!t.principalReduction)continue;principal-=t.principalReduction;}
  principal=Math.max(0,principal);
  const days=Math.max(0,Math.floor((new Date(today()+"T00:00")-new Date((l.start||today())+"T00:00"))/864e5));
  const accrued=principal*(l.rate||0)/100*days/365.25;
  const interestPaid=S.txns.filter(t=>t.status==="posted"&&t.loanId===l.id&&t.interestSettlement).reduce((v,t)=>v+Math.abs(t.postings?.[0]?.amt||0),0);
  const interest=Math.max(0,accrued-interestPaid);
  return {principal,interest,accrued,interestPaid,total:principal+interest,days};
}

function dueHtml(){
  const r=[];
  for(const x of S.sips){
    if(x.status==="stopped") continue;
    const d=daysTo(x.next);
    if(d<=14){
      const h=S.holdings.find(v=>v.id===x.hold)||{};
      const label=d<0?"Overdue SIP":d===0?"SIP due today":"SIP";
      r.push([d, label+" · "+esc(h.name||"Fund"), fmt(x.amt,x.cur), `data-sip="${x.id}"`, d<0?"warn":""]);
    }
  }
  for(const p of S.policies){
    const d=daysTo(p.next);
    if(d<=30) r.push([d, "Premium · "+esc(p.name), fmt(p.premium,p.cur), `data-pol="${p.id}"`, d<0?"warn":""]);
  }
  for(const a of S.accounts){
    if(a.type!=="card"||a.archived||!a.dueDay) continue;
    const b=balance(a);
    if(b>=0) continue;
    const d=daysTo(nextDue(a.dueDay));
    if(d<=14) r.push([d, "Card due · "+esc(a.name), fmt(-b,a.cur), `data-acct="${a.id}"`, d<=3?"warn":""]);
  }
  for(const p of S.purchases){
    if(!p.expiry) continue;
    const d=daysTo(p.expiry);
    if(d>=0&&d<=30) r.push([d, "Warranty · "+esc(p.item), "", "", ""]);
  }
  for(const a of S.accounts){
    if(a.archived) continue;
    const exp=(a.cardMeta||{}).expiry;
    if(!exp || !/^(0[1-9]|1[0-2])\/([0-9]{2})$/.test(exp)) continue;
    const [mm,yy]=exp.split("/");
    const end="20"+yy+"-"+mm+"-01";
    // treat as due in the expiry month (1st); show within 60 days before
    const d=daysTo(end);
    if(d>=-31 && d<=60){
      const kind=a.type==="card"?"Credit card":"Debit card";
      const last=(a.cardMeta||{}).last4?(" ••••"+a.cardMeta.last4):"";
      r.push([Math.max(0,d), kind+" expires · "+esc(a.name)+last, exp, `data-acct="${a.id}"`, d<=30?"warn":""]);
    }
  }
  if(!r.length) return "";
  r.sort((a,b)=>a[0]-b[0]);
  return `<h2>Due soon</h2><div class="card">${r.map(x=>{
    const when=x[0]<0?((-x[0])+"d overdue"):x[0]===0?"today":("in "+x[0]+"d");
    const pill=x[0]<0?`<span class="due-pill over">overdue</span>`:x[0]===0?`<span class="due-pill">today</span>`:"";
    return `<div class="row" ${x[3]||""} style="cursor:pointer"><div><b class="${x[4]||""}">${x[1]}</b> ${pill}<div class="muted">${when}</div></div><b class="num ${x[4]||""}">${x[2]}</b></div>`;
  }).join("")}</div>`;

/* ---------- integrity check ---------- */
function runCheck(){
  const issues=[]; const ids=new Set();
  for(const t of S.txns){
    if(ids.has(t.id)) issues.push("Duplicate ID "+t.id); ids.add(t.id);
    if(!Array.isArray(t.postings)) issues.push("Transaction has no postings");
    for(const p of (t.postings||[])) if(!acct(p.acct)) issues.push("A transaction points at a missing account");
    if(t.fxRate!=null&&!(Number(t.fxRate)>0)) issues.push("Invalid historical FX rate on "+t.id);
    if(t.type==="transfer" && t.postings.length!==2) issues.push("Transfer without two sides");
    if(t.type!=="transfer" && t.type!=="open" && t.type!=="adjust" && t.type!=="adjustment" && t.postings.length!==1) issues.push("Unexpected postings on "+t.type);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(t.date)) issues.push("Bad date on a transaction");
  }
  openSheet(`<h2 style="margin-top:0">${issues.length?"Problems found":"All good"}</h2>
  <p class="muted">${S.txns.length} transactions, ${S.accounts.length} accounts and ${S.lending.length} lending records checked.</p>
  ${issues.length?`<ul>${[...new Set(issues)].map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:""}
  <button class="btn alt" data-close>Close</button>`);
}

function download(name, text, type){
  const blob=new Blob([text],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},1000);
}
async function exportJSON(){
  const filename=`finance-backup-${today()}.enc`, encrypted=await seal(S);
  try{
    const h=await backupHandleGet();
    if(h){
      // Directory handles expose getFileHandle; createWritable is only on file handles.
      const permission=await backupPermission(h,true);
      if(permission==="granted" && typeof h.getFileHandle==="function"){
        const file=await h.getFileHandle(filename,{create:true});
        const writable=await file.createWritable();
        try{
          await writable.write(new Blob([encrypted],{type:"application/octet-stream"}));
          await writable.close();
        }catch(err){
          try{await writable.abort();}catch(_){}
          throw err;
        }
        toast("Encrypted backup saved to "+(h.name||"selected folder"));
        await backupDestinationStatus();
        return;
      }
      await backupDestinationStatus();
      if(permission!=="granted"){
        toast("Folder permission not granted. Re-choose the folder, then try again. Downloading instead.");
      }else{
        toast("This browser cannot write into the selected folder. Downloading instead.");
      }
    }
  }catch(err){
    console.warn("Folder backup failed; fallback download",err);
    toast("Folder save failed ("+(err&&err.message?err.message:"error")+"). Downloading instead.");
  }
  download(filename,encrypted,"application/octet-stream");
}

    const r=R/100/12, n=Math.round(Y*12), V0=p.v;
    const yearRows=[];
    let v=V0, contrib=0;
    for(let y=1;y<=Math.round(Y);y++){
      for(let m=0;m<12;m++){
        if(Math.abs(r)<1e-12){ v=v+Smt; }
        else { v=v*(1+r)+Smt; }
        contrib+=Smt;
      }
      yearRows.push({y, v:Math.round(v*100)/100, contrib:Math.round(contrib*100)/100, gain:Math.round((v-V0-contrib)*100)/100});
    }
    const fv=yearRows[yearRows.length-1].v;
    const totalExtra=yearRows[yearRows.length-1].contrib;
    const gain=yearRows[yearRows.length-1].gain;
    const maxV=Math.max(V0, ...yearRows.map(x=>x.v), 1);
    const bars=yearRows.map(x=>{
      const hgt=Math.max(4, Math.round(x.v/maxV*90));
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
        <div class="muted" style="font-size:10px">${fmt(x.v,h.cur).replace(/[^0-9.,]/g,"").slice(0,6)}</div>
        <div style="width:100%;max-width:28px;height:90px;display:flex;align-items:flex-end"><div style="width:100%;height:${hgt}px;background:var(--accent);border-radius:6px 6px 2px 2px"></div></div>
        <div class="muted" style="font-size:11px">Y${x.y}</div>
      </div>`;
    }).join("");
    const out=$("#fvOut");
    if(out){
      out.style.display="block";
      out.innerHTML=`<div class="card">
        <div class="row"><span>Starting value</span><b class="num">${fmt(V0,h.cur)}</b></div>
        <div class="row"><span>Extra invested</span><b class="num">${fmt(totalExtra,h.cur)}</b></div>
        <div class="row"><span>Projected value</span><b class="num in">${fmt(fv,h.cur)}</b></div>
        <div class="row"><span>Projected gain</span><b class="num ${gain<0?"out":"in"}">${fmt(gain,h.cur)}</b></div>
        <div class="muted" style="margin-top:8px">${Math.round(Y)} years · ${R}% p.a. · monthly compounding</div>
      </div>
      <h2 style="font-size:15px;margin:14px 0 8px">Year-by-year</h2>
      <div class="card" style="overflow-x:auto">
        <div style="display:flex;gap:6px;min-width:${Math.max(240, yearRows.length*40)}px;align-items:flex-end;padding-top:8px">${bars}</div>
      </div>
      <div class="card" style="margin-top:10px">${yearRows.map(x=>`<div class="row"><span>Year ${x.y}</span><b class="num">${fmt(x.v,h.cur)}</b></div>`).join("")}</div>
      <div class="muted" style="margin-top:8px">This is a simple mathematical illustration. Markets do not return a fixed rate every year.</div>`;
    }
    return;
  }
  if(e.target.id==="fs1"){ const h=S.holdings.find(v=>v.id===$("#sh").value), a=acct($("#sa").value), m=parseAmt($("#sm").value); if(!h||m<=0) return; if(a.cur!==h.cur){ alert("Use an account in "+h.cur+"."); return; } S.sips.push({id:uid(),hold:h.id,acct:a.id,amt:m,cur:a.cur,freq:+$("#sf").value||1,next:$("#sd").value||today(),status:"active",history:[]}); save(); closeSheet(); render(); toast("SIP saved"); }
  if(e.target.id==="fsu"){ const x=S.sips.find(v=>v.id===$("#sid").value), u=parseAmt($("#su").value); if(!x||u<=0){ $("#su").focus(); return; }
    const payDate=x.next||today();
    addTxn({type:"buy",date:payDate,note:"SIP",hold:x.hold,units:u,cost:x.amt,sip:x.id,postings:[{acct:x.acct,amt:-x.amt,cur:x.cur}]});
    x.history=x.history||[]; x.history.push({date:payDate,status:"paid",units:u,amount:x.amt});
    x.next=addM(x.next,x.freq||1); x.status=x.status||"active";
    save(); closeSheet(); render(); toast("SIP payment recorded"); }
  if(e.target.id==="fpol"){ const n=$("#pn").value.trim(); if(!n) return; S.policies.push({id:uid(),name:n,policyNo:$("#pno").value.trim(),provider:$("#pp").value.trim(),owner:$("#po").value||"Me",start:$("#pstart").value||"",sum:parseAmt($("#ps").value),bonus:parseAmt($("#bonus").value),premium:parseAmt($("#pa").value),ppt:parseAmt($("#ppt").value),term:parseAmt($("#pt").value),maturity:$("#mat").value||"",cur:$("#pc").value,freq:+$("#pf").value,next:$("#pd").value||today()}); save(); closeSheet(); render(); }
  if(e.target.id==="fpay"){ const p=S.policies.find(v=>v.id===$("#pid").value), a=acct($("#pacc").value); if(!p||!a) return; if(a.cur!==p.cur){ alert("Pay from an account in "+p.cur+"."); return; } addTxn({type:"expense",date:today(),cat:"Insurance premium",note:p.name,postings:[{acct:a.id,amt:-p.premium,cur:a.cur}]}); p.next=addM(p.next,p.freq); save(); closeSheet(); render(); toast("Premium recorded"); }
  if(e.target.id==="fpur"){ const it=$("#un").value.trim(), am=parseAmt($("#ua").value), a=acct($("#uc").value), w=Math.round(parseAmt($("#uw").value)), dt=$("#ud").value||today(); if(!it||am<=0||!a) return; addTxn({type:"expense",date:dt,cat:"Shopping",note:it,postings:[{acct:a.id,amt:-am,cur:a.cur}]}); S.purchases.push({id:uid(),item:it,date:dt,amt:am,cur:a.cur,expiry:w>0?addM(dt,w):null}); save(); closeSheet(); render(); }
  if(e.target.id==="fbank"){const number=$("#ba").value.trim().replace(/\s/g,"");const person=$("#bp").value.trim(),holder=$("#bh").value.trim(),bank=$("#bb").value.trim();if(!number||!person||!holder||!bank)return;const b={id:uid(),person,holder,bank,accountNumber:number,accountMasked:number.length>8?"••••"+number.slice(-4):"••••"+number.slice(-4),ifsc:$("#bi").value.trim().toUpperCase(),branch:$("#br").value.trim(),branchCode:$("#bc").value.trim(),cur:$("#bcur").value,nickname:$("#bn").value.trim()};S.bankContacts.push(b);if(!S.people.includes(person))S.people.push(person);log("recipient-bank",b.id);save();closeSheet();render();toast("Recipient account saved");return;}
  if(e.target.id==="fcard"){ const a=acct($("#cid").value); if(a){ const last4=($("#last4")?.value||"").replace(/\D/g,"").slice(-4); const expiry=($("#expiry")?.value||"").trim(); if(expiry&&!/^(0[1-9]|1[0-2])\/([0-9]{2})$/.test(expiry)){alert("Enter expiry as MM/YY.");return;} a.cardMeta={last4,network:($("#network")?.value||"").trim(),cardType:($("#cardType")?.value||"").trim(),expiry,annualFee:parseAmt($("#annualFee")?.value||"0")}; if(a.type==="bank"){a.bank=$("#abankEdit")?.value.trim()||a.bank||"";a.branch=$("#abranchEdit")?.value.trim()||"";a.ifsc=$("#aifscEdit")?.value.trim().toUpperCase()||"";a.branchCode=$("#abranchcodeEdit")?.value.trim()||"";const n=($("#aacctnoEdit")?.value||"").replace(/\s/g,"").trim();a.accountNumber=n;a.accountMasked=n?(n.length>4?"••••"+n.slice(-4):"••••"):"";} if(a.type==="card"){ if($("#abankEdit")) a.bank=($("#abankEdit").value||"").trim()||a.bank||""; a.limit=parseAmt($("#cl").value);const day=v=>{const n=Math.round(parseAmt(v));return n>=1&&n<=31?n:0;};a.stmtDay=day($("#cs").value);a.dueDay=day($("#cd").value);} log("account-details",a.id);save(); } closeSheet(); render(); toast("Account details saved"); }
  if(e.target.id==="fa2"){
    const name=$("#an").value.trim(); if(!name) return;
    let o=parseAmt($("#ao").value); const type=$("#at").value;
    if(type==="card") o=-Math.abs(o);
    const rawNum=(type==="bank"?($("#aacctno")?.value||""):"").replace(/\s/g,"").trim();
    const a={id:uid(),name,
      bank:(type==="card"?($("#cbank")?.value||""):($("#abank")?.value||"")).trim(),
      branch:($("#abranch")?.value||"").trim(),
      ifsc:($("#aifsc")?.value||"").trim().toUpperCase(),
      branchCode:($("#abranchcode")?.value||"").trim(),
      accountNumber:rawNum,
      accountMasked:rawNum?(rawNum.length>4?"••••"+rawNum.slice(-4):"••••"):"",
      owner:($("#aowner").value.trim()||"Me"),type,cur:$("#ac").value,opening:o,archived:false};
    if(type==="bank"){
      const last4=($("#adlast4")?.value||"").replace(/\D/g,"").slice(-4);
      const expiry=($("#adexpiry")?.value||"").trim();
      if(expiry && !/^(0[1-9]|1[0-2])\/([0-9]{2})$/.test(expiry)){ alert("Enter debit card expiry as MM/YY."); return; }
      if(last4 || expiry || ($("#adnetwork")?.value||"").trim()){
        a.cardMeta={last4, network:($("#adnetwork")?.value||"").trim(), cardType:"Debit", expiry, annualFee:0};
      }
    }
    if(type==="card"){
      const last4=(($("#clast4")?.value)||"").replace(/\D/g,"").slice(-4);
      const expiry=(($("#cexpiry")?.value)||"").trim();
      if(expiry && !/^(0[1-9]|1[0-2])\/([0-9]{2})$/.test(expiry)){ alert("Enter expiry as MM/YY."); return; }
      a.cardMeta={last4, network:($("#cnetwork")?.value||"").trim(), cardType:($("#ctype")?.value||"").trim(), expiry, annualFee:parseAmt($("#cfee")?.value||"0")};
      a.limit=parseAmt($("#climit")?.value||"0");
      const day=v=>{const n=Math.round(parseAmt(v||"0")); return n>=1&&n<=31?n:0;};
      a.stmtDay=day($("#cstmt")?.value); a.dueDay=day($("#cdue")?.value);
    }
    S.accounts.push(a); if(!S.people.includes(a.owner))S.people.push(a.owner); log("account",a.id); save(); closeSheet(); render(); toast(type==="card"?"Credit card added":"Account added");
  }
});

function boot(){
  let env=null, legacy=null;
  try{ const d=JSON.parse(store.get()); if(d&&d.enc) env=d; else if(d&&d.v===1) legacy=d; }catch(e){}
  BIO=env?.bio||null;KDF_ITER=env?.iterations||250000;
  $("#nav").innerHTML="";$("#layer").innerHTML="";
  $("#app").innerHTML=`<div style="padding-top:42px;position:relative">
  <button type="button" data-releases title="Release notes" style="position:absolute;top:8px;right:0;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;padding:4px 2px;opacity:.85">v${esc(APP_VERSION)}</button>
  <div class="big" style="font-size:28px">My Finance</div>
  <p class="muted">${env?"Your encrypted finance vault is locked.":"Create a strong passphrase. It encrypts your data on this phone and in backup files."}</p>
  <form id="pf"><input id="pp" type="password" autocomplete="current-password" placeholder="Passphrase" required>${env?"":`<input id="pp2" type="password" autocomplete="new-password" placeholder="Repeat passphrase" style="margin-top:8px">`}<div id="pe" class="out" style="margin-top:8px"></div><button class="btn" type="submit">${env?"Unlock with passphrase":"Create secure vault"}</button></form>
  ${env?.bio?`<button class="btn alt" data-bio-unlock>Use fingerprint / device passkey</button>`:""}
  <div class="security-note" style="margin-top:18px">Encryption: AES-256-GCM. Passphrase key derivation: PBKDF2-HMAC-SHA-256. Never share your passphrase. If you lose it and have no working biometric unlock, encrypted data cannot be recovered.</div>
  </div>`;
  $("#pf").onsubmit=async e=>{
    e.preventDefault();const p=$("#pp").value,er=m=>{$("#pe").textContent=m;};
    try{
      if(env){SALT=unb64(env.salt);const k=await deriveKey(p,SALT,KDF_ITER);S=await unseal(env,k);CK=k;BIO=env.bio||null;
        if(KDF_ITER<600000){const ns=crypto.getRandomValues(new Uint8Array(16)),nk=await deriveKey(p,ns,600000);SALT=ns;CK=nk;KDF_ITER=600000;BIO=null;store.set(await seal(S));}
      }else{
        if(p.length<12)return er("Use at least 12 characters. A unique multi-word passphrase is best.");if(p!==$("#pp2").value)return er("The two passphrases differ.");SALT=crypto.getRandomValues(new Uint8Array(16));KDF_ITER=600000;CK=await deriveKey(p,SALT,KDF_ITER);S=legacy||blank();BIO=null;
      }
      migrate();save();render();
    }catch(x){S=null;CK=null;er("Could not unlock. Check your passphrase or use fingerprint unlock.");}
  };
}

let hidAt=0;
document.addEventListener("visibilitychange",()=>{ if(!S) return; if(document.hidden) hidAt=Date.now(); else if(Date.now()-hidAt>120000) chain=chain.then(()=>{ S=null; CK=null; boot(); }); });
boot();
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
