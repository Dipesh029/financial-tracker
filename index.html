    const ppt=editOpt("#peppt","Premium paying term", Number(p.ppt)||0);
    const term=editOpt("#peterm","Policy term", Number(p.term)||0);
    if([sum,fund,bonus,ppt,term].some(v=>v==null)) return;
    p.sum=sum; if($("#pefund")) p.fundValue=fund; p.bonus=bonus; p.ppt=Math.round(ppt)||0; p.term=Math.round(term)||0;
    if($("#pekind")) p.policyKind=$("#pekind").value;
    if($("#pepaidthrough")) p.paidThrough=($("#pepaidthrough").value||"").trim();
    const premiumEdit=rejectAmt($("#peprem")?.value,{required:true,positive:true,maxDecimals:2});
    if(premiumEdit==null) return;
    p.premium=premiumEdit;
    const freqR=readAmt($("#pefreq")?.value,{required:true,positive:true,maxDecimals:0,allowNegative:false});
    if(!freqR.ok){ alert("Frequency: "+freqR.error); return; }
    p.freq=Math.max(1, Math.round(freqR.value));
    p.maturity=($("#pemat")?.value||"").trim();
    const nextOverride=($("#penext")?.value||"").trim();
    // 2) Recalculate schedule status AFTER all fields applied
    // Never mark fully paid solely because schedule inputs are missing
    const hasSchedule=!!(p.start && Number(p.premium)>0 && (Number(p.ppt)>0 || (p.payments||[]).length));
    if(nextOverride){
      // Explicit next-due override wins
      p.next=nextOverride;
      p.finalPremiumPaid=false;
    } else if(hasSchedule){
      const nu=policyNextUnpaidDue(p);
      if(nu){ p.next=nu; p.finalPremiumPaid=false; }
      else {
        p.next="";
        p.finalPremiumPaid=true;
      }
    } else {
      // Incomplete schedule info — keep existing next if any; do not force finalPremiumPaid
      if(nextOverride) p.next=nextOverride;
      p.finalPremiumPaid=false;
    }
    save(); closeSheet(); render(); toastSaved("Policy updated"); return;
  }
  if(e.target.id==="fpay"){
    const p=S.policies.find(v=>v.id===$("#pid").value), a=acct($("#pacc").value);
    if(!p||!a){ alert("Policy or account missing."); return; }
    if(a.cur!==p.cur){ alert("Pay from an account in "+p.cur+"."); return; }
    if(!(Number(p.premium)>0)){ alert("Premium amount is zero — edit the policy first."); return; }
    const end=policyPptEnd(p);
    const due=policyPayableDate(p);
    if(!due){ alert("No unpaid premium is due on this policy."); return; }
    if(end && due>end){ alert("That due date is after the premium-paying term."); return; }
    const already=S.txns.find(t=>t.status==="posted"&&t.policyId===p.id&&t.date===due);
    if(already){
      p.next=policyNextUnpaidDue(p)||"";
      p.finalPremiumPaid=!p.next;
      save();
      alert("A premium for "+due+" is already recorded. Next due is "+(p.next||"none")+".");
      closeSheet(); render(); return;
    }
    const txn=addTxn({type:"expense",date:due,note:"Premium · "+(p.name||"Policy"),cat:"Insurance premium",owner:p.owner||a.owner||"Me",policyId:p.id,postings:[{acct:a.id,amt:-Math.abs(p.premium),cur:p.cur}]});
    p.payments=p.payments||[];
    p.payments.push({id:uid(),date:due,amount:p.premium,cur:p.cur,acct:a.id,txnId:txn.id});
    const nu=policyNextUnpaidDue(p);
    p.next=nu||"";
    p.finalPremiumPaid=!nu;
    save();
    closeSheet();
    render();
    toastSaved(nu?("Premium recorded · next "+nu):"Final premium recorded. No further premiums are due.");
    return;
  }
  if(e.target.id==="fcard"){
    const a=acct($("#cid").value); if(!a) return;
    const newName=($("#anameEdit")?.value||"").trim();
    if(!newName){ alert("Enter an account nickname."); return; }
    a.name=newName;
    const newOwner=($("#aownerEdit")?.value||"").trim()||"Me";
    a.owner=newOwner;
    if(!S.people.includes(newOwner)) S.people.push(newOwner);
    if(a.type==="demat"){
      if($("#abrokerEdit")) a.broker=($("#abrokerEdit").value||"").trim();
      if($("#adematEdit")) a.dematId=($("#adematEdit").value||"").trim();
      if($("#ainvestedEdit")) a.invested=parseAmt($("#ainvestedEdit").value||"0");
      // Never attach linked debit / cardMeta on demat
    } else if(a.type==="bank"){
      a.bank=$("#abankEdit")?.value.trim()||a.bank||"";
      a.branch=$("#abranchEdit")?.value.trim()||"";
      a.ifsc=($("#aifscEdit")?.value||"").trim().toUpperCase()||"";
      a.branchCode=$("#abranchcodeEdit")?.value.trim()||"";
      const n=($("#aacctnoEdit")?.value||"").replace(/\s/g,"").trim();
      a.accountNumber=n;
      a.accountMasked=n?(n.length>4?"••••"+n.slice(-4):"••••"):"";
      // Linked debit card optional (bank only)
      if($("#last4")||$("#adlast4")||document.getElementById("expiry")||document.getElementById("adexpiry")){
        const last4=($("#last4")?.value||$("#adlast4")?.value||"").replace(/\D/g,"").slice(-4);
        const expId=document.getElementById("expiry")?"expiry":(document.getElementById("adexpiry")?"adexpiry":"");
        let expiry="";
        if(expId){ const expR=readExpiryField(expId,{allowPast:true}); if(!expR.ok){ alert(expR.error); return; } expiry=expR.value; }
        if(last4||expiry||($("#network")?.value||$("#adnetwork")?.value||"").trim()){
          a.cardMeta=Object.assign({}, a.cardMeta||{}, {
            last4: last4||(a.cardMeta&&a.cardMeta.last4)||"",
            network: ($("#network")?.value||$("#adnetwork")?.value||(a.cardMeta&&a.cardMeta.network)||"").trim(),
            expiry: expiry||(a.cardMeta&&a.cardMeta.expiry)||""
          });
        }
      }
    } else if(a.type==="card"){
      const last4=($("#last4")?.value||"").replace(/\D/g,"").slice(-4);
      const expR=readExpiryField("expiry",{allowPast:true});
      if(!expR.ok){ alert(expR.error); return; }
      a.cardMeta={ last4, network:($("#network")?.value||"").trim(), cardType:($("#cardType")?.value||"").trim(), expiry:expR.value, annualFee:parseAmt($("#annualFee")?.value||"0") };
      if($("#abankEdit")) a.bank=($("#abankEdit").value||"").trim()||a.bank||"";
      a.limit=parseAmt($("#cl")?.value);
      const day=v=>{ const n=Math.round(parseAmt(v)); return n>=1&&n<=31?n:0; };
      a.stmtDay=day($("#cs")?.value);
      a.dueDay=day($("#cd")?.value);
      if($("#alinked")) a.linkedBankId=$("#alinked").value||"";
    }
    log("account-details",a.id);
    save();
    closeSheet();
    render();
    toast("Account details saved");
    return;
  }
  if(e.target.id==="fa2"){
    const name=$("#an").value.trim(); if(!name) return;
    let o=parseAmt($("#ao").value); const type=$("#at").value;
    if(type==="card") o=-Math.abs(o);
    const rawNum=(type==="bank"?($("#aacctno")?.value||""):"").replace(/\s/g,"").trim();
    const a={id:uid(),name,
      bank:(type==="card"?($("#cbank")?.value||""):($("#abank")?.value||"")).trim(),
      branch:($("#abranch")?.value||"").trim(),
      ifsc:($("#aifsc")?.value||"").trim().toUpperCase(),
      branchCode:($("#abranchcode")?.value||"").trim(),
      accountNumber:rawNum,
      accountMasked:rawNum?(rawNum.length>4?"••••"+rawNum.slice(-4):"••••"):"",
      owner:($("#aowner").value.trim()||"Me"),type,cur:$("#ac").value,opening:o,archived:false};
    if(type==="bank"){
      const last4=($("#adlast4")?.value||"").replace(/\D/g,"").slice(-4);
      const expAd=readExpiryField("adexpiry",{allowPast:false}); if(!expAd.ok){alert(expAd.error);return;} const expiry=expAd.value;
      if(last4 || expiry || ($("#adnetwork")?.value||"").trim()){
        a.cardMeta={last4, network:($("#adnetwork")?.value||"").trim(), cardType:"Debit", expiry, annualFee:0};
      }
    }
    if(type==="card"){
      const last4=(($("#clast4")?.value)||"").replace(/\D/g,"").slice(-4);
      const expC=readExpiryField("cexpiry",{allowPast:false}); if(!expC.ok){alert(expC.error);return;} const expiry=expC.value;
      a.cardMeta={last4, network:($("#cnetwork")?.value||"").trim(), cardType:($("#ctype")?.value||"").trim(), expiry, annualFee:parseAmt($("#cfee")?.value||"0")};
      a.limit=parseAmt($("#climit")?.value||"0");
      const day=v=>{const n=Math.round(parseAmt(v||"0")); return n>=1&&n<=31?n:0;};
      a.stmtDay=day($("#cstmt")?.value); a.dueDay=day($("#cdue")?.value);
      a.linkedBankId=($("#clinked")?.value)||"";
    }
    S.accounts.push(a); if(!S.people.includes(a.owner))S.people.push(a.owner); log("account",a.id); save(); closeSheet(); render(); toastSaved(type==="card"?"Credit card added":"Account added");
  }
});

function boot(){
  S=null; CK=null;
  document.body.classList.add("locked");
  let env=null, legacy=null;
  try{ const d=JSON.parse(store.get()); if(d&&d.enc) env=d; else if(d&&d.v===1) legacy=d; }catch(e){}
  BIO=env?.bio||null;KDF_ITER=env?.iterations||250000;
  $("#nav").innerHTML="";$("#layer").innerHTML="";
  $("#app").innerHTML=`<div style="padding-top:42px;position:relative">
  <button type="button" data-releases title="Release notes" style="position:absolute;top:8px;right:0;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;padding:4px 2px;opacity:.85">v${esc(APP_VERSION)}</button>
  <div class="big" style="font-size:28px">My Finance</div>
  <p class="muted">${env?"Your encrypted finance vault is locked.":"Create a strong passphrase. It encrypts your data on this phone and in backup files."}</p>
  <form id="pf"><input id="pp" type="password" autocomplete="current-password" placeholder="Passphrase" required>${env?"":`<input id="pp2" type="password" autocomplete="new-password" placeholder="Repeat passphrase" style="margin-top:8px">`}<div id="pe" class="out" style="margin-top:8px"></div><button class="btn" type="submit">${env?"Unlock with passphrase":"Create secure vault"}</button></form>
  ${env?.bio?`<button class="btn alt" data-bio-unlock>Use fingerprint / device passkey</button>`:""}
  <div class="security-note" style="margin-top:18px">Encryption: AES-256-GCM. Passphrase key derivation: PBKDF2-HMAC-SHA-256. Never share your passphrase. If you lose it and have no working biometric unlock, encrypted data cannot be recovered.</div>
  </div>`;
  $("#pf").onsubmit=async e=>{
    e.preventDefault();
    const p=$("#pp").value, er=m=>{$("#pe").textContent=m;};
    const btn=e.target.querySelector('button[type="submit"]');
    if(btn){ btn.disabled=true; btn.textContent="Unlocking…"; }
    try{
      if(!p) return er("Enter your passphrase.");
      if(env){
        SALT=unb64(env.salt);
        const k=await deriveKey(p,SALT,KDF_ITER);
        try{
          S=await unseal(env,k);
        }catch(decErr){
          S=null; CK=null;
          return er("Wrong passphrase (or vault data is damaged). Fingerprint unlock may still work if enabled.");
        }
        CK=k; BIO=env.bio||null;
        if(KDF_ITER<600000){
          const hadBio=!!(env.bio||BIO);
          const prevSalt=SALT, prevKey=CK, prevIter=KDF_ITER, prevBio=BIO;
          try{
            const ns=crypto.getRandomValues(new Uint8Array(16)), nk=await deriveKey(p,ns,600000);
            SALT=ns; CK=nk; KDF_ITER=600000; BIO=null;
            store.set(await seal(S));
            unlockNotice=hadBio
              ? "Security update: vault re-encrypted. Fingerprint unlock was turned off — enable it again under More."
              : "Security update: vault re-encrypted with a stronger key.";
          }catch(upErr){
            SALT=prevSalt; CK=prevKey; KDF_ITER=prevIter; BIO=prevBio;
            console.warn("kdf upgrade failed", upErr);
            unlockNotice="A security update could not be stored. Your existing vault and passphrase are unchanged.";
          }
        }
      }else{
        if(p.length<12) return er("Use at least 12 characters. A unique multi-word passphrase is best.");
        if(p!==$("#pp2").value) return er("The two passphrases differ.");
        SALT=crypto.getRandomValues(new Uint8Array(16)); KDF_ITER=600000;
        CK=await deriveKey(p,SALT,KDF_ITER); S=legacy||blank(); BIO=null;
      }
      try{ migrate(); }catch(mErr){ console.error(mErr); /* still allow in with partial migrate */ }
      try{ const auto=processDueAutomations(); toastAutomations(auto); }catch(aErr){ console.warn(aErr); }
      try{ save(); }catch(sErr){ console.warn(sErr); }
      document.body.classList.remove("locked");
      render();
      if(unlockNotice){ const note=unlockNotice; unlockNotice=""; setTimeout(()=>toast(note), 700); }
    }catch(x){
      S=null; CK=null; document.body.classList.add("locked");
      er("Could not unlock: "+(x&&x.message?x.message:"unknown error"));
    }finally{
      if(btn){ btn.disabled=false; btn.textContent=env?"Unlock with passphrase":"Create secure vault"; }
    }
  };
}

let hidAt=0;
document.addEventListener("visibilitychange",()=>{ if(!S) return; if(document.hidden) hidAt=Date.now(); else if(Date.now()-hidAt>120000) chain=chain.then(()=>{ S=null; CK=null; boot(); }); });
if(globalThis.__MF_TEST){
  globalThis.__mf={
    parseAmt, inspectAmt, readAmt, rejectAmt,
    save, store, seal, unseal, deriveKey, blank, migrate,
    processDueAutomations, salaryTermsAt, advanceSalaryNext, addM, addDays, calendarDays,
    lendingPosition, policyScheduleDates, policyPremiumsPaidToDate, policyNextUnpaidDue, policyPptEnd, policyHasOpenPremium,
    wealthBreakdown, netWorth, valuationNotes, holdPos, balance, addTxn,
    openBackupPayload, commitRestore, vaultShapeOk, buildHoldPlanRow, applySectionSort,
    getNwPrefs, forgetBackupFolder,
    getS(){ return S; }, setS(v){ S=v; },
    getCK(){ return CK; },
    setCrypto(k, salt, iter){ CK=k; SALT=salt; if(iter) KDF_ITER=iter; },
    today, uid
  };
}
boot();
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
