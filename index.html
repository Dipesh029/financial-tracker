<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4fd8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<title>My Finance</title>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#18212b; --muted:#6a7684; --line:#e1e6ec;
  --accent:#2f4fd8; --accent-ink:#fff; --in:#177a52; --out:#b93a32; --warn:#9a6a00;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10151c; --card:#1a222c; --ink:#e8edf3; --muted:#92a0b0; --line:#2a3441;
    --accent:#7d93ff; --accent-ink:#0d1220; --in:#4fc38f; --out:#ff8a80; --warn:#e3b341; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:15px;font-weight:600;color:var(--muted);margin:4px 0 2px}
h2{font-size:17px;margin:22px 0 10px}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row+.row{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.muted{color:var(--muted);font-size:14px}
.in{color:var(--in)} .out{color:var(--out)} .warn{color:var(--warn)}
.seg{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 2px;font-size:13px;border-radius:9px;font:inherit;font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:8px 0}
nav button.on{color:var(--accent);font-weight:700}
nav .add{flex:0 0 58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  font-size:32px;line-height:1;margin-top:-30px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-weight:400}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  max-height:92vh;overflow:auto}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.amt{font-size:36px;font-weight:700;text-align:center;padding:14px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);margin-top:16px}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line);margin-top:10px}
.btn.danger{background:var(--bg);color:var(--out);border:1px solid var(--line)}
.small{font-size:13px;padding:8px 12px;width:auto;margin:0;border-radius:10px}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;display:flex;gap:14px;align-items:center}
.toast button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;filter:brightness(1.4)}
.void{opacity:.5;text-decoration:line-through}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.hero{background:linear-gradient(145deg,var(--accent),#526ee8);color:#fff;border:0;padding:20px;border-radius:22px;margin:10px 0 14px;box-shadow:0 8px 22px rgba(47,79,216,.18)}
.hero .muted{color:rgba(255,255,255,.78)}.hero .big{font-size:32px;margin:8px 0}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.metric{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;min-width:0}
.metric b{display:block;font-size:17px;margin-top:4px;overflow-wrap:anywhere}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.quick-grid button{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:12px 5px;font:inherit;font-size:13px;font-weight:650}
.chart{width:100%;height:auto;display:block}.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.home-filter{margin:8px 0}.home-filter select{padding:10px}.security-note{font-size:12px;color:var(--muted);line-height:1.45}

</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="layer"></div>

<script>
"use strict";
/* ---------- storage (stays on this phone; nothing is sent anywhere) ---------- */
const KEY = "myfinance.v1";
const EXPENSE_CATS = ["Groceries","Rent / housing","Utilities","Transport","Dining out","Shopping","Health","Insurance premium","Travel","Subscriptions","Education","Taxes","Bank fees","Gifts","Other"];
const INCOME_CATS = ["Salary","Interest","Rental income","Business","Gift received","Other income"];
const mem = {};
const store = {
  get(){ try{ return localStorage.getItem(KEY); }catch(e){ return mem[KEY] || null; } },
  set(v){ try{ localStorage.setItem(KEY, v); }catch(e){ mem[KEY] = v; } }
};

/* Optional encrypted-backup destination. The vault data remains in existing encrypted storage. */
const BACKUP_DB="myfinance.backup-destination", BACKUP_STORE="handles", BACKUP_HANDLE_KEY="directory";
function backupDb(){return new Promise((resolve,reject)=>{if(!("indexedDB" in window))return reject(new Error("IndexedDB unavailable"));const req=indexedDB.open(BACKUP_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(BACKUP_STORE))req.result.createObjectStore(BACKUP_STORE);};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error("Backup settings storage unavailable"));});}
async function backupHandleGet(){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readonly"),req=tx.objectStore(BACKUP_STORE).get(BACKUP_HANDLE_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();});}
async function backupHandleSet(handle){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readwrite");tx.objectStore(BACKUP_STORE).put(handle,BACKUP_HANDLE_KEY);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};tx.onabort=()=>{db.close();reject(tx.error);};});}
async function backupHandleForget(){const db=await backupDb();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,"readwrite");tx.objectStore(BACKUP_STORE).delete(BACKUP_HANDLE_KEY);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};});}
async function backupPermission(handle,request=false){if(!handle)return "missing";try{if(!handle.queryPermission)return "unsupported";let p=await handle.queryPermission({mode:"readwrite"});if(p!=="granted"&&request&&handle.requestPermission)p=await handle.requestPermission({mode:"readwrite"});return p;}catch(e){return "denied";}}
async function backupDestinationStatus(){const node=$("#backupFolderStatus");if(!node)return;if(!("showDirectoryPicker" in window)){node.textContent="Folder picker unsupported here. Use Save backup file for the browser download/file picker.";return;}try{const h=await backupHandleGet();if(!h){node.textContent="No folder selected. Encrypted backups use download fallback.";return;}const p=await backupPermission(h,false);node.textContent=p==="granted"?"Selected folder: "+(h.name||"Device folder")+" · Ready":p==="prompt"?"Selected folder: "+(h.name||"Device folder")+" · Permission required when saving":"Selected folder: "+(h.name||"Device folder")+" · Permission unavailable; select again or use download fallback.";}catch(e){node.textContent="Folder preference unavailable. Download backup remains available.";}}
async function chooseBackupFolder(){if(!("showDirectoryPicker" in window)){toast("Folder picker unsupported; use Save backup file.");return;}try{const h=await window.showDirectoryPicker({mode:"readwrite"});await backupHandleSet(h);await backupDestinationStatus();toast("Backup folder selected: "+(h.name||"folder"));}catch(e){if(e.name!=="AbortError")alert("Could not select backup folder. "+(e.message||""));}}
async function forgetBackupFolder(){try{await backupHandleForget();await backupDestinationStatus();toast("Backup folder forgotten");}catch(e){alert("Could not forget backup folder.");}}

const blank=()=>({v:2,rate:104.16,display:"INR",accounts:[],holdings:[],sips:[],policies:[],purchases:[],snaps:[],history:[],lending:[],bankContacts:[],people:["Me","Father","Mother"],txns:[],audit:[],lastAcct:null});
let S=null, CK=null, SALT=null, BIO=null, KDF_ITER=600000, chain=Promise.resolve(), homeOwner="All family";
const LBL={adjust:"Portfolio sync · ",open:"Opening position · ",refund:"Refund · ",buy:"Bought ",sell:"Sold ",lend:"Lent to ",lendback:"Repaid by ",borrow:"Borrowed from ",repay:"Repaid to "};
function b64(u){let t="";for(const x of new Uint8Array(u))t+=String.fromCharCode(x);return btoa(t);}
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function deriveKey(p,salt,iterations=KDF_ITER,extractable=false){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations,hash:"SHA-256"},m,{name:"AES-GCM",length:256},extractable,["encrypt","decrypt"]);}
async function seal(o){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},CK,new TextEncoder().encode(JSON.stringify(o)));return JSON.stringify({enc:2,salt:b64(SALT),iterations:KDF_ITER,iv:b64(iv),data:b64(ct),bio:BIO||null});}
async function unseal(env,key){const ct=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(env.iv)},key,unb64(env.data));return JSON.parse(new TextDecoder().decode(ct));}
function save(){ if(!CK||!S) return; chain=chain.then(async()=>store.set(await seal(S))).catch(()=>{}); }
function migrate(){
  for(const k of ["accounts","holdings","sips","policies","purchases","snaps","history","lending","bankContacts","people","txns","audit"]) S[k]=S[k]||[];
  S.v=2;
  for(const a of S.accounts){a.owner=a.owner||"Me";a.bank=a.bank||"";a.ifsc=a.ifsc||"";a.branchCode=a.branchCode||"";a.branch=a.branch||"";}
  if(!Array.isArray(S.people)||!S.people.length)S.people=["Me","Father","Mother"];
  for(const h of S.holdings){h.owner=h.owner||"Me";h.folio=h.folio||"";h.isin=h.isin||"";h.symbol=h.symbol||"";h.exchange=h.exchange||"";h.demat=h.demat||"";h.broker=h.broker||"";h.amc=h.amc||"";h.notes=h.notes||"";}
  for(const t of S.txns){if(t.fxRate==null)t.fxRate=S.rate||104.16;if(!t.owner&&t.postings?.[0])t.owner=(S.accounts.find(a=>a.id===t.postings[0].acct)||{}).owner||"Me";}
}
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)); }
function log(action, id){ S.audit.push({ts:new Date().toISOString(), action, id}); }
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };

/* ---------- money ---------- */
const fmt = (n,cur) => new Intl.NumberFormat(cur==="INR"?"en-IN":"nl-NL",{style:"currency",currency:cur,maximumFractionDigits:2}).format(n||0);
const toDisplay = (n,cur) => cur===S.display ? n : (cur==="EUR" ? n*S.rate : n/S.rate);
const toDisplayAt = (n,cur,rate) => cur===S.display ? n : (cur==="EUR" ? n*(rate||S.rate) : n/(rate||S.rate));
const parseAmt = v => { const n = parseFloat(String(v).replace(/,/g,".").replace(/[^0-9.]/g,"")); return isFinite(n)?n:0; };
const acct = id => S.accounts.find(a=>a.id===id);

/* ---------- ledger: every transaction = balanced postings; balances are derived ---------- */
function balance(a){
  let b = a.opening || 0;
  for(const t of S.txns){ if(t.status!=="posted") continue; for(const p of t.postings) if(p.acct===a.id) b += p.amt; }
  return Math.round(b*100)/100;
}
function holdPos(h){let u=0,c=0;for(const t of S.txns){if(t.status!=="posted"||t.hold!==h.id)continue;if(t.type==="buy"||t.type==="open"||t.type==="adjust"){u+=t.units;c+=t.cost;}else if(t.type==="sell"){const f=u?Math.min(1,t.units/u):0;c-=c*f;u-=t.units;}}return{u:Math.round(u*1e6)/1e6,c:Math.round(c*100)/100,v:Math.round(u*(h.price||0)*100)/100};}
function personPos(owner){const m={};for(const t of S.txns){if(t.status==="posted"&&t.person&&t.pd&&t.postings?.[0]&&(!owner||t.owner===owner))m[t.person]=(m[t.person]||0)+toDisplayAt(t.pd,t.postings[0].cur,t.fxRate);}return m;}
function monthKey(d){ return d.slice(0,7); }
function monthTotals(m,owner){
  let inc=0, exp=0;
  for(const t of S.txns){
    if(t.status!=="posted" || monthKey(t.date)!==m || (owner&&t.owner!==owner)) continue;
    if(t.type==="income") inc += toDisplayAt(t.postings[0].amt, t.postings[0].cur,t.fxRate);
    if(t.type==="expense") exp += toDisplayAt(-t.postings[0].amt, t.postings[0].cur,t.fxRate);
    if(t.type==="refund") exp -= toDisplayAt(t.postings[0].amt, t.postings[0].cur,t.fxRate);
  }
  return {inc,exp};
}
function addTxn(t){ t.id=uid(); t.status="posted"; t.created=new Date().toISOString(); if(t.fxRate==null)t.fxRate=S.rate; if(!t.owner&&t.postings?.[0])t.owner=(acct(t.postings[0].acct)||{}).owner||"Me"; S.txns.push(t); log("create",t.id); save(); return t; }
function voidTxn(id){ const t=S.txns.find(x=>x.id===id); if(t){ t.status="voided"; log("void",id); save(); } }
function unvoid(id){ const t=S.txns.find(x=>x.id===id); if(t){ t.status="posted"; log("restore",id); save(); } }

/* ---------- UI state ---------- */
let tab="home", q="", sheetType="expense", chosenCat=null, filterAcct="";
const $ = s => document.querySelector(s);

function render(){
  $("#nav").innerHTML = ["home:Home","activity:Activity","+:+","plan:Plan","accounts:Money","settings:More"].map(x=>{
    const [k,l]=x.split(":");
    return k==="+" ? `<button class="add" aria-label="Add transaction" data-add>+</button>` : `<button data-tab="${k}" class="${tab===k?"on":""}">${l}</button>`;
  }).join("");
  const v = {home:viewHome,plan:viewPlan, activity:viewActivity, accounts:viewAccounts, settings:viewSettings}[tab];
  $("#app").innerHTML = v();
}

function netWorth(owner){
  let assets=0,owed=0;
  for(const a of S.accounts){if(a.archived||(owner&&a.owner!==owner))continue;const b=toDisplay(balance(a),a.cur);if(b>=0)assets+=b;else owed+=-b;}
  for(const h of S.holdings){if(owner&&h.owner!==owner)continue;assets+=toDisplay(holdPos(h).v,h.cur);}
  for(const v of Object.values(personPos(owner))){if(v>=0)assets+=v;else owed+=-v;}
  return {assets,owed,total:assets-owed};
}
function historyHtml(owner){const hs=(S.history||[]).filter(x=>owner?x.owner===owner:!x.owner).slice(-12).reverse();return `<h2>Net worth history</h2><div class="card">${hs.length?hs.map(x=>`<div class="row"><span>${esc(x.date)}</span><b class="num">${fmt(toDisplayAt(x.value,x.cur||S.display,x.fxRate||S.rate),S.display)}</b></div>`).join(""):`<div class="muted">No saved snapshots yet for this view.</div>`}<button class="btn alt" data-snapshot>Save this month's snapshot</button></div>`;}
function viewHome(){ const b=viewHome0(); return S.accounts.length?b+dueHtml()+historyHtml(homeOwner==="All family"?null:homeOwner):b; }
function chartHtml(owner){
  const ms=[];let d=today().slice(0,8)+"01";for(let i=5;i>=0;i--){const dt=addM(d,-i);ms.push(dt.slice(0,7));}
  const rows=ms.map(m=>({m,...monthTotals(m,owner)}));const max=Math.max(1,...rows.map(x=>Math.max(x.inc,x.exp)));
  const w=320,h=138,base=105,barW=13,gap=35,startX=22;
  const bars=rows.map((x,i)=>{const x0=startX+i*gap;const hi=Math.max(1,x.inc/max*72),he=Math.max(1,x.exp/max*72);return `<rect x="${x0}" y="${base-hi}" width="11" height="${hi}" rx="3" fill="var(--in)"/><rect x="${x0+13}" y="${base-he}" width="11" height="${he}" rx="3" fill="var(--out)"/><text x="${x0+12}" y="126" text-anchor="middle" font-size="8" fill="var(--muted)">${esc(x.m.slice(5))}</text>`}).join("");
  return `<h2>Cash flow · last 6 months</h2><div class="card"><svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Monthly income and spending bar chart"><line x1="10" y1="${base}" x2="310" y2="${base}" stroke="var(--line)"/>${bars}</svg><div class="chart-legend"><span><i class="dot" style="background:var(--in)"></i>Income</span><span><i class="dot" style="background:var(--out)"></i>Spending</span></div></div>`;
}
function netWorthChartHtml(owner){
  const hs=(S.history||[]).filter(x=>owner?x.owner===owner:!x.owner).slice(-6);
  if(hs.length<2)return `<h2>Net worth trend</h2><div class="card muted">Save at least two monthly snapshots to see your net-worth trend here.</div>`;
  const vals=hs.map(x=>toDisplayAt(x.value,x.cur||S.display,x.fxRate||S.rate));
  const lo=Math.min(...vals),hi=Math.max(...vals),span=Math.max(1,hi-lo),w=320,h=126;
  const pts=vals.map((v,i)=>`${18+i*(284/Math.max(1,vals.length-1))},${92-(v-lo)/span*68}`).join(' ');
  const labels=hs.map((x,i)=>`<text x="${18+i*(284/Math.max(1,hs.length-1))}" y="112" text-anchor="middle" font-size="8" fill="var(--muted)">${esc((x.date||'').slice(0,7))}</text>`).join('');
  return `<h2>Net worth trend</h2><div class="card"><svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Net worth history line chart"><line x1="12" y1="92" x2="308" y2="92" stroke="var(--line)"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${18+i*(284/Math.max(1,vals.length-1))}" cy="${92-(v-lo)/span*68}" r="3.5" fill="var(--accent)"/>`).join('')}${labels}</svg><div class="muted">${fmt(vals[vals.length-1],S.display)} latest saved snapshot</div></div>`;
}
function allocationHtml(owner){
  const parts=[];
  let cash=0,invest=0,receivable=0;
  for(const a of S.accounts){if(a.archived||(owner&&a.owner!==owner))continue;const v=toDisplay(balance(a),a.cur);if(v>0)cash+=v;}
  for(const h of S.holdings){if(owner&&h.owner!==owner)continue;const v=toDisplay(holdPos(h).v,h.cur);if(v>0)invest+=v;}
  for(const v of Object.values(personPos(owner)))if(v>0)receivable+=v;
  if(cash>0)parts.push(['Cash & accounts',cash]);if(invest>0)parts.push(['Investments',invest]);if(receivable>0)parts.push(['Money lent',receivable]);
  const total=parts.reduce((a,x)=>a+x[1],0);if(!total)return '';
  const colors=['var(--accent)','var(--in)','var(--warn)'];let offset=0;
  const seg=parts.map(([n,v],i)=>{const pct=v/total*100,el=`<span style="display:block;height:12px;width:${pct}%;background:${colors[i]}"></span>`;return {n,v,pct,el};});
  return `<h2>Asset mix</h2><div class="card"><div style="display:flex;overflow:hidden;border-radius:8px;gap:2px">${seg.map(x=>x.el).join('')}</div>${seg.map((x,i)=>`<div class="row"><span><i class="dot" style="background:${colors[i]}"></i>${x.n}</span><b class="num">${fmt(x.v,S.display)} · ${Math.round(x.pct)}%</b></div>`).join('')}</div>`;
}

function viewHome0(){
  if(!S.accounts.length) return `<div class="empty"><div class="big" style="font-size:24px;color:var(--ink)">Welcome</div><p>Add your first account to start. Everything stays encrypted on this phone.</p><button class="btn" data-newacct>Add an account</button></div>`;
  const owners=["All family",...new Set([...S.people,...S.accounts.map(a=>a.owner||"Me"),...S.holdings.map(h=>h.owner||"Me")])];
  if(!owners.includes(homeOwner))homeOwner="All family";
  const owner=homeOwner==="All family"?null:homeOwner;
  const nw=netWorth(owner),t=monthTotals(monthKey(today()),owner);
  const recent=S.txns.filter(x=>!owner||x.owner===owner).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created)).slice(0,5);
  const cats={}; for(const x of S.txns){ if(x.status==="posted"&&x.type==="expense"&&monthKey(x.date)===monthKey(today())&&(!owner||x.owner===owner)){ cats[x.cat]=(cats[x.cat]||0)+toDisplayAt(-x.postings[0].amt,x.postings[0].cur,x.fxRate);} }
  for(const x of S.txns){ if(x.status==="posted"&&x.type==="refund"&&monthKey(x.date)===monthKey(today())&&(!owner||x.owner===owner)&&cats[x.cat]!=null) cats[x.cat]-=toDisplayAt(x.postings[0].amt,x.postings[0].cur,x.fxRate); }
  const top=Object.entries(cats).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,4),max=top.length?top[0][1]:1;
  return `<div class="home-filter"><label>Family view</label><select id="homeOwner">${owners.map(o=>`<option ${homeOwner===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>
  <div class="hero"><div class="muted">${owner?esc(owner)+" · ":"Family net worth · "}${S.display}</div><div class="big num">${fmt(nw.total,S.display)}</div><div class="muted">Assets ${fmt(nw.assets,S.display)} · Liabilities ${fmt(nw.owed,S.display)}</div></div>
  <div class="metric-grid"><div class="metric"><span class="muted">Income this month</span><b class="in num">${fmt(t.inc,S.display)}</b></div><div class="metric"><span class="muted">Spending this month</span><b class="out num">${fmt(t.exp,S.display)}</b></div><div class="metric"><span class="muted">Net cash flow</span><b class="num">${fmt(t.inc-t.exp,S.display)}</b></div><div class="metric"><span class="muted">Accounts</span><b>${S.accounts.filter(a=>!a.archived&&(!owner||a.owner===owner)).length}</b></div></div>
  <div class="quick-grid"><button data-add data-quick="expense">＋ Expense</button><button data-add data-quick="income">＋ Income</button><button data-add data-quick="transfer">⇄ Transfer</button></div>
  ${chartHtml(owner)}
  ${allocationHtml(owner)}
  ${netWorthChartHtml(owner)}
  ${top.length?`<h2>Spending categories</h2><div class="card">${top.map(([c,v])=>`<div style="margin:8px 0"><div class="row"><span>${esc(c)}</span><b class="num">${fmt(v,S.display)}</b></div><div class="bar"><i style="width:${Math.min(100,Math.round(v/max*100))}%"></i></div></div>`).join("")}</div>`:""}
  <h2>Recent activity</h2>${recent.length?`<div class="card">${recent.map(txnRow).join("")}</div>`:`<div class="empty">No transactions yet. Tap + to add your first one.</div>`}`;
}

function txnRow(t){
  const p=t.postings[0]||{amt:t.cost,cur:(S.holdings.find(h=>h.id===t.hold)||{}).cur||"INR"}, a=acct(p.acct);
  let amt, cls, title;
  if(t.type==="transfer"){ const to=t.postings[1]; title=`${esc(a?a.name:"?")} → ${esc(acct(to.acct)?acct(to.acct).name:"?")}`; amt=fmt(-p.amt,p.cur); cls=""; }
  else { title=t.type in LBL?LBL[t.type]+esc(t.person||(S.holdings.find(h=>h.id===t.hold)||{}).name||t.cat||""):esc(t.cat||t.type); amt=(p.amt<0?"−":"+")+fmt(Math.abs(p.amt),p.cur); cls=p.amt<0?"out":"in"; }
  return `<div class="row ${t.status==="voided"?"void":""}" data-txn="${t.id}">
    <div><div>${title}</div><div class="muted">${esc(t.date)}${t.note?" · "+esc(t.note):""}${a&&t.type!=="transfer"?" · "+esc(a.name):""}${a&&a.owner&&a.owner!=="Me"?" · "+esc(a.owner):""}</div></div>
    <b class="${cls} num">${amt}</b></div>`;
}

function viewActivity(){
  let list=S.txns.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created));
  if(filterAcct) list=list.filter(t=>t.postings.some(p=>p.acct===filterAcct));
  if(q){ const s=q.toLowerCase(); list=list.filter(t=>((t.cat||"")+" "+(t.note||"")+" "+t.type).toLowerCase().includes(s)); }
  return `<h2 style="margin-top:4px">Activity</h2>
  <input id="q" type="search" placeholder="Search note or category" value="${esc(q)}">
  <select id="fa" style="margin-top:8px"><option value="">All accounts</option>${S.accounts.map(a=>`<option value="${a.id}" ${filterAcct===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select>
  ${list.length?`<div class="card">${list.map(txnRow).join("")}</div>`:`<div class="empty">No transactions match.</div>`}`;
}

function readmeHtml(){return `<h2 style="margin-top:0">My Finance · App guide</h2>
<div class="card"><b>1. Home dashboard</b><p class="muted">Shows net worth, assets, liabilities, monthly income and spending, six-month cash flow chart, asset mix and recent activity. Use the owner filter to view one family member or everyone. Save monthly net-worth snapshots to build the trend chart.</p></div>
<div class="card"><b>2. Accounts and cards</b><p class="muted">Create bank, cash and credit-card accounts with owner and currency. Bank accounts support bank/provider, branch, IFSC and branch code. Open an account to maintain linked debit-card details or credit-card number suffix, network, expiry, annual fee, credit limit, statement day and due day. Only the last four card digits are saved; CVV/CVC and PIN are never stored.</p></div>
<div class="card"><b>3. Friends / recipient bank accounts</b><p class="muted">Save a friend's account holder, bank, account number/IBAN, IFSC, branch, branch code and currency. Select a saved recipient while recording a transfer. This is a reference record; external transfers do not automatically update balances or contact banks.</p></div>
<div class="card"><b>4. Transactions</b><p class="muted">Record income, expenses and transfers. Transfers between your own accounts are balance movements, not income or expenses. You can edit ordinary transactions, record refunds, void and restore entries, export/import transaction CSV and reconcile account balances.</p></div>
<div class="card"><b>5. Investments and SIPs</b><p class="muted">Track mutual funds and stocks, owners, folios/identifiers, ISIN, units, cost and manually updated prices. Record buy/sell activity, import supported stock holdings files, and set SIP reminders. A SIP reminder never creates a transaction until you confirm the debit and units.</p></div>
<div class="card"><b>6. Insurance</b><p class="muted">Track policy number, provider, owner, commencement, premium, payment frequency, premium-paying term, policy term, sum assured, bonus, maturity and next due date. Mark premiums paid to record the expense.</p></div>
<div class="card"><b>7. Friends and family lending</b><p class="muted">Record money lent or borrowed, principal repayments and interest settlements. Principal is not income/expense; interest is. Interest outstanding is an estimate using simple interest on remaining principal and does not model every daily rate change or compounding convention.</p></div>
<div class="card"><b>8. Purchases and warranties</b><p class="muted">Record purchased items, payment account, amount, date and warranty duration; see upcoming/expired warranty dates.</p></div>
<div class="card"><b>9. Reports, currency and history</b><p class="muted">Change display currency and maintain the EUR/INR rate. Transactions preserve an FX rate at entry; old rates cannot be reconstructed if missing. Save monthly net-worth snapshots for trend reporting.</p></div>
<div class="card"><b>10. Security, backups and limitations</b><p class="muted">The vault is encrypted locally with AES-256-GCM. Passphrase-derived keys use PBKDF2-HMAC-SHA-256 (600,000 iterations for new vaults). Biometric unlock depends on device/browser support. Save encrypted backups regularly. There is no cloud sync, live bank feed, live market-price feed or native push notification. This app has not undergone an independent security audit. Keep the app on HTTPS and protect your phone.</p></div>
<div class="card"><b>11. Important accounting behaviour</b><p class="muted">Credit-card purchases increase card liability and count as expenses. Paying a credit-card bill reduces bank balance and card liability; it is not a second expense. Own-account transfers are not income/expense. Loan principal is not income/expense. Reconciliation posts an adjustment rather than silently changing history.</p></div>
<button class="btn alt" data-close>Close guide</button>`;}

function openSheet(html){ $("#layer").innerHTML = `<div class="sheet-bg" data-close><div class="sheet" role="dialog">${html}</div></div>`; }
function closeSheet(){ $("#layer").innerHTML=""; }
function toast(msg, undo){
  const el=document.createElement("div"); el.className="toast"; el.innerHTML=`<span>${esc(msg)}</span>${undo?`<button>Undo</button>`:""}`;
  document.body.appendChild(el);
  const t=setTimeout(()=>el.remove(),5000);
  if(undo) el.querySelector("button").onclick=()=>{ clearTimeout(t); el.remove(); undo(); };
}

function addSheet(){
  if(!S.accounts.length){ newAcctSheet(); return; }
  if(sheetType==="invest"||sheetType==="lend") return addSheet2();
  const cats = sheetType==="income"?INCOME_CATS:EXPENSE_CATS;
  if(!chosenCat || !cats.includes(chosenCat)) chosenCat = cats[0];
  const def = S.lastAcct && acct(S.lastAcct) ? S.lastAcct : S.accounts[0].id;
  const opts = (sel)=>S.accounts.filter(a=>!a.archived).map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${esc(a.name)} (${a.cur})</option>`).join("");
  const other = S.accounts.find(a=>a.id!==def);
  openSheet(`
  <div class="seg" id="seg">${["expense","income","transfer","invest","lend"].map(k=>`<button data-type="${k}" class="${sheetType===k?"on":""}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div>
  <form id="f" autocomplete="off">
    <input class="amt" id="amt" inputmode="decimal" placeholder="0" aria-label="Amount" autofocus>
    ${sheetType==="transfer"?`
      <label>From</label><select id="from">${opts(def)}</select>
      <label>To</label><select id="to">${opts(other?other.id:def)}</select>
      <label>Recipient bank account (optional)</label><select id="recipientBank"><option value="">Not specified / own account transfer</option>${S.bankContacts.map(b=>`<option value="${b.id}">${esc(b.person)} · ${esc(b.bank)} · ${esc(b.accountMasked||"")}</option>`).join("")}</select><div id="recvWrap"></div>`:`
      <label>Category</label><div class="chips" id="cats">${cats.map(c=>`<button type="button" class="chip ${c===chosenCat?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <label>${sheetType==="income"?"Into account":"From account"}</label><select id="from">${opts(def)}</select>`}
    <label>Date</label><input type="date" id="date" value="${today()}">
    <label>Note (optional)</label><input id="note" maxlength="80">

  setTimeout(()=>{ const a=$("#amt"); if(a) a.focus(); },50);

function updateRecv(){
  const w=$("#recvWrap"); if(!w) return;
  const f=acct($("#from").value), t=acct($("#to").value);
  w.innerHTML = (f&&t&&f.cur!==t.cur)?`<label>Amount received (${t.cur})</label><input id="recv" inputmode="decimal" placeholder="0">`:"";
}

/* ---------- integrity check ---------- */
function runCheck(){
  const issues=[]; const ids=new Set();
  for(const t of S.txns){
    if(ids.has(t.id)) issues.push("Duplicate ID "+t.id); ids.add(t.id);
    if(!Array.isArray(t.postings)) issues.push("Transaction has no postings");
    for(const p of (t.postings||[])) if(!acct(p.acct)) issues.push("A transaction points at a missing account");
    if(t.fxRate!=null&&!(Number(t.fxRate)>0)) issues.push("Invalid historical FX rate on "+t.id);
    if(t.type==="transfer" && t.postings.length!==2) issues.push("Transfer without two sides");
    if(t.type!=="transfer" && t.type!=="open" && t.type!=="adjust" && t.type!=="adjustment" && t.postings.length!==1) issues.push("Unexpected postings on "+t.type);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(t.date)) issues.push("Bad date on a transaction");
  }
  openSheet(`<h2 style="margin-top:0">${issues.length?"Problems found":"All good"}</h2>
  <p class="muted">${S.txns.length} transactions, ${S.accounts.length} accounts and ${S.lending.length} lending records checked.</p>
  ${issues.length?`<ul>${[...new Set(issues)].map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:""}
  <button class="btn alt" data-close>Close</button>`);
}

/* ---------- export / import ---------- */
function download(name, text, type){
  const blob=new Blob([text],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},1000);
}
async function exportJSON(){
  const filename=`finance-backup-${today()}.enc`, encrypted=await seal(S);
  try{const h=await backupHandleGet();if(h){const permission=await backupPermission(h,true);if(permission==="granted"&&h.createWritable){const file=await h.getFileHandle(filename,{create:true}),writable=await file.createWritable();try{await writable.write(new Blob([encrypted],{type:"application/octet-stream"}));await writable.close();}catch(err){try{await writable.abort();}catch(_){}throw err;}toast("Encrypted backup saved to "+(h.name||"selected folder"));await backupDestinationStatus();return;}await backupDestinationStatus();toast("Folder permission unavailable. Opening download fallback.");}}catch(err){console.warn("Folder backup failed; fallback download",err);toast("Folder save failed. Opening download fallback.");}
  download(filename,encrypted,"application/octet-stream");
}
function exportCSV(){
  const rows=[["id","date","type","status","category","note","account","account_owner","amount","currency","fx_rate","person","reference"]];
  for(const t of S.txns) for(const p of t.postings) rows.push([t.id,t.date,t.type,t.status,t.cat||"",t.note||"",(acct(p.acct)||{}).name||"",(acct(p.acct)||{}).owner||"Me",p.amt,p.cur,t.fxRate||S.rate,t.person||"",t.id]);
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  download(`transactions-${today()}.csv`, csv, "text/csv");
}

        if(confirm(`Replace current data with this backup (${d.accounts.length} accounts, ${d.txns.length} transactions)?`)){ S=d; if(importedKey){CK=importedKey;SALT=importedSalt;KDF_ITER=importedIter;BIO=importedBio;if(KDF_ITER<600000){SALT=crypto.getRandomValues(new Uint8Array(16));KDF_ITER=600000;CK=await deriveKey(importedPassword,SALT,KDF_ITER,false);BIO=null;}} migrate(); save(); render(); toast("Backup restored"); }
      }catch(err){ alert("Could not open that file. Check the passphrase and the file."); } };
    rd.readAsText(f); e.target.value="";
  }
});
document.addEventListener("input", e=>{ if(e.target.id==="q"){ q=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); } });

document.addEventListener("submit", e=>{
  e.preventDefault();
  if(e.target.id==="fedit"){
    const t=S.txns.find(x=>x.id===$("#editId").value);if(!t||t.status!=="posted")return;
    const a=acct($("#edFrom").value),amt=parseAmt($("#edAmt").value),date=$("#edDate").value||today(),note=$("#edNote").value.trim();if(!a||amt<=0){alert("Choose a valid account and positive amount.");return;}
    if(t.type==="transfer"){
      const to=acct($("#edTo").value);if(!to||to.id===a.id){alert("Choose two different accounts.");return;}let recv=amt;if(a.cur!==to.cur){recv=parseAmt($("#edRecv").value);if(recv<=0){alert("Enter the amount received in the destination currency.");return;}}
      t.postings=[{acct:a.id,amt:-amt,cur:a.cur},{acct:to.id,amt:recv,cur:to.cur}];
    }else{if(t.postings[0]?.cur!==a.cur)t.fxRate=S.rate;t.postings=[{acct:a.id,amt:t.type==="income"?amt:-amt,cur:a.cur}];t.cat=$("#edCat").value.trim();}
    t.date=date;t.note=note;if(!t.fxRate)t.fxRate=S.rate;t.owner=a.owner||"Me";log("edit",t.id);save();closeSheet();render();toast("Transaction updated");return;
  }
  if(e.target.id==="fpass"){
    (async()=>{try{const old=$("#oldPass").value,n1=$("#newPass").value,n2=$("#newPass2").value;if(n1.length<12)throw new Error("Use at least 12 characters for the new passphrase.");if(n1!==n2)throw new Error("The new passphrases do not match.");const oldKey=await deriveKey(old,SALT,KDF_ITER,false);await unseal(JSON.parse(store.get()),oldKey);const nextSalt=crypto.getRandomValues(new Uint8Array(16)),nextKey=await deriveKey(n1,nextSalt,KDF_ITER,false);await chain;SALT=nextSalt;CK=nextKey;BIO=null;const env=await seal(S);store.set(env);chain=Promise.resolve();toast("Passphrase changed. Fingerprint unlock was disabled; enable it again if desired.");closeSheet();render();}catch(err){alert("Passphrase not changed: "+(err.message||"verification failed"));}})();return;
  }
  if(e.target.id==="f"){
    const amt=parseAmt($("#amt").value);
    if(amt<=0){ $("#amt").focus(); return; }
    const date=$("#date").value||today(), note=$("#note").value.trim();
    const from=acct($("#from").value);
    let t;
    if(sheetType==="transfer"){
      const to=acct($("#to").value);
      if(!to||from.id===to.id){ alert("Choose two different accounts."); return; }
      let recv=amt;
      if(from.cur!==to.cur){ recv=parseAmt(($("#recv")||{}).value); if(recv<=0){ alert("Enter the amount received in "+to.cur+"."); return; } }
      t={type:"transfer",date,note,recipientBankId:$("#recipientBank")?.value||"",recipientBank:(()=>{const b=S.bankContacts.find(x=>x.id===$("#recipientBank")?.value);return b?{person:b.person,bank:b.bank,accountMasked:b.accountMasked,ifsc:b.ifsc||"",branch:b.branch||"",branchCode:b.branchCode||""}:null;})(),postings:[{acct:from.id,amt:-amt,cur:from.cur},{acct:to.id,amt:recv,cur:to.cur}]};
    }else{
      const sign=sheetType==="income"?1:-1;
      t={type:sheetType,date,note,cat:chosenCat,postings:[{acct:from.id,amt:sign*amt,cur:from.cur}]};
      S.lastAcct=from.id;
    }
    const saved=addTxn(t); closeSheet(); render();
    toast("Saved",()=>{ voidTxn(saved.id); render(); });
  }
  if(e.target.id==="f2"){
    const amt=parseAmt($("#amt").value); if(amt<=0){ $("#amt").focus(); return; }
    const a=acct($("#from").value), date=$("#date").value||today(), note=$("#note").value.trim(); let t;
    if(sheetType==="invest"){
      const h=S.holdings.find(x=>x.id===$("#ih").value), u=parseAmt($("#iu").value), buy=$("#ia").value==="buy";
      if(!h||u<=0){ alert("Enter the number of units."); return; }
      if(a.cur!==h.cur){ alert("Use an account in "+h.cur+" for this holding."); return; }
      if(!buy && u>holdPos(h).u+1e-9){ alert("You hold only "+holdPos(h).u+" units."); return; }
      t={type:buy?"buy":"sell",date,note,hold:h.id,units:u,cost:amt,postings:[{acct:a.id,amt:buy?-amt:amt,cur:a.cur}]};
      if(buy&&!h.price) h.price=Math.round(amt/u*10000)/10000;
    }else{
      const k=$("#la").value, person=$("#lp").value.trim(); if(!person){ $("#lp").focus(); return; }
      const m={lend:[-1,1,"lend"],lendback:[1,-1,"lendback"],borrow:[1,-1,"borrow"],repay:[-1,1,"repay"]};
      if(m[k]) t={type:m[k][2],date,note,person,pd:m[k][1]*amt,postings:[{acct:a.id,amt:m[k][0]*amt,cur:a.cur}]};
      else t={type:k==="intin"?"income":"expense",cat:"Interest",date,note,person,postings:[{acct:a.id,amt:(k==="intin"?1:-1)*amt,cur:a.cur}]};
    }
    S.lastAcct=a.id; const sv=addTxn(t); closeSheet(); render(); toast("Saved",()=>{ voidTxn(sv.id); render(); });
  }
  if(e.target.id==="frecon"){
    const a=acct($("#raid").value), actual=parseAmt($("#ractual").value), date=$("#rdate").value||today(), note=$("#rnote").value.trim();
    if(!a)return; const diff=Math.round((actual-balance(a))*100)/100;
    if(Math.abs(diff)<0.005){closeSheet();toast("Already reconciled");return;}
    addTxn({type:"adjustment",date,cat:"Balance adjustment",note,postings:[{acct:a.id,amt:diff,cur:a.cur}]});
    closeSheet();render();toast("Balance updated");return;
  }
  if(e.target.id==="flend"){
    const person=$("#lpname").value.trim(), principal=parseAmt($("#lprincipal").value), cur=$("#lcur").value, a=acct($("#laccount").value), dir=$("#ldir").value, rate=parseAmt($("#lrate").value), start=$("#lstart").value||today();
    if(!person||principal<=0||!a){alert("Enter a person, positive amount and account.");return;}
    if(a.cur!==cur){alert("Choose a cash account in "+cur+".");return;}
    if(rate<0){alert("Interest rate cannot be negative.");return;}
    const l={id:uid(),person,direction:dir,principal,rate,cur,start,account:a.id};
    S.lending.push(l); if(!S.people.includes(person))S.people.push(person);
    addTxn({type:dir==="lent"?"lend":"borrow",date:start,person,loanId:l.id,pd:dir==="lent"?principal:-principal,postings:[{acct:a.id,amt:dir==="lent"?-principal:principal,cur}]});
    save();closeSheet();render();toast("Lending record saved");return;
  }
  if(e.target.id==="flr"){
    const l=S.lending.find(x=>x.id===$("#lrid").value), amount=parseAmt($("#lramt").value), a=acct($("#lracct").value), date=$("#lrdate").value||today(), note=$("#lrnote").value.trim(), kind=$("#lrtype").value;
    if(!l||amount<=0||!a){alert("Enter a positive amount and account.");return;}
    if(a.cur!==l.cur){alert("Choose an account in "+l.cur+".");return;}
    const p=lendingPosition(l);
    if(kind==="principal"&&amount>p.principal+0.005){alert("Principal transaction exceeds the outstanding principal.");return;}
    if(kind==="principal"){
      const incoming=l.direction==="lent", typ=incoming?"lendback":"repay";
      addTxn({type:typ,date,person:l.person,loanId:l.id,pd:incoming?-amount:amount,principalReduction:amount,postings:[{acct:a.id,amt:incoming?amount:-amount,cur:l.cur}],note});
    }else{
      const incoming=l.direction==="lent", typ=incoming?"income":"expense";
      addTxn({type:typ,date,person:l.person,loanId:l.id,interestSettlement:true,cat:"Interest",postings:[{acct:a.id,amt:incoming?amount:-amount,cur:l.cur}],note});
    }
    save();closeSheet();render();toast("Lending transaction saved");return;
  }
  if(e.target.id==="fh"){
    const name=$("#hn").value.trim(); if(!name) return;
    const h={id:uid(),name,type:$("#ht").value,owner:($("#ho").value.trim()||"Me"),
      symbol:($("#hsym")?.value||"").trim(),exchange:($("#hex")?.value||"").trim(),
      demat:($("#hdemat")?.value||"").trim(),broker:"",amc:($("#hamc")?.value||"").trim(),
      folio:($("#hfolio")?.value||"").trim(),isin:($("#hisin")?.value||"").trim(),
      cur:$("#hc").value,price:0,notes:($("#hnotes")?.value||"").trim()};
    const hist=!!$("#hhistorical")?.checked;
    const units=parseAmt($("#hunits")?.value||"0");
    const cost=parseAmt($("#hcost")?.value||"0");
    const price=parseAmt($("#hprice")?.value||"0");
    const hdate=($("#hdate")?.value)||today();
    if(hist){
      if(units<=0||cost<=0){ alert("For a historical holding enter units owned and total invested amount."); return; }
      if(price>0) h.price=price;
    }
    S.holdings.push(h);
    if(!S.people.includes(h.owner)) S.people.push(h.owner);
    log("holding",h.id);
    if(hist){
      addTxn({type:"open",date:hdate,note:"Historical opening position",hold:h.id,units,cost:Math.round(cost*100)/100,owner:h.owner,postings:[]});
    }
    save(); closeSheet(); render();
    toast(hist?"Historical holding saved (no bank debit)":"Holding saved");
  }
  if(e.target.id==="fp"){ const h=S.holdings.find(x=>x.id===$("#hid").value); if(h){ h.price=parseAmt($("#hp").value); save(); } closeSheet(); render(); }
  if(e.target.id==="fs1"){ const h=S.holdings.find(v=>v.id===$("#sh").value), a=acct($("#sa").value), m=parseAmt($("#sm").value); if(!h||m<=0) return; if(a.cur!==h.cur){ alert("Use an account in "+h.cur+"."); return; } S.sips.push({id:uid(),hold:h.id,acct:a.id,amt:m,cur:a.cur,freq:+$("#sf").value||1,next:$("#sd").value||today()}); save(); closeSheet(); render(); }
  if(e.target.id==="fsu"){ const x=S.sips.find(v=>v.id===$("#sid").value), u=parseAmt($("#su").value); if(!x||u<=0){ $("#su").focus(); return; } addTxn({type:"buy",date:x.next,note:"SIP",hold:x.hold,units:u,cost:x.amt,sip:x.id,postings:[{acct:x.acct,amt:-x.amt,cur:x.cur}]}); x.next=addM(x.next,x.freq||1); save(); closeSheet(); render(); toast("SIP recorded"); }
  if(e.target.id==="fpol"){ const n=$("#pn").value.trim(); if(!n) return; S.policies.push({id:uid(),name:n,policyNo:$("#pno").value.trim(),provider:$("#pp").value.trim(),owner:$("#po").value||"Me",start:$("#pstart").value||"",sum:parseAmt($("#ps").value),bonus:parseAmt($("#bonus").value),premium:parseAmt($("#pa").value),ppt:parseAmt($("#ppt").value),term:parseAmt($("#pt").value),maturity:$("#mat").value||"",cur:$("#pc").value,freq:+$("#pf").value,next:$("#pd").value||today()}); save(); closeSheet(); render(); }
  if(e.target.id==="fpay"){ const p=S.policies.find(v=>v.id===$("#pid").value), a=acct($("#pacc").value); if(!p||!a) return; if(a.cur!==p.cur){ alert("Pay from an account in "+p.cur+"."); return; } addTxn({type:"expense",date:today(),cat:"Insurance premium",note:p.name,postings:[{acct:a.id,amt:-p.premium,cur:a.cur}]}); p.next=addM(p.next,p.freq); save(); closeSheet(); render(); toast("Premium recorded"); }
  if(e.target.id==="fpur"){ const it=$("#un").value.trim(), am=parseAmt($("#ua").value), a=acct($("#uc").value), w=Math.round(parseAmt($("#uw").value)), dt=$("#ud").value||today(); if(!it||am<=0||!a) return; addTxn({type:"expense",date:dt,cat:"Shopping",note:it,postings:[{acct:a.id,amt:-am,cur:a.cur}]}); S.purchases.push({id:uid(),item:it,date:dt,amt:am,cur:a.cur,expiry:w>0?addM(dt,w):null}); save(); closeSheet(); render(); }
  if(e.target.id==="fbank"){const number=$("#ba").value.trim().replace(/\s/g,"");const person=$("#bp").value.trim(),holder=$("#bh").value.trim(),bank=$("#bb").value.trim();if(!number||!person||!holder||!bank)return;const b={id:uid(),person,holder,bank,accountNumber:number,accountMasked:number.length>8?"••••"+number.slice(-4):"••••"+number.slice(-4),ifsc:$("#bi").value.trim().toUpperCase(),branch:$("#br").value.trim(),branchCode:$("#bc").value.trim(),cur:$("#bcur").value,nickname:$("#bn").value.trim()};S.bankContacts.push(b);if(!S.people.includes(person))S.people.push(person);log("recipient-bank",b.id);save();closeSheet();render();toast("Recipient account saved");return;}
  if(e.target.id==="fcard"){ const a=acct($("#cid").value); if(a){ const entered=($("#cardnumber")?.value||"").replace(/\D/g,""); const last4=entered?entered.slice(-4):($("#last4")?.value||"").replace(/\D/g,"").slice(-4); const expiry=($("#expiry")?.value||"").trim(); if(expiry&&!/^(0[1-9]|1[0-2])\/([0-9]{2})$/.test(expiry)){alert("Enter expiry as MM/YY.");return;} a.cardMeta={last4,network:($("#network")?.value||"").trim(),expiry,annualFee:parseAmt($("#annualFee")?.value||"0")}; if(a.type==="bank"){a.bank=$("#abankEdit")?.value.trim()||a.bank||"";a.branch=$("#abranchEdit")?.value.trim()||"";a.ifsc=$("#aifscEdit")?.value.trim().toUpperCase()||"";a.branchCode=$("#abranchcodeEdit")?.value.trim()||"";} if(a.type==="card"){a.limit=parseAmt($("#cl").value);const day=v=>{const n=Math.round(parseAmt(v));return n>=1&&n<=31?n:0;};a.stmtDay=day($("#cs").value);a.dueDay=day($("#cd").value);} log("account-details",a.id);save(); } closeSheet(); render(); }
  if(e.target.id==="fa2"){

    S.accounts.push(a); if(!S.people.includes(a.owner))S.people.push(a.owner); log("account",a.id); save(); closeSheet(); render();
  }
});

function boot(){
  let env=null, legacy=null;
  try{ const d=JSON.parse(store.get()); if(d&&d.enc) env=d; else if(d&&d.v===1) legacy=d; }catch(e){}
  BIO=env?.bio||null;KDF_ITER=env?.iterations||250000;
  $("#nav").innerHTML="";$("#layer").innerHTML="";
  $("#app").innerHTML=`<div style="padding-top:42px"><div class="big" style="font-size:28px">My Finance</div><p class="muted">${env?"Your encrypted finance vault is locked.":"Create a strong passphrase. It encrypts your data on this phone and in backup files."}</p><form id="pf"><input id="pp" type="password" autocomplete="current-password" placeholder="Passphrase" required>${env?"":`<input id="pp2" type="password" autocomplete="new-password" placeholder="Repeat passphrase" style="margin-top:8px">`}<div id="pe" class="out" style="margin-top:8px"></div><button class="btn" type="submit">${env?"Unlock with passphrase":"Create secure vault"}</button></form>${env?.bio?`<button class="btn alt" data-bio-unlock>Use fingerprint / device passkey</button>`:""}<div class="security-note" style="margin-top:18px">Encryption: AES-256-GCM. Passphrase key derivation: PBKDF2-HMAC-SHA-256. Never share your passphrase. If you lose it and have no working biometric unlock, encrypted data cannot be recovered.</div></div>`;
  $("#pf").onsubmit=async e=>{
    e.preventDefault();const p=$("#pp").value,er=m=>{$("#pe").textContent=m;};
    try{
      if(env){SALT=unb64(env.salt);const k=await deriveKey(p,SALT,KDF_ITER);S=await unseal(env,k);CK=k;BIO=env.bio||null;
        if(KDF_ITER<600000){const ns=crypto.getRandomValues(new Uint8Array(16)),nk=await deriveKey(p,ns,600000);SALT=ns;CK=nk;KDF_ITER=600000;BIO=null;store.set(await seal(S));}
      }else{
        if(p.length<12)return er("Use at least 12 characters. A unique multi-word passphrase is best.");if(p!==$("#pp2").value)return er("The two passphrases differ.");SALT=crypto.getRandomValues(new Uint8Array(16));KDF_ITER=600000;CK=await deriveKey(p,SALT,KDF_ITER);S=legacy||blank();BIO=null;
      }
      migrate();save();render();
    }catch(x){S=null;CK=null;er("Could not unlock. Check your passphrase or use fingerprint unlock.");}
  };
}

let hidAt=0;
document.addEventListener("visibilitychange",()=>{ if(!S) return; if(document.hidden) hidAt=Date.now(); else if(Date.now()-hidAt>120000) chain=chain.then(()=>{ S=null; CK=null; boot(); }); });
boot();
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
